services:
  redis:
    image: redis:7-alpine
    container_name: live2mp3${ENV_SUFFIX}-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - internal

  app:
    build: .
    image: live2mp3${ENV_SUFFIX}:latest
    container_name: live2mp3${ENV_SUFFIX}-app
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://live2mp3${ENV_SUFFIX}-redis:6379/0
      APP_ENV: ${APP_ENV:-prod}
      GIT_COMMIT: ${GIT_COMMIT:-}
      # Promotion/rétrogradation gestionnaire via l'API Authentik (groupe app).
      AUTHENTIK_URL: ${AUTHENTIK_URL:-http://authentik-server:9000}
      AUTHENTIK_API_TOKEN: ${AUTHENTIK_API_TOKEN:-}
    volumes:
      # Stockage des albums : bind-mount hôte, partagé prod/preprod (voir DEPLOY.md).
      # `:?` = échec bruyant si absent du .env, plutôt qu'un repli silencieux
      # sur un volume vide (cf. workspace/debugging/2026-07-15_prod-volume-nomme.md).
      - ${PROJECTS_DIR:?PROJECTS_DIR manquant dans .env}:/app/projects
      - ./templates:/app/templates
    networks:
      - internal
      - web          # réseau partagé apps_web -> joignable par nginx
    depends_on:
      - redis

  worker:
    build: .
    image: live2mp3${ENV_SUFFIX}:latest
    container_name: live2mp3${ENV_SUFFIX}-worker
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://live2mp3${ENV_SUFFIX}-redis:6379/0
      APP_ENV: ${APP_ENV:-prod}
      GIT_COMMIT: ${GIT_COMMIT:-}
    command: python -m backend.worker
    volumes:
      - ${PROJECTS_DIR:?PROJECTS_DIR manquant dans .env}:/app/projects
      - ./templates:/app/templates
    networks:
      - internal
    depends_on:
      - redis

networks:
  internal:
    driver: bridge
  web:
    external: true
    name: apps_web

volumes:
  redis-data:
    name: live2mp3${ENV_SUFFIX}_redis-data
