<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>document.documentElement.dataset.theme=localStorage.getItem("l2m-theme")||"dark";</script>
<title>live2mp3 — profil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">
<link rel="stylesheet" href="/static/shared/naerod-social.css">
<link rel="stylesheet" href="/static/app.css">
<link rel="stylesheet" href="/static/albums.css">
<script type="module" src="https://static.dorianjulien.com/ui/header/v1.js"></script>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<style>
  .prof-edit{display:none;flex-direction:column;gap:12px;margin-top:16px}
  .prof-edit.open{display:flex}
  .prof-edit .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .prof-avatar-edit{position:relative}
  .prof-avatar-edit .cam{position:absolute;right:-4px;bottom:-4px;width:30px;height:30px;
    border-radius:50%;background:var(--accent);color:#0d0f13;display:flex;align-items:center;
    justify-content:center;cursor:pointer;border:2px solid var(--bg)}
  .prof-avatar-edit .cam .material-symbols-outlined{font-size:17px}
  /* Barre d'outils des grilles d'albums (Publications, Likes) : tri + taille d'affichage,
     comme sur la vitrine. Le groupe de tailles a la hauteur de la liste de tri (38 px ;
     44 px sur mobile) : groupe = bouton + 6 px de bordure et de marge interne. */
  .alb-tools{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;
    gap:12px;margin:16px 0 8px}
  nrd-density{--nrd-density-btn:32px;--nrd-density-icon:20px}
  @media(max-width:700px){
    .alb-tools .sort-block{flex:1 1 200px;min-width:0}
    nrd-density{--nrd-density-btn:38px;--nrd-density-icon:22px}
  }
  .notfound{text-align:center;color:var(--muted);margin-top:60px}
  .notfound .material-symbols-outlined{font-size:56px;display:block;margin-bottom:12px}
</style>
  <!-- Umami analytics (self-hosted, sans cookie) -->
  <script defer src="https://umami.naerod.com/s.js" data-website-id="d1359ac2-4b3b-4f2a-8b2a-8409690cd76a"></script>
</head>
<body>
<header></header>

<main id="main">
  <div class="page-nav">
    <button class="icon-btn" onclick="history.back()"><span class="material-symbols-outlined">arrow_back</span><span id="t-back">Retour</span></button>
    <button class="icon-btn" id="edit-btn" style="display:none"><span class="material-symbols-outlined">edit</span><span id="t-edit">Modifier le profil</span></button>
  </div>
  <div id="content"></div>
</main>

<script src="/static/social.js"></script>
<script src="/static/albums.js"></script>
<script src="/static/profile.js"></script>
</body>
</html>
