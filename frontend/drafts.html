<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>document.documentElement.dataset.theme=localStorage.getItem("l2m-theme")||"dark";</script>
<title>live2mp3 — brouillons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">
<link rel="stylesheet" href="/static/shared/naerod-social.css">
<link rel="stylesheet" href="/static/app.css">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<style>
  .dr-head{display:flex;align-items:center;gap:10px;margin:6px 0 4px}
  .dr-head .material-symbols-outlined{font-size:30px;color:var(--accent)}
  .dr-head h1{font-size:22px;font-weight:700;margin:0}
  .dr-sub{color:var(--muted);font-size:13.5px;line-height:1.5;margin:0 0 16px}
  .dr-list{display:flex;flex-direction:column;gap:8px}
  /* --- File des rendus en cours --- */
  .q-card{margin-bottom:18px}
  .q-list{display:flex;flex-direction:column;gap:8px}
  .q-row{display:flex;align-items:center;gap:12px;padding:12px 14px;
    border:1px solid var(--border);border-radius:12px;background:var(--card)}
  .q-row[draggable="true"]{cursor:grab}
  .q-dragging{opacity:.5}
  .q-running{border-color:var(--accent)}
  .q-running .q-ico{color:var(--accent);animation:q-spin 1.6s linear infinite}
  .q-paused{opacity:.72}
  @keyframes q-spin{to{transform:rotate(360deg)}}
  .q-body{display:flex;flex-direction:column;gap:3px;flex:1;min-width:0}
  .q-title{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .q-meta{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted)}
  .q-tag{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    padding:2px 6px;border-radius:5px;background:rgba(255,255,255,.09)}
  .q-tag-mp4{background:rgba(220,60,60,.24)}
  .q-kind{font-size:12px;font-weight:600;color:var(--fg);opacity:.85}
  .q-pct{font-variant-numeric:tabular-nums}
  .q-stage{font-size:12.5px;color:var(--fg);opacity:.9}
  /* Corps de ligne cliquable : rouvre le détail du rendu. Les boutons pause et
     arrêt restent en dehors — un clic destructeur ne part jamais d'un geste de
     navigation. */
  .q-open{cursor:pointer;border-radius:8px;padding:2px 6px;margin:-2px -6px;
    transition:background .15s}
  .q-open:hover,.q-open:focus-visible{
    background:color-mix(in srgb,var(--accent) 10%,transparent)}
  .q-open:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  /* Avancement réel du job (ffmpeg) ; en indéterminé tant qu'aucune mesure
     n'est encore remontée — un 0 % figé se lit comme un blocage. */
  .q-bar{height:4px;margin-top:8px;border-radius:4px;overflow:hidden;
    background:var(--border)}
  .q-fill{height:100%;border-radius:4px;background:var(--accent);width:0;
    transition:width .4s ease}
  .q-indet .q-fill{width:40%;
    animation:q-indet 1.15s cubic-bezier(.4,0,.6,1) infinite}
  @keyframes q-indet{0%{margin-left:-40%}100%{margin-left:100%}}
  .q-paused .q-fill{background:var(--muted)}
  .q-none{display:flex;align-items:center;gap:8px;color:var(--muted);
    font-size:13px;padding:10px 2px}
  .q-none .material-symbols-outlined{font-size:19px;color:var(--ok)}
  @media(prefers-reduced-motion:reduce){
    .q-indet .q-fill{animation:none;width:100%;opacity:.5}
    .q-running .q-ico{animation:none}
  }
  /* Ligne cliquable = reprise de l'import ; la corbeille est un bouton à part
     (stopPropagation) pour qu'un clic destructeur ne soit jamais accidentel. */
  .dr-row{display:grid;grid-template-columns:1fr auto auto auto;gap:14px;align-items:center;
    padding:13px 15px;border-radius:12px;border:1px solid var(--border);
    background:var(--card);cursor:pointer;text-align:left;width:100%;margin:0;
    transition:border-color .15s,background .15s}
  .dr-row:hover{border-color:var(--accent);
    background:color-mix(in srgb,var(--accent) 7%,var(--card))}
  .dr-main{display:flex;flex-direction:column;gap:3px;min-width:0}
  .dr-title{font-size:15px;font-weight:600;color:var(--fg);line-height:1.3;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dr-artist{font-size:13px;color:var(--accent);font-weight:500;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dr-meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;
    font-size:12px;color:var(--muted);margin-top:2px}
  .dr-meta-i{display:inline-flex;align-items:center;gap:4px}
  .dr-meta-i .material-symbols-outlined{font-size:14px}
  .dr-age{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;
    font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap;
    color:var(--muted);border:1px solid var(--border);background:var(--bg)}
  .dr-age .material-symbols-outlined{font-size:14px}
  /* Un brouillon qui traîne depuis longtemps se signale : orange après 7 jours,
     rouge après 30 — repérage immédiat de ce qui est réellement abandonné. */
  .dr-age.warn{color:var(--run);border-color:color-mix(in srgb,var(--run) 45%,transparent);
    background:color-mix(in srgb,var(--run) 12%,var(--bg))}
  .dr-age.old{color:var(--danger,#e57373);
    border-color:color-mix(in srgb,var(--danger,#e57373) 45%,transparent);
    background:color-mix(in srgb,var(--danger,#e57373) 12%,var(--bg))}
  .dr-owner{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;
    color:var(--fg);white-space:nowrap}
  .dr-owner .soc-avatar{width:24px;height:24px;font-size:11px}
  .dr-del{display:inline-flex;align-items:center;justify-content:center;
    width:34px;height:34px;margin:0;padding:0;border-radius:9px;flex-shrink:0;
    border:1px solid var(--border);background:var(--bg);cursor:pointer;
    color:var(--danger,#e57373);transition:border-color .15s,background .15s}
  .dr-del:hover:not(:disabled){border-color:var(--danger,#e57373);
    background:color-mix(in srgb,var(--danger,#e57373) 12%,var(--bg))}
  .dr-del:disabled{opacity:.35;cursor:not-allowed;color:var(--muted)}
  .dr-del .material-symbols-outlined{font-size:19px}
  .dr-empty{text-align:center;color:var(--muted);margin-top:56px}
  .dr-empty .material-symbols-outlined{font-size:56px;display:block;margin-bottom:12px}
  .dr-empty .dr-empty-t{font-size:15px;font-weight:600;color:var(--fg);margin-bottom:4px}
  .notfound{text-align:center;color:var(--muted);margin-top:60px}
  .notfound .material-symbols-outlined{font-size:56px;display:block;margin-bottom:12px}
  @media (max-width:700px){
    .dr-row{grid-template-columns:1fr auto;row-gap:10px}
    .dr-main{grid-column:1/3}
    .dr-owner{grid-column:1;grid-row:2;justify-self:start}
    .dr-side{grid-column:1;grid-row:3;justify-self:start}
    .dr-del{grid-column:2;grid-row:2/4;align-self:center}
  }
</style>
  <!-- Umami analytics (self-hosted, sans cookie) -->

</head>
