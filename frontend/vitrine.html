<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>live2mp3 — nos albums</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">
<link rel="stylesheet" href="/static/app.css">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<style>
  .hero{padding:30px 0 6px}
  .hero h1{font-size:30px;margin:0 0 6px}
  .hero p{color:var(--muted);margin:0}
  .toolbar{margin:20px 0 6px;display:flex;flex-direction:column;gap:10px}
  .toolbar-main{display:flex;align-items:center;gap:10px}
  .sort-block{display:flex;align-items:center;gap:7px;flex-shrink:0}
  .search{position:relative;flex:1}
  .search .material-symbols-outlined{position:absolute;left:12px;top:50%;
    transform:translateY(-50%);color:var(--muted);font-size:20px;pointer-events:none}
  .search input{width:100%;padding:12px 14px 12px 42px;font-size:14px}
  .toolbar-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .sort-label{color:var(--muted);font-size:12px;font-weight:500;white-space:nowrap;
    display:flex;align-items:center;gap:5px}
  .sort-label .material-symbols-outlined{font-size:15px}
  .chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;
    border-radius:999px;border:1px solid var(--border);background:var(--card);
    color:var(--muted);font-size:12.5px;font-weight:500;cursor:pointer;
    transition:all .15s;white-space:nowrap}
  .chip:hover{border-color:var(--accent);color:var(--fg)}
  .chip.active{background:var(--accent);color:#0d0f13;border-color:var(--accent)}
  .sep{width:1px;height:18px;background:var(--border);margin:0 2px}
  .count{color:var(--muted);font-size:12.5px;margin-left:auto}
  #sort-select{height:32px;padding:0 10px;font-size:13px;cursor:pointer;border-radius:8px;min-width:160px}
  /* Vue par artiste */
  .artist-group{margin-bottom:28px}
  .artist-sep{display:flex;align-items:center;gap:14px;margin:36px 0 14px}
  .artist-bar{flex:1;height:3px;background:var(--accent);border-radius:2px;opacity:.65}
  .artist-name{font-size:20px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;color:var(--fg)}
  .albums{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:18px;margin-top:18px}
  .album{position:relative;background:var(--card);border:1px solid var(--border);
    border-radius:16px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;
    transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
  .album:hover{transform:translateY(-6px);border-color:var(--accent);
    box-shadow:0 14px 30px -14px rgba(0,0,0,.6)}
  .album:hover .cover-img{transform:scale(1.03)}
  .cover-img{transition:transform .25s ease}
  .new-badge{position:absolute;top:10px;left:10px;z-index:2;display:flex;align-items:center;
    gap:3px;padding:3px 8px 3px 5px;border-radius:7px;
    background:var(--accent);color:#0d0f13;font-size:10.5px;font-weight:700;
    letter-spacing:.03em;text-transform:uppercase;pointer-events:none}
  .new-badge .material-symbols-outlined{font-size:12px}
  .draft-badge{position:absolute;top:10px;right:48px;z-index:2;display:flex;align-items:center;
    gap:3px;padding:3px 8px 3px 5px;border-radius:7px;
    background:rgba(220,60,60,.85);color:#fff;font-size:10.5px;font-weight:700;
    letter-spacing:.03em;text-transform:uppercase;pointer-events:none;
    backdrop-filter:blur(3px)}
  .draft-badge .material-symbols-outlined{font-size:12px}
  .album.unpublished{opacity:.6;outline:2px dashed rgba(220,60,60,.5);outline-offset:2px}
  .gear{position:absolute;top:10px;right:10px;z-index:2;width:34px;height:34px;
    display:flex;align-items:center;justify-content:center;border-radius:9px;
    background:rgba(13,15,19,.72);color:#fff;border:1px solid rgba(255,255,255,.18);
    opacity:0;transform:translateY(-4px);transition:opacity .15s,transform .15s,background .15s;
    text-decoration:none;backdrop-filter:blur(2px)}
  .gear .material-symbols-outlined{font-size:19px}
  .album:hover .gear{opacity:1;transform:none}
  .gear:hover{background:var(--accent);color:#0d0f13;border-color:var(--accent)}
  .cover{aspect-ratio:1;overflow:hidden;background:#0a0a0a}
  .cover-img{width:100%;height:100%;object-fit:cover;display:block}
  .cover-generic{width:100%;height:100%;display:flex;align-items:center;
    justify-content:center;background:linear-gradient(135deg,#1a1c22 0%,#111318 100%)}
  .cover-generic svg{width:48%;height:48%;opacity:.55}
  .album .body{padding:10px 12px 4px;display:flex;flex-direction:column;gap:3px}
  .album .al-artist{color:var(--accent);font-size:14px;font-weight:700;line-height:1.15}
  .album .al-title{font-weight:600;font-size:13px;line-height:1.2;color:var(--fg)}
  .album .al-line{display:flex;align-items:center;gap:5px;color:var(--muted);font-size:11.5px}
  .album .al-line .material-symbols-outlined{font-size:13px;color:var(--muted)}
  .album .al-line.muted-placeholder{opacity:.45;font-style:italic}
  .album .al-poster{margin-top:5px}
  .album .al-social{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--border);border-bottom:1px solid var(--border);margin-top:6px}
  .soc-btn{display:flex;align-items:center;justify-content:center;gap:5px;
    padding:9px 0;border:none;background:var(--bg);color:var(--muted);
    font-size:12px;font-weight:600;cursor:pointer;
    transition:color .15s,background .15s;width:100%}
  .soc-btn:first-child{border-right:1px solid var(--border)}
  .soc-btn:hover{background:color-mix(in srgb,var(--bg) 80%,var(--accent) 20%);color:var(--fg)}
  .soc-btn.liked{color:#e85d75}
  .soc-btn .material-symbols-outlined{font-size:15px}
  .album .meta{color:var(--muted);font-size:11px}
  .tag{font-size:10px;font-weight:500;padding:2px 8px;border-radius:999px;
    background:var(--bg);border:1px solid var(--border);color:var(--muted)}
  .album .btns{padding:7px 12px 10px}
  .album .btns a{width:100%;justify-content:center;height:30px;font-size:12px}
  .album .btns a .material-symbols-outlined{font-size:15px}
  .empty{margin-top:40px;text-align:center;color:var(--muted)}
  .empty .material-symbols-outlined{font-size:52px;display:block;margin-bottom:10px}
  .foot{margin:36px 0 14px;text-align:center;color:var(--muted);font-size:12px}
  .foot .badge{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;
    border-radius:999px;border:1px solid var(--border);font-variant-numeric:tabular-nums}
  .foot .env-preprod{color:var(--run);border-color:var(--run)}
  /* Preview-visitor banner */
  .preview-banner{display:none;align-items:center;justify-content:center;gap:8px;
    padding:6px 14px;background:rgba(255,140,0,.12);border-bottom:1px solid rgba(255,140,0,.35);
    color:#ffb347;font-size:12.5px;font-weight:600}
  .preview-banner.show{display:flex}
  .preview-banner .material-symbols-outlined{font-size:16px}
  .preview-banner button{padding:2px 10px;border-radius:6px;border:1px solid rgba(255,140,0,.5);
    background:transparent;color:#ffb347;font-size:11.5px;cursor:pointer}
  .preview-banner button:hover{background:rgba(255,140,0,.18)}
  /* Modale */
  .overlay{position:fixed;inset:0;background:rgba(6,7,10,.66);backdrop-filter:blur(3px);
    display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;
    overflow:auto;z-index:50;opacity:0;transition:opacity .18s}
  .overlay.hidden{display:none}
  .overlay.show{opacity:1}
  .modal{background:var(--card);border:1px solid var(--border);border-radius:18px;
    width:100%;max-width:720px;overflow:hidden;transform:translateY(10px);
    transition:transform .2s}
  .overlay.show .modal{transform:none}
  .modal-head{display:flex;gap:18px;padding:20px;border-bottom:1px solid var(--border)}
  .modal-head .cv{width:120px;height:120px;border-radius:12px;flex-shrink:0;
    overflow:hidden;background:#111;display:flex;align-items:center;justify-content:center}
  .modal-head .cv img{width:100%;height:100%;object-fit:cover;display:block}
  .modal-head .cv .cover-generic{width:100%;height:100%}
  .modal-head .mh-artist{color:var(--accent);font-size:22px;font-weight:700;line-height:1.15}
  .modal-head .mh-title{margin:2px 0 12px;font-size:19px;font-weight:600;line-height:1.2;color:var(--fg)}
  .modal-head .mh-line{display:flex;align-items:center;gap:8px;color:var(--fg);font-size:14px;margin-bottom:5px}
  .modal-head .mh-line .material-symbols-outlined{font-size:18px;color:var(--muted)}
  .modal-head .mh-poster{margin:10px 0}
  .modal-head .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .modal .x{position:absolute;top:14px;right:14px}
  .modal-body{padding:20px;max-height:56vh;overflow:auto}
  .modal-body h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;
    color:var(--muted);margin:0 0 10px}
  .setlist{list-style:none;padding:0;margin:0 0 22px}
  .setlist li{display:flex;align-items:center;gap:10px;padding:7px 0;
    border-bottom:1px solid var(--border);font-size:14px}
  .setlist li .n{color:var(--accent);font-variant-numeric:tabular-nums;min-width:22px}
  .setlist li .tt{flex:1}
  .setlist li a{color:var(--muted);display:flex}
  .setlist li a:hover{color:var(--accent)}
  .dlgrid{display:flex;flex-wrap:wrap;gap:8px}
  .dlgrid a{margin:0;height:36px;font-size:13px}
  .lock-note{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;
    background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
  .source-row{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;margin-bottom:8px;flex-wrap:wrap}
  .source-row .material-symbols-outlined{font-size:15px;flex-shrink:0}
  .source-link{color:var(--accent);text-decoration:none;word-break:break-all}
  .source-link:hover{text-decoration:underline}
  /* Date badge */
  .album .date-pill{display:inline-flex;align-items:center;gap:5px;background:var(--bg);
    border:1px solid var(--border);border-radius:8px;padding:2px 9px;font-size:11.5px;
    color:var(--fg);font-weight:500;margin-top:4px;width:fit-content}
  .album .date-pill .material-symbols-outlined{font-size:13px;color:var(--muted)}
  /* Filtre panel */
  .filter-panel{display:none;background:var(--card);border:1px solid var(--border);
    border-radius:12px;padding:14px 16px;margin-top:8px;gap:12px;flex-wrap:wrap;align-items:flex-end}
  .filter-panel.open{display:flex}
  .filter-group{display:flex;flex-direction:column;gap:5px;min-width:150px}
  .filter-group label{font-size:11.5px;color:var(--muted);font-weight:500}
  .filter-group select{height:34px;padding:0 10px;font-size:13px;cursor:pointer}
  .filter-clear{margin-left:auto;align-self:flex-end}
  /* Cover preview overlay */
  .cv-overlay{position:fixed;inset:0;background:rgba(6,7,10,.88);backdrop-filter:blur(6px);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    z-index:100;opacity:0;transition:opacity .2s;padding:16px}
  .cv-overlay.hidden{display:none}
  .cv-overlay.show{opacity:1}
  .cv-wrap{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;justify-content:center;
    max-height:80vh;overflow:auto}
  .cv-img{border-radius:12px;max-width:min(380px,80vw);max-height:75vh;object-fit:contain;
    border:1px solid var(--border)}
  .cv-btns{display:flex;flex-direction:column;gap:8px;min-width:140px}
  .cv-close{position:absolute;top:16px;right:16px}
</style>
</head>
<body>
<header>
  <a class="brand" href="/"><img class="brand-icon" src="/static/favicon.svg" alt="" width="24" height="24"> live2mp3</a>
  <div class="tools">
    <a id="tool-link" class="icon-btn" href="/app" style="display:none"><span class="material-symbols-outlined">build</span><span data-i18n="tool">Outil</span></a>
    <button id="preview-visitor-btn" class="icon-btn" style="display:none" onclick="togglePreviewVisitor()"><span class="material-symbols-outlined">visibility</span><span id="t-preview-visitor">Vue visiteur</span></button>
    <button id="lang" class="icon-btn"><span class="material-symbols-outlined">translate</span><span id="lang-label">FR</span></button>
    <button id="theme" class="icon-btn icon-only"><span class="material-symbols-outlined">dark_mode</span></button>
    <a id="login" class="icon-btn" href="/outpost.goauthentik.io/start?rd=/"><span class="material-symbols-outlined">login</span><span data-i18n="login">Connexion</span></a>
    <div id="usermenu" class="usermenu" style="display:none"></div>
  </div>
</header>
<div id="preview-banner" class="preview-banner">
  <span class="material-symbols-outlined">visibility</span>
  <span id="t-preview-banner">Prévisualisation visiteur</span>
  <button onclick="togglePreviewVisitor()" id="t-preview-exit">Quitter</button>
</div>

<main>
  <div class="hero">
    <h1 data-i18n="hero_title">Nos albums</h1>
    <p data-i18n="hero_sub">Captations de concerts découpées, taguées et prêtes à écouter.</p>
  </div>

  <div class="toolbar">
    <div class="toolbar-main">
      <div class="sort-block">
        <span class="sort-label"><span class="material-symbols-outlined">sort</span><span data-i18n="sort_by">Trier par</span></span>
        <select id="sort-select">
          <option value="date_concert" data-i18n="sort_date">Date</option>
          <option value="date_import" data-i18n="sort_new">Nouveauté</option>
          <option value="title" data-i18n="sort_title">Titre</option>
          <option value="artist" data-i18n="sort_artist">Artiste</option>
        </select>
      </div>
      <div class="search">
        <span class="material-symbols-outlined">search</span>
        <input id="q" type="search" autocomplete="off"
               placeholder="Rechercher par titre, artiste, lieu, date…">
      </div>
      <button class="chip" id="filter-btn"><span class="material-symbols-outlined">filter_alt</span><span id="t-filter">Filtres</span></button>
    </div>
    <div id="filter-panel" class="filter-panel">
      <div class="filter-group">
        <label id="t-f-artist">Artiste</label>
        <select id="f-artist"><option value="">Tous</option></select>
      </div>
      <div class="filter-group">
        <label id="t-f-year">Année</label>
        <select id="f-year"><option value="">Toutes</option></select>
      </div>
      <div class="filter-group" style="min-width:200px">
        <label id="t-f-labels">Étiquettes</label>
        <div id="filters" style="display:flex;flex-wrap:wrap;gap:6px;padding-top:2px"></div>
      </div>
      <button class="icon-btn filter-clear" id="filter-clear" style="display:none"><span class="material-symbols-outlined">clear_all</span><span id="t-clear">Effacer</span></button>
    </div>
    <div class="toolbar-row">
      <div id="active-filters" style="display:contents"></div>
      <span class="count" id="count"></span>
    </div>
  </div>

  <div id="albums"></div>
  <div id="empty" class="empty hidden">
    <span class="material-symbols-outlined">library_music</span>
    <div id="empty-msg">Aucun album pour le moment.</div>
  </div>
  <div class="foot" id="foot"></div>
</main>



<script src="/static/i18n.js"></script>
<script src="/static/social.js"></script>
<script>
// ── Thème ──────────────────────────────────────────────────────────────────
const themeBtn=document.getElementById("theme");
function setTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem("l2m-theme",t);
  themeBtn.querySelector(".material-symbols-outlined").textContent=t==="dark"?"dark_mode":"light_mode";}
setTheme(localStorage.getItem("l2m-theme")||"dark");
themeBtn.onclick=()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");

// ── Langue ────────────────────────────────────────────────────────────────
const langBtn=document.getElementById("lang");
function setLang(l){localStorage.setItem("l2m-lang",l);
  document.getElementById("lang-label").textContent=l.toUpperCase();
  if(window.applyI18n)applyI18n(l);
  const _h=document.querySelector(".hero h1");if(_h)_h.textContent=T[l].hero_title;
  const _s=document.querySelector(".hero p");if(_s)_s.textContent=T[l].hero_sub;
  document.getElementById("t-preview-visitor").textContent=T[l].preview_visitor;
  document.getElementById("t-preview-banner").textContent=T[l].preview_banner;
  document.getElementById("t-preview-exit").textContent=T[l].preview_exit;
  if(ALBUMS.length)buildFilters();render();updateCount();}
langBtn.onclick=()=>setLang((localStorage.getItem("l2m-lang")||"fr")==="fr"?"en":"fr");

const T={
  fr:{empty:"Aucun album pour le moment.",noresult:"Aucun résultat.",titres:"titres",
      ph:"Rechercher par titre, artiste, lieu, date…",count:n=>`${n} album${n>1?"s":""}`,
      cover:"Pochette",traycard:"Tray card",manage:"Gérer cet album",
      setlist:"Setlist",downloads:"Téléchargements",full:"Album complet (MP3)",
      quickdl:"Téléchargement rapide",
      dltrack:"Télécharger cette piste",lockdl:"Se connecter pour télécharger",login:"Connexion",
      imported_by:(u,d)=>`Importé par ${u}${d?" le "+d:""}`,
      sort_by:"Trier par",sort_date:"Date",sort_new:"Nouveauté",
      sort_artist:"Artiste",sort_title:"Titre",
      logout:"Déconnexion",source:"Source",profile:"Mon profil",comments:"Commentaires",
      hero_title:"Nos albums",hero_sub:"Captations de concerts découpées, taguées et prêtes à écouter.",
      filter:"Filtres",f_artist:"Artiste",f_year:"Année",f_labels:"Étiquettes",
      clear:"Effacer",all_artists:"Tous les artistes",all_years:"Toutes les années",
      date_unknown:"Date inconnue",venue_unknown:"Lieu inconnu",
      preview_visitor:"Vue visiteur",preview_banner:"Prévisualisation visiteur",preview_exit:"Quitter"},
  en:{empty:"No album yet.",noresult:"No result.",titres:"tracks",
      ph:"Search by title, artist, venue, date…",count:n=>`${n} album${n>1?"s":""}`,
      cover:"Cover",traycard:"Tray card",manage:"Manage this album",
      setlist:"Setlist",downloads:"Downloads",full:"Full album (MP3)",
      quickdl:"Quick download",
      dltrack:"Download this track",lockdl:"Log in to download",login:"Log in",
      imported_by:(u,d)=>`Imported by ${u}${d?" on "+d:""}`,
      sort_by:"Sort by",sort_date:"Date",sort_new:"Latest",
      sort_artist:"Artist",sort_title:"Title",
      logout:"Log out",source:"Source",profile:"My profile",comments:"Comments",
      hero_title:"Our albums",hero_sub:"Concert recordings, edited, tagged, and ready to play.",
      filter:"Filters",f_artist:"Artist",f_year:"Year",f_labels:"Tags",
      clear:"Clear",all_artists:"All artists",all_years:"All years",
      date_unknown:"Unknown date",venue_unknown:"Unknown venue",
      preview_visitor:"Visitor view",preview_banner:"Visitor preview",preview_exit:"Exit"}
};
function L(){return localStorage.getItem("l2m-lang")||"fr";}

let ALBUMS=[], selected=new Set(), ME={authenticated:false,is_gestionnaire:false};
let PREVIEW_VISITOR=false;
function meDisplay(){return PREVIEW_VISITOR?{authenticated:false,is_gestionnaire:false}:ME;}
function togglePreviewVisitor(){
  PREVIEW_VISITOR=!PREVIEW_VISITOR;
  document.getElementById("preview-banner").classList.toggle("show",PREVIEW_VISITOR);
  render();
}
let currentSort="date_concert";
let filterArtist="", filterYear="";

// ── Cover générique SVG ───────────────────────────────────────────────────
const GENERIC_COVER=`<div class="cover-generic">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <circle cx="50" cy="50" r="42" fill="#2a2d38"/>
    <circle cx="50" cy="50" r="14" fill="#1a1c22"/>
    <circle cx="50" cy="50" r="4" fill="#3a3d4a"/>
    <!-- note de musique -->
    <g fill="#6b7080" transform="translate(50,50)">
      <rect x="-1" y="-18" width="2.5" height="14" rx="1"/>
      <rect x="5" y="-22" width="2.5" height="10" rx="1"/>
      <rect x="-1" y="-6" width="8.5" height="2" rx="1"/>
      <ellipse cx="-3" cy="-4" rx="4" ry="3" transform="rotate(-15,-3,-4)"/>
      <ellipse cx="9" cy="-12" rx="4" ry="3" transform="rotate(-15,9,-12)"/>
    </g>
  </svg>
</div>`;

function coverHtml(a,size){
  if(a.has_cover){
    const sz=size?`width="${size}" height="${size}"`:"";
    return `<img class="cover-img" src="/cover/${a.slug}" alt="" loading="lazy" ${sz}>`;
  }
  return GENERIC_COVER;
}

function formatImportDate(iso){
  if(!iso) return "";
  try{
    const d=new Date(iso);
    return d.toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:"numeric"});
  }catch(e){return "";}
}

function norm(s){return(s||"").toString().toLowerCase()
  .normalize("NFD").replace(/[̀-ͯ]/g,"");}

function extractYear(date){
  if(!date) return "";
  const m=String(date).match(/\d{4}/);
  return m?m[0]:"";
}

function matches(a){
  const q=norm(document.getElementById("q").value);
  const hay=norm([a.title,a.artist,a.venue,a.festival,a.date].join(" "));
  if(q&&!hay.includes(q)) return false;
  if(filterArtist&&norm(a.artist)!==norm(filterArtist)) return false;
  if(filterYear&&extractYear(a.date)!==filterYear) return false;
  for(const lab of selected){if(!(a.labels||[]).map(norm).includes(norm(lab)))return false;}
  return true;
}

const NEW_DAYS=21;
function isNew(a){
  const ref=a.drive_added_at||a.imported_at;
  if(!ref) return false;
  return (Date.now()-new Date(ref).getTime())/(864e5)<=NEW_DAYS;
}

function albumCard(a){
  const md=meDisplay();
  const hasDownloadable=a.has_mp3||a.has_mp4||a.has_cover||a.has_traycard;
  let dlBtn="";
  if(hasDownloadable){
    if(md.authenticated){
      const dlHref=a.has_mp3?`/download/${a.slug}/mp3`:`/download/${a.slug}/mp4`;
      dlBtn=`<a class="primary" href="${dlHref}"><span class="material-symbols-outlined">download</span>${T[L()].quickdl}</a>`;
    } else {
      dlBtn=`<a class="icon-btn" href="/outpost.goauthentik.io/start?rd=/"><span class="material-symbols-outlined">lock</span>${T[L()].lockdl}</a>`;
    }
  }
  const gear=md.is_gestionnaire
    ?`<a class="gear" href="/app/album/${a.slug}" title="${T[L()].manage}"><span class="material-symbols-outlined">settings</span></a>`:"";
  const newBadge=isNew(a)
    ?`<span class="new-badge"><span class="material-symbols-outlined">auto_awesome</span>${L()==="fr"?"Nouveau":"New"}</span>`:"";
  const draftBadge=a.published===false&&md.is_gestionnaire
    ?`<span class="draft-badge"><span class="material-symbols-outlined">visibility_off</span>${L()==="fr"?"Brouillon":"Draft"}</span>`:"";
  const showArtist=currentSort!=="artist";
  const posterHtml=posterFor(a.imported_by);
  return `<div class="album${a.published===false?" unpublished":""}" data-slug="${a.slug}">
    ${gear}
    ${draftBadge}
    ${newBadge}
    <div class="cover">${coverHtml(a)}</div>
    <div class="body">
      ${showArtist&&a.artist?`<div class="al-artist">${a.artist}</div>`:""}
      <div class="al-title">${a.title||a.slug}</div>
      <div class="al-line${a.date?"":" muted-placeholder"}"><span class="material-symbols-outlined">calendar_month</span>${a.date||T[L()].date_unknown}</div>
      <div class="al-line${a.venue?"":" muted-placeholder"}"><span class="material-symbols-outlined">location_on</span>${a.venue||T[L()].venue_unknown}</div>
      ${posterHtml?`<div class="al-poster">${posterHtml}</div>`:""}
    </div>
    <div class="al-social"></div>
    ${dlBtn?`<div class="btns">${dlBtn}</div>`:""}
  </div>`;
}

// Avatar + pseudo du posteur (imported_by), résolu via POSTERS.
let POSTERS={};
let SOC_CACHE={};
let MY_LIKES=new Set();
function patchSocialCounts(){
  document.querySelectorAll(".al-social").forEach(el=>{
    const slug=el.closest(".album")?.dataset.slug;
    if(!slug) return;
    const s=SOC_CACHE[slug]||{likes:0,comments:0};
    const liked=MY_LIKES.has(slug);
    el.innerHTML=
      `<button class="soc-btn${liked?" liked":""}" onclick="handleLike(event,'${slug}')"><span class="material-symbols-outlined">favorite</span>${s.likes}</button>`+
      `<button class="soc-btn" onclick="handleComment(event,'${slug}')"><span class="material-symbols-outlined">chat_bubble</span>${s.comments}</button>`;
  });
}
async function handleLike(e,slug){
  e.stopPropagation();
  if(!ME.authenticated){location.href="/outpost.goauthentik.io/start?rd=/";return;}
  try{
    const res=await(await fetch(`/api/social/albums/${slug}/like`,{method:"POST"})).json();
    SOC_CACHE[slug]={likes:res.likes,comments:res.comments};
    if(res.liked) MY_LIKES.add(slug); else MY_LIKES.delete(slug);
    patchSocialCounts();
  }catch(e){}
}
function handleComment(e,slug){
  e.stopPropagation();
  location.href=`/album/${slug}#comments`;
}
async function loadSocialCounts(){
  try{
    const [counts,liked]=await Promise.all([
      fetch("/api/social/counts").then(r=>r.json()),
      ME.authenticated?fetch("/api/social/my-likes").then(r=>r.json()):Promise.resolve([])
    ]);
    SOC_CACHE=counts;
    MY_LIKES=new Set(liked);
    patchSocialCounts();
  }catch(e){}
}
function posterFor(username){
  if(!username) return "";
  const p=POSTERS[username]||{};
  return L2M.poster({username,display_name:p.display_name||username,avatar:!!p.avatar},T[L()].published_by);
}

function render(){
  document.getElementById("q").placeholder=T[L()].ph;
  const wrap=document.getElementById("albums");
  const shown=ALBUMS.filter(matches);
  const empty=document.getElementById("empty");
  if(!ALBUMS.length){empty.classList.remove("hidden");
    document.getElementById("empty-msg").textContent=T[L()].empty;wrap.innerHTML="";return;}
  if(!shown.length){empty.classList.remove("hidden");
    document.getElementById("empty-msg").textContent=T[L()].noresult;wrap.innerHTML="";}
  else empty.classList.add("hidden");

  if(currentSort==="artist"){
    wrap.className="";
    // Regroupe par artiste (ordre alphabétique) ; dans chaque groupe, tri par date
    const groups=new Map();
    shown.forEach(a=>{
      const key=a.artist||"—";
      if(!groups.has(key)) groups.set(key,[]);
      groups.get(key).push(a);
    });
    const sorted=[...groups.entries()].sort(([a],[b])=>
      a.localeCompare(b,undefined,{sensitivity:"base"}));
    wrap.innerHTML=sorted.map(([artist,albums])=>`
      <div class="artist-group">
        <div class="artist-sep">
          <span class="artist-bar"></span>
          <span class="artist-name">${artist}</span>
          <span class="artist-bar"></span>
        </div>
        <div class="albums">${albums.map(albumCard).join("")}</div>
      </div>`).join("");
  } else {
    wrap.className="albums";
    wrap.innerHTML=shown.map(albumCard).join("");
  }
  patchSocialCounts();
}

function buildFilters(){
  const t=T[L()];
  // Artist dropdown
  const artists=[...new Set(ALBUMS.map(a=>a.artist).filter(Boolean))].sort();
  const selA=document.getElementById("f-artist");
  selA.innerHTML=`<option value="">${t.all_artists}</option>`+
    artists.map(a=>`<option value="${a}"${filterArtist===a?" selected":""}>${a}</option>`).join("");
  selA.onchange=()=>{filterArtist=selA.value;updateClearBtn();render();updateCount();};
  // Year dropdown
  const years=[...new Set(ALBUMS.map(a=>extractYear(a.date)).filter(Boolean))].sort().reverse();
  const selY=document.getElementById("f-year");
  selY.innerHTML=`<option value="">${t.all_years}</option>`+
    years.map(y=>`<option value="${y}"${filterYear===y?" selected":""}>${y}</option>`).join("");
  selY.onchange=()=>{filterYear=selY.value;updateClearBtn();render();updateCount();};
  // Label chips — tags fixes + tags dynamiques des albums
  const FIXED_TAGS=["live","unreleased","crossover"];
  const dynamic=[...new Set(ALBUMS.flatMap(a=>a.labels||[]))]
    .filter(l=>!FIXED_TAGS.map(t=>t.toLowerCase()).includes(l.toLowerCase()))
    .sort((x,y)=>x.localeCompare(y,undefined,{sensitivity:"base"}));
  const all=[...FIXED_TAGS,...dynamic];
  const box=document.getElementById("filters");
  box.innerHTML=all.map(l=>`<span class="chip" data-label="${l}"${selected.has(l)?' class="chip active"':' class="chip"'}>${l}</span>`).join("");
  box.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{
    const l=c.dataset.label;
    if(selected.has(l)){selected.delete(l);c.classList.remove("active");}
    else{selected.add(l);c.classList.add("active");}
    updateClearBtn();render();updateCount();
  });
  // i18n labels
  document.getElementById("t-filter").textContent=t.filter;
  document.getElementById("t-f-artist").textContent=t.f_artist;
  document.getElementById("t-f-year").textContent=t.f_year;
  document.getElementById("t-f-labels").textContent=t.f_labels;
  document.getElementById("t-clear").textContent=t.clear;
}
function updateClearBtn(){
  const active=filterArtist||filterYear||selected.size>0;
  document.getElementById("filter-clear").style.display=active?"":"none";
}
document.getElementById("filter-btn").onclick=()=>{
  const p=document.getElementById("filter-panel");
  p.classList.toggle("open");
};
document.getElementById("filter-clear").onclick=()=>{
  filterArtist="";filterYear="";selected.clear();
  buildFilters();updateClearBtn();render();updateCount();
};
function updateCount(){const n=ALBUMS.filter(matches).length;
  const el=document.getElementById("count");if(el)el.textContent=T[L()].count(n);}

// ── Tri ───────────────────────────────────────────────────────────────────
document.getElementById("sort-select").addEventListener("change",async e=>{
  currentSort=e.target.value;
  localStorage.setItem("l2m-sort",currentSort);
  const apiSort=currentSort==="artist"?"date_concert":currentSort;
  ALBUMS=await(await fetch(`/api/catalogue?sort=${apiSort}`)).json();
  render();updateCount();
});

document.getElementById("q").addEventListener("input",()=>{render();updateCount();});

// ── Navigation vers la page album ─────────────────────────────────────────
document.getElementById("albums").addEventListener("click",e=>{
  if(e.target.closest("a,button")) return;
  const card=e.target.closest(".album");
  if(card) location.href=`/album/${card.dataset.slug}`;
});

// ── Version footer ────────────────────────────────────────────────────────
async function loadVersion(){
  try{
    const v=await(await fetch("/api/version")).json();
    const cls=v.env==="prod"?"":"env-preprod";
    const commit=v.commit?` · ${v.commit}`:"";
    document.getElementById("foot").innerHTML=
      `<span class="badge ${cls}">v${v.version} · ${v.env}${commit}</span>`;
  }catch(e){}
}

// ── Bootstrap ─────────────────────────────────────────────────────────────
async function load(){
  loadVersion();
  // Restaurer le tri depuis localStorage
  const savedSort=localStorage.getItem("l2m-sort")||"date_concert";
  currentSort=savedSort;
  document.getElementById("sort-select").value=currentSort;
  try{ ME=await(await fetch("/api/me")).json(); }catch(e){ ME={authenticated:false,is_gestionnaire:false}; }
  document.getElementById("tool-link").style.display=ME.is_gestionnaire?"":"none";
  document.getElementById("preview-visitor-btn").style.display=ME.is_gestionnaire?"":"none";
  // Connecté : menu avatar (profil / langue / thème / déconnexion). Anonyme : boutons classiques.
  const um=document.getElementById("usermenu");
  if(ME.authenticated){
    ["login","lang","theme"].forEach(id=>document.getElementById(id).style.display="none");
    um.style.display="";
    const sm=await L2M.me();
    L2M.userMenu(um,{username:sm.username||ME.username,display_name:sm.display_name,avatar:sm.avatar},
      {onChange:k=>{ if(k==="lang") setLang(L2M.getLang()); }});
  }else{
    um.style.display="none";
    document.getElementById("login").style.display="";
  }
  const apiSort=currentSort==="artist"?"date_concert":currentSort;
  ALBUMS=await(await fetch(`/api/catalogue?sort=${apiSort}`)).json();
  // Profils des posteurs (avatars sur les cartes/fiches)
  POSTERS=await L2M.profiles(ALBUMS.map(a=>a.imported_by));
  buildFilters();
  setLang(localStorage.getItem("l2m-lang")||"fr");
  loadSocialCounts();
  // Redirection legacy ?album=slug → page dédiée
  const wanted=new URLSearchParams(location.search).get("album");
  if(wanted) location.replace(`/album/${encodeURIComponent(wanted)}`);
}
load();
</script>
