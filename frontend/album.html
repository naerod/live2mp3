<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>live2mp3 — gestion d'album</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">
<link rel="stylesheet" href="/static/app.css">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<style>
  .back{color:var(--muted)}
  .layout{display:grid;grid-template-columns:340px 1fr;gap:22px;margin-top:8px}
  @media(max-width:760px){.layout{grid-template-columns:1fr}}
  h1{margin:0 0 4px}
  .sub{color:var(--muted);font-size:14px;margin-bottom:18px}
  .visual img{width:100%;border-radius:12px;border:1px solid var(--border);display:block}
  .visual .ph{aspect-ratio:1;border-radius:12px;border:1px dashed var(--border);
    display:flex;align-items:center;justify-content:center;color:var(--muted)}
  .visual iframe{width:100%;height:320px;border:1px solid var(--border);
    border-radius:12px;margin-top:14px;background:#fff}
  h2{font-size:15px;font-weight:700;margin:0 0 10px}
  .sec{margin-bottom:24px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
  .lchip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 12px;
    border-radius:999px;border:1px solid var(--border);background:var(--card);
    font-size:12.5px;font-weight:500}
  .lchip button{all:unset;cursor:pointer;display:flex;color:var(--muted);border-radius:50%}
  .lchip button:hover{color:var(--fg)}
  .lchip .material-symbols-outlined{font-size:16px}
  .lchip.derived{color:var(--muted);opacity:.85}
  .addrow{display:flex;gap:8px}
  .addrow input{flex:1}
  .dl{display:flex;flex-wrap:wrap;gap:8px}
  .dl a{margin:0;height:36px;font-size:13px}
  .tracks{list-style:none;padding:0;margin:0;columns:2;column-gap:22px}
  .tracks li{font-size:13px;color:var(--fg);padding:3px 0;break-inside:avoid}
  .tracks li span{color:var(--accent);font-variant-numeric:tabular-nums;margin-right:6px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--accent);color:#0d0f13;padding:10px 18px;border-radius:10px;
    font-size:13px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div class="brand"><img class="brand-icon" src="/static/favicon.svg" alt="" width="24" height="24"> live2mp3</div>
  <div class="tools">
    <a class="icon-btn" href="/"><span class="material-symbols-outlined">arrow_back</span> <span id="t-back">Vitrine</span></a>
    <button id="lang" class="icon-btn"><span class="material-symbols-outlined">translate</span><span id="lang-label">FR</span></button>
    <button id="theme" class="icon-btn icon-only"><span class="material-symbols-outlined">dark_mode</span></button>
  </div>
</header>

<main>
  <h1 id="title">…</h1>
  <div class="sub" id="sub"></div>

  <div class="layout">
    <div class="visual">
      <div id="cover"></div>
      <div id="traycard"></div>
    </div>

    <div>
      <div class="sec">
        <h2 id="t-labels">Labels</h2>
        <div class="chips" id="chips"></div>
        <div class="addrow">
          <input id="newlabel" list="suggest" placeholder="Ajouter un label…">
          <datalist id="suggest"></datalist>
          <button class="primary" id="add" style="margin:0"><span class="material-symbols-outlined">add</span></button>
        </div>
        <button class="primary" id="save" style="margin-top:14px"><span class="material-symbols-outlined">save</span> <span id="t-save">Enregistrer</span></button>
      </div>

      <div class="sec">
        <h2 id="t-dl">Téléchargements</h2>
        <div class="dl" id="dl"></div>
      </div>

      <div class="sec">
        <h2 id="t-tracks">Pistes</h2>
        <ul class="tracks" id="tracks"></ul>
      </div>
    </div>
  </div>
</main>
<div class="toast" id="toast"></div>

<script>
const themeBtn=document.getElementById("theme");
function setTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem("l2m-theme",t);
  themeBtn.querySelector(".material-symbols-outlined").textContent=t==="dark"?"dark_mode":"light_mode";}
setTheme(localStorage.getItem("l2m-theme")||"dark");
themeBtn.onclick=()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");
const TT={fr:{back:"Vitrine",labels:"Labels",save:"Enregistrer",dl:"Téléchargements",
  tracks:"Pistes",saved:"Labels enregistrés",cover:"Pochette",traycard:"Tray card",
  notray:"Aucune tray card générée",add:"Ajouter un label…"},
 en:{back:"Gallery",labels:"Labels",save:"Save",dl:"Downloads",tracks:"Tracks",
  saved:"Labels saved",cover:"Cover",traycard:"Tray card",
  notray:"No tray card generated",add:"Add a label…"}};
function L(){return localStorage.getItem("l2m-lang")||"fr";}
function applyLang(){const t=TT[L()];
  document.getElementById("t-back").textContent=t.back;
  document.getElementById("t-labels").textContent=t.labels;
  document.getElementById("t-save").textContent=t.save;
  document.getElementById("t-dl").textContent=t.dl;
  document.getElementById("t-tracks").textContent=t.tracks;
  document.getElementById("newlabel").placeholder=t.add;
  document.getElementById("lang-label").textContent=L().toUpperCase();
  if(DATA)renderDL();}
document.getElementById("lang").onclick=()=>{localStorage.setItem("l2m-lang",L()==="fr"?"en":"fr");applyLang();};

const SLUG=decodeURIComponent(location.pathname.split("/app/album/")[1]||"");
let DATA=null, labels=[];

function toast(msg){const el=document.getElementById("toast");el.textContent=msg;
  el.classList.add("show");setTimeout(()=>el.classList.remove("show"),1800);}

function renderChips(){
  const box=document.getElementById("chips");
  const derived=(DATA.derived_labels||[]).map(l=>
    `<span class="lchip derived" title="auto"><span class="material-symbols-outlined">lock</span>${l}</span>`).join("");
  const edit=labels.map((l,i)=>
    `<span class="lchip">${l}<button data-i="${i}" aria-label="retirer"><span class="material-symbols-outlined">close</span></button></span>`).join("");
  box.innerHTML=derived+edit;
  box.querySelectorAll("button[data-i]").forEach(b=>b.onclick=()=>{
    labels.splice(+b.dataset.i,1);renderChips();});
}
function renderDL(){
  const t=TT[L()],s=DATA.slug,dl=document.getElementById("dl");let h="";
  if(DATA.has_mp3)h+=`<a class="primary" href="/download/${s}/mp3"><span class="material-symbols-outlined">music_note</span> MP3</a>`;
  if(DATA.has_mp4)h+=`<a class="icon-btn" href="/download/${s}/mp4"><span class="material-symbols-outlined">movie</span> MP4</a>`;
  if(DATA.has_cover)h+=`<a class="icon-btn" href="/download/${s}/cover"><span class="material-symbols-outlined">image</span> ${t.cover}</a>`;
  if(DATA.has_traycard)h+=`<a class="icon-btn" href="/download/${s}/traycard"><span class="material-symbols-outlined">description</span> ${t.traycard}</a>`;
  dl.innerHTML=h;
}
function addLabel(){const inp=document.getElementById("newlabel");
  const v=inp.value.trim();if(v&&!labels.map(x=>x.toLowerCase()).includes(v.toLowerCase())){
    labels.push(v);renderChips();}inp.value="";}
document.getElementById("add").onclick=addLabel;
document.getElementById("newlabel").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();addLabel();}});

document.getElementById("save").onclick=async()=>{
  const r=await fetch(`/api/albums/${SLUG}/labels`,{method:"PUT",
    headers:{"Content-Type":"application/json"},body:JSON.stringify({labels})});
  if(r.ok){const d=await r.json();labels=d.labels;renderChips();toast(TT[L()].saved);}
  else toast("Erreur ("+r.status+")");
};

async function load(){
  DATA=await (await fetch(`/api/albums/${SLUG}`)).json();
  const a=DATA.album||{};
  document.getElementById("title").textContent=a.title||DATA.slug;
  document.getElementById("sub").textContent=[a.artist,a.venue,a.date].filter(Boolean).join(" · ");
  labels=(DATA.labels||[]).slice();
  document.getElementById("cover").innerHTML=DATA.has_cover
    ? `<img src="/cover/${DATA.slug}" alt="cover">`
    : `<div class="ph"><span class="material-symbols-outlined">album</span></div>`;
  document.getElementById("traycard").innerHTML=DATA.has_traycard
    ? `<iframe src="/download/${DATA.slug}/traycard#toolbar=0" title="tray card"></iframe>`
    : `<div class="ph" style="margin-top:14px;aspect-ratio:auto;padding:20px">${TT[L()].notray}</div>`;
  document.getElementById("suggest").innerHTML=(DATA.all_labels||[])
    .map(l=>`<option value="${l}">`).join("");
  document.getElementById("tracks").innerHTML=(DATA.tracks||[])
    .map(t=>`<li><span>${String(t.n).padStart(2,"0")}</span>${t.title}</li>`).join("");
  renderChips();renderDL();applyLang();
}
applyLang();load();
</script>
</body>
</html>
