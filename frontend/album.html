<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>document.documentElement.dataset.theme=localStorage.getItem("l2m-theme")||"dark";</script>
<title>live2mp3 — gestion d'album</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">
<link rel="stylesheet" href="/static/shared/naerod-social.css">
<link rel="stylesheet" href="/static/app.css">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<style>
  .layout{display:grid;grid-template-columns:280px 1fr;gap:20px;margin-top:16px}
  @media(max-width:760px){.layout{grid-template-columns:1fr}}
  .visual{display:flex;flex-direction:column;gap:12px}
    .cover-wrap{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--border);background:#0a0a0a;
    aspect-ratio:1;display:flex;align-items:center;justify-content:center;cursor:pointer}
  .cover-wrap img{width:100%;height:100%;object-fit:cover;display:block}
  .cover-ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:13px;width:100%;height:100%}
  .cover-ph svg{width:65%;height:65%;opacity:.6}
  .upload-hint{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:6px;background:rgba(0,0,0,0);opacity:0;
    transition:opacity .2s,background .2s;border-radius:11px;z-index:3;pointer-events:none}
  .cover-wrap:hover .upload-hint,.tray-zone:hover .upload-hint{background:rgba(0,0,0,.55);opacity:1}
  .upload-hint .material-symbols-outlined{font-size:36px;color:#fff}
  .upload-hint .txt{color:#fff;font-size:12.5px;font-weight:500;text-align:center}
  .tray-zone{position:relative;cursor:pointer;border-radius:12px;overflow:hidden}
  .tray-zone img{width:100%;height:240px;display:block;object-fit:contain;
    border-radius:12px;border:1px solid var(--border);background:var(--bg)}
  .tray-ph{padding:24px 16px;color:var(--muted);font-size:13px;text-align:center;
    border:1px dashed var(--border);border-radius:12px;display:flex;flex-direction:column;
    align-items:center;gap:8px;justify-content:center;min-height:100px;
    transition:border-color .2s,background .2s}
  .tray-zone.empty .tray-ph{width:100%;box-sizing:border-box}
  .tray-zone.empty:hover .tray-ph{border-color:var(--accent);background:rgba(99,102,241,.06);color:var(--accent)}
  .tray-zone.empty:hover .tray-ph .material-symbols-outlined{color:var(--accent)}
  .tray-ph .material-symbols-outlined{font-size:36px}
  h2{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
    color:var(--muted);margin:0 0 12px}
  .sec{background:var(--card);border:1px solid var(--border);border-radius:14px;
    padding:16px 18px;margin-bottom:14px}
  /* Repère « écrit dans les métadonnées ID3 des pistes MP3 ». */
  .fg-head{display:flex;align-items:center;gap:5px}
  .meta-badge{font-size:14px;color:var(--accent);cursor:help;
    font-variation-settings:'FILL' 1,'opsz' 20}
  .meta-legend{display:flex;align-items:center;gap:6px;color:var(--muted);
    font-size:11px;margin:2px 0 12px}
  .meta-legend .material-symbols-outlined{font-size:15px;color:var(--accent);
    font-variation-settings:'FILL' 1}
  /* Champ date : saisie manuelle + bouton calendrier (impose AAAA-MM-JJ). */
  .date-field{position:relative;display:flex;align-items:center}
  .date-field #e-date{flex:1;padding-right:38px;width:100%}
  .date-cal-btn{position:absolute;right:4px;top:50%;transform:translateY(-50%);
    width:30px;height:30px;margin:0;padding:0;border:none;background:transparent;
    color:var(--muted);border-radius:8px;display:flex;align-items:center;
    justify-content:center;cursor:pointer}
  .date-cal-btn:hover{color:var(--accent);background:var(--bg)}
  .date-cal-btn .material-symbols-outlined{font-size:19px}
  /* Calendrier personnalisé (aux couleurs du site, dark/light automatique). */
  .cal-pop{position:absolute;top:calc(100% + 6px);right:0;z-index:60;width:min(290px,88vw);
    background:var(--card);border:1px solid var(--border);border-radius:14px;
    box-shadow:0 14px 34px rgba(0,0,0,.38);padding:12px;color:var(--fg)}
  .cal-pop[hidden]{display:none}
  .cal-head{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
  .cal-nav-row{display:flex;align-items:center;justify-content:space-between}
  .cal-year{font-weight:700;font-size:15px}
  .cal-month{font-weight:600;font-size:13.5px;text-transform:capitalize;color:var(--muted)}
  .cal-nav{width:30px;height:30px;border:none;background:transparent;color:var(--muted);
    border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;margin:0;padding:0}
  .cal-nav:hover{background:var(--bg);color:var(--fg)}
  .cal-nav .material-symbols-outlined{font-size:20px}
  .cal-wd{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:2px}
  .cal-wd span{text-align:center;font-size:11px;color:var(--muted);padding:2px 0;text-transform:capitalize}
  .cal-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .cal-day{height:32px;border:none;background:transparent;color:var(--fg);border-radius:8px;
    cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;margin:0;padding:0}
  .cal-day.empty{visibility:hidden;pointer-events:none}
  .cal-day:hover{background:var(--bg)}
  .cal-day.today{box-shadow:inset 0 0 0 1px var(--accent);color:var(--accent)}
  .cal-day.sel{background:var(--accent);color:#fff;font-weight:600}
  .cal-day.sel:hover{background:var(--accent)}
  .cal-foot{display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--border)}
  .cal-act{border:none;background:transparent;color:var(--accent);font-size:13px;cursor:pointer;margin:0;padding:4px 8px;border-radius:7px}
  .cal-act:hover{background:var(--bg)}
  .date-field #e-date.date-invalid{border-color:#e5484d}
  .date-hint{color:#e5484d;font-size:11.5px;margin-top:3px;display:none}
  .date-hint.show{display:block}
  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  @media(max-width:540px){.field-grid{grid-template-columns:1fr}}
  .field-grid .full{grid-column:1/-1}
  .fg{display:flex;flex-direction:column;gap:4px}
  .fg label{font-size:11.5px;color:var(--muted);font-weight:500}
  .fg input,.fg select{margin:0;font-size:13px;padding:7px 10px}
  .fg .ac-field input{padding-left:36px;padding-right:34px}
  /* Drapeaux de pays (case Ville) : rectangle lisible, pas le cercle des avatars. */
  #e-city .ac-list li img{border-radius:3px;object-fit:contain;background:var(--border);width:26px;height:20px}
  .tracks-list{list-style:none;padding:0;margin:0 0 10px}
  .tracks-list li{display:flex;align-items:center;gap:8px;padding:4px 0;
    border-bottom:1px solid var(--border)}
  .tracks-list li:last-child{border-bottom:none}
  .tracks-list .drag-handle{color:var(--muted);cursor:grab;display:flex;align-items:center;gap:4px;padding:0 4px;user-select:none;font-size:18px;flex-shrink:0}
  .tracks-list .drag-handle:active{cursor:grabbing}
  .tracks-list .drag-handle .n{color:var(--accent);font-size:12px;font-variant-numeric:tabular-nums;min-width:20px;font-weight:600}
  .tracks-list li.drag-over{border-top:2px solid var(--accent);padding-top:2px}
  .tracks-list input{flex:1;margin:0;padding:4px 8px;font-size:13px;height:30px}
  .del-btn{all:unset;cursor:pointer;color:var(--muted);display:flex;padding:3px;border-radius:5px}
  .del-btn:hover{color:#e57373;background:rgba(229,115,115,.12)}
  .del-btn .material-symbols-outlined{font-size:15px}
  .tracks-head{display:flex;align-items:center;gap:14px;margin-bottom:12px}
  .tracks-head h2{margin:0;order:2}
  .tracks-head #btn-open-editor{order:1}
  #btn-open-editor[disabled]{opacity:.5;cursor:not-allowed}
  #btn-open-editor[disabled]:hover{background:transparent;border-color:var(--border)}
  .add-track-row{display:flex;gap:8px}
  .add-track-row input{flex:1;margin:0;padding:6px 10px;font-size:13px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
  .lchip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 12px;
    border-radius:999px;border:1px solid var(--border);background:var(--card);
    font-size:12.5px;font-weight:500}
  .lchip button{all:unset;cursor:pointer;display:flex;color:var(--muted);border-radius:50%}
  .lchip button:hover{color:var(--fg)}
  .lchip .material-symbols-outlined{font-size:15px}
  .lchip.derived{color:var(--muted);opacity:.85}
  .addrow{display:flex;gap:8px}
  .addrow input{flex:1;margin:0}
  .dl{display:flex;flex-wrap:wrap;gap:8px}
  .dl a{margin:0;height:34px;font-size:12.5px}
  .save-row{display:flex;gap:8px;align-items:center;margin-top:12px}
  .publish-row{display:flex;gap:12px;align-items:center;margin-top:12px}
  .publish-status{font-size:12.5px;color:var(--muted);flex:1}
  .save-row button{margin:0}
  @keyframes disk-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  @keyframes check-pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.25)}100%{transform:scale(1);opacity:1}}
  .save-btn-icon{display:inline-flex;transition:color .25s}
  .primary.saving .save-btn-icon{animation:disk-spin .55s linear infinite}
  .primary.saved .save-btn-icon{animation:check-pop .32s cubic-bezier(.34,1.56,.64,1);color:#4ade80}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--accent);color:#0d0f13;padding:10px 18px;border-radius:10px;
    font-size:13px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99}
  .toast.show{opacity:1}
  .toast.err{background:#e57373;color:#fff}
  .cfm-back{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px}
  .cfm-box{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:22px;max-width:440px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.4)}
  .cfm-msg{margin:0 0 18px;line-height:1.5;white-space:pre-line}
  .cfm-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
  .cfm-actions button{margin:0}
  input[type="file"]{display:none}
  #save-all{background:var(--accent);color:#0d0f13;font-weight:600;border:none}
  #save-all:hover{background:var(--accent);border-color:var(--accent)}
  #save-all.saving .save-btn-icon{animation:disk-spin .55s linear infinite}
  #save-all.saved .save-btn-icon{animation:check-pop .32s cubic-bezier(.34,1.56,.64,1);color:#4ade80}
  .ptc-toggle-row{display:flex;align-items:center;gap:8px;font-size:13px;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);cursor:pointer;user-select:none}
  .ptc-toggle-row input[type=checkbox]{width:15px;height:15px;cursor:pointer;accent-color:var(--accent);flex-shrink:0}
  .ptc-badge{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent);white-space:nowrap}
  .tc-slot{width:48px;height:48px;flex-shrink:0;border-radius:8px;overflow:hidden;border:1px solid var(--border);background:var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
  .tc-slot img{width:100%;height:100%;object-fit:cover;display:block}
  .tc-slot-ph{color:var(--muted)}
  .tc-slot-ph .material-symbols-outlined{font-size:22px}
  .tc-slot:hover .tc-slot-hint,.tc-slot:focus .tc-slot-hint{opacity:1}
  .tc-slot-hint{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s;border-radius:7px;pointer-events:none}
  .tc-slot-hint .material-symbols-outlined{font-size:18px;color:#fff}
  .track-gear{all:unset;cursor:pointer;padding:4px;border-radius:6px;color:var(--muted);display:flex;align-items:center;flex-shrink:0}
  .track-gear:hover{background:var(--border);color:var(--text)}
  .track-gear .material-symbols-outlined{font-size:18px}
  /* Cover viewer modal */
  .tcv-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;display:none;align-items:center;justify-content:center}
  .tcv-overlay.open{display:flex}
  .tcv-box{background:var(--card);border-radius:16px;padding:20px;max-width:520px;width:90%;display:flex;flex-direction:column;gap:16px;position:relative}
  .tcv-box img{width:100%;border-radius:8px;object-fit:contain;max-height:60vh}
  .tcv-ph{width:100%;aspect-ratio:1;border-radius:8px;background:var(--border);display:flex;align-items:center;justify-content:center}
  .tcv-ph .material-symbols-outlined{font-size:48px;color:var(--muted)}
  .tcv-actions{display:flex;gap:8px}
  .tcv-close{position:absolute;top:12px;right:12px;all:unset;cursor:pointer;padding:4px;border-radius:50%;background:var(--border);display:flex}
  .tcv-close .material-symbols-outlined{font-size:20px}
  /* Track meta modal */
  .tm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:1000;display:none;align-items:center;justify-content:center}
  .tm-overlay.open{display:flex}
  .tm-box{background:var(--card);border-radius:16px;padding:24px;max-width:460px;width:90%;display:flex;flex-direction:column;gap:16px;position:relative}
  .tm-box h3{margin:0;font-size:15px;font-weight:600;color:var(--muted)}
  .tm-fields{display:flex;flex-direction:column;gap:10px}
  .tm-fields label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .tm-fields input{width:100%;box-sizing:border-box}
  .tm-footer{display:flex;justify-content:flex-end;gap:8px}
  .cover-del-btn{display:none;width:100%;margin-top:6px;justify-content:center;align-items:center;gap:6px;color:var(--danger,#e57373);border-color:var(--danger,#e57373)}
    .tc-del{all:unset;position:absolute;top:2px;right:2px;cursor:pointer;background:rgba(0,0,0,.65);border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center;z-index:2}
  .tc-del .material-symbols-outlined{font-size:12px;color:#fff}
  .tc-del:hover{background:#e57373}
  input.tc-file{display:none}
</style>
</head>
<body>
<header></header>

<main>
  <div class="page-nav">
    <button class="icon-btn" onclick="location.href='/album/'+SLUG"><span class="material-symbols-outlined">arrow_back</span><span id="t-back">Retour</span></button>
    <button class="icon-btn hidden" id="fix-url"><span class="material-symbols-outlined">link</span><span id="t-fix-url">Corriger l'URL</span></button>
    <button class="icon-btn" id="save-all"><span class="material-symbols-outlined save-btn-icon">save</span><span id="t-save-all">Enregistrer</span></button>
  </div>
  <div class="layout">
    <!-- Colonne gauche -->
    <div class="visual">
      <div>
        <div class="cover-wrap" id="cover-wrap">
          <div class="cover-ph" id="cover-ph">
            
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <circle cx="50" cy="50" r="44" fill="#2a2d38"/>
    <circle cx="50" cy="50" r="43" fill="none" stroke="#4a4d5a" stroke-width="1.5" opacity=".5"/>
    <circle cx="50" cy="50" r="38" fill="none" stroke="#4a4d5a" stroke-width="0.8" opacity=".4"/>
    <circle cx="50" cy="50" r="33" fill="none" stroke="#4a4d5a" stroke-width="0.8" opacity=".3"/>
    <circle cx="50" cy="50" r="26" fill="none" stroke="#4a4d5a" stroke-width="0.8" opacity=".25"/>
    <circle cx="50" cy="50" r="20" fill="#1a1c22"/>
    <circle cx="50" cy="50" r="19" fill="none" stroke="#4a4d5a" stroke-width="1" opacity=".4"/>
    <circle cx="50" cy="50" r="5" fill="#0a0a0a"/>
  </svg>
            <span id="t-no-cover">Aucune pochette</span>
          </div>
          <div class="upload-hint">
            <span class="material-symbols-outlined">upload</span>
            <span class="txt" id="t-cover-hint">Importer une pochette</span>
          </div>
        </div>
        <input type="file" id="cover-file" accept="image/jpeg,image/png,image/webp">
        <button class="icon-btn cover-del-btn" id="cover-del-btn" type="button" onclick="deleteAlbumCover()">
          <span class="material-symbols-outlined">delete</span><span id="t-cover-del">Supprimer la pochette</span>
        </button>
        <input type="file" id="traycard-file" accept="application/pdf">
      </div>
      <div id="traycard-wrap"></div>
      <div class="dl" id="dl"></div>
      <!-- Publication : sous les pochettes, la visibilité vitrine est une
           propriété du visuel de l'album autant qu'une action d'édition. -->
      <div class="sec">
        <h2 id="t-publish-h">Publication</h2>
        <div class="publish-row">
          <span class="publish-status" id="publish-status"></span>
          <button id="btn-publish"><span class="material-symbols-outlined">visibility</span><span id="t-btn-publish">Publier</span></button>
        </div>
        <!-- Portée : prod et preprod partagent le même stockage d'albums. Un
             album créé en preprod porte une étiquette qui le masque du
             catalogue prod ; la « pousser en prod » ne fait que la retirer. -->
        <div class="publish-row hidden" id="scope-row" style="margin-top:12px">
          <span class="publish-status" id="scope-status"></span>
          <button id="btn-promote"><span class="material-symbols-outlined">rocket_launch</span><span id="t-btn-promote">Pousser en prod</span></button>
        </div>
      </div>
    </div>

    <!-- Colonne droite -->
    <div>
      <!-- Infos album -->
      <div class="sec">
        <h2 id="t-meta">Informations</h2>
        <p class="meta-legend"><span class="material-symbols-outlined">sell</span><span id="t-meta-legend"></span></p>
        <div class="field-grid">
          <div class="fg full"><span class="fg-head"><label id="t-f-title">Titre</label><span class="meta-badge material-symbols-outlined">sell</span></span><input id="e-title" type="text"></div>
          <div class="fg"><span class="fg-head"><label id="t-f-artist">Artiste</label><span class="meta-badge material-symbols-outlined">sell</span></span><div id="e-artist"></div></div>
          <div class="fg"><span class="fg-head"><label id="t-f-date">Date</label><span class="meta-badge material-symbols-outlined">sell</span></span>
            <div class="date-field">
              <input id="e-date" type="text" placeholder="AAAA-MM-JJ" inputmode="numeric" autocomplete="off">
              <button type="button" class="date-cal-btn" id="date-cal-btn"><span class="material-symbols-outlined">calendar_month</span></button>
              <div class="cal-pop" id="cal-pop" hidden>
                <div class="cal-head">
                  <div class="cal-nav-row">
                    <button type="button" class="cal-nav" data-y="-1"><span class="material-symbols-outlined">chevron_left</span></button>
                    <span class="cal-year" id="cal-year"></span>
                    <button type="button" class="cal-nav" data-y="1"><span class="material-symbols-outlined">chevron_right</span></button>
                  </div>
                  <div class="cal-nav-row">
                    <button type="button" class="cal-nav" data-m="-1"><span class="material-symbols-outlined">chevron_left</span></button>
                    <span class="cal-month" id="cal-month"></span>
                    <button type="button" class="cal-nav" data-m="1"><span class="material-symbols-outlined">chevron_right</span></button>
                  </div>
                </div>
                <div class="cal-wd" id="cal-wd"></div>
                <div class="cal-days" id="cal-days"></div>
                <div class="cal-foot">
                  <button type="button" class="cal-act" id="cal-clear"></button>
                  <button type="button" class="cal-act" id="cal-today"></button>
                </div>
              </div>
            </div>
            <div class="date-hint" id="date-hint"></div></div>
          <div class="fg full"><label id="t-f-guests">Artistes invités</label>
            <div class="guest-list" id="guest-list"></div>
            <div id="e-guest-add"></div></div>
          <div class="fg"><label id="t-f-venue">Lieu</label><input id="e-venue" type="text"></div>
          <div class="fg"><label id="t-f-city">Ville</label><div id="e-city"></div></div>
          <div class="fg full"><label id="t-f-festival">Festival</label><div id="e-festival"></div></div>
          <div class="fg full"><label id="t-f-src-label">Source (texte)</label><input id="e-src-label" type="text" placeholder="Diffusion TF1 du 05/06/2026…"></div>
          <div class="fg full"><label id="t-f-src-url">Source (URL)</label><input id="e-src-url" type="url" placeholder="https://…"></div>
        </div>
        <div class="ptc-toggle-row" id="ptc-row">
          <input type="checkbox" id="ptc-chk">
          <label for="ptc-chk" id="t-ptc-label" style="cursor:pointer;flex:1"></label>
        </div>
      </div>

      <!-- Pistes -->
      <div class="sec">
        <div class="tracks-head">

// Le bloc n'apparaît qu'en preprod : en production il n'y a rien à pousser, et
// l'API refuse l'opération de toute façon (`can_promote` faux).
function refreshScopeRow(){
  const row=document.getElementById("scope-row");
  if(!row||!DATA)return;
  const t=TT[L()];
  // Servi par la production : il n'y a rien à pousser, on masque le bloc.
  if(DATA.env==="prod"){row.classList.add("hidden");return;}
  const isPreprod=DATA.origin_env&&DATA.origin_env!=="prod";
  row.classList.remove("hidden");
  const btn=document.getElementById("btn-promote");
  const lbl=document.getElementById("t-btn-promote");
  const ic=btn.querySelector(".material-symbols-outlined");
  const st=document.getElementById("scope-status");
  if(isPreprod){
    st.textContent=t.scope_preprod;
    lbl.textContent=t.promote_btn; ic.textContent="rocket_launch";
    btn.className="primary";
  }else{
    st.textContent=t.scope_prod;
    lbl.textContent=t.demote_btn; ic.textContent="undo";
    btn.className="";
  }
}
document.getElementById("btn-promote").onclick=async()=>{
  const t=TT[L()];
  const isPreprod=DATA&&DATA.origin_env&&DATA.origin_env!=="prod";
  const btn=document.getElementById("btn-promote");
  btn.disabled=true;
  try{
    const r=await fetch(`/api/albums/${encodeURIComponent(SLUG)}/`
      +(isPreprod?"promote":"demote"),{method:"POST"});
    if(!r.ok){
      const d=await r.json().catch(()=>({}));
      throw new Error(d.detail||`HTTP ${r.status}`);
    }
    const d=await r.json();
    DATA.origin_env=d.origin_env;
    refreshScopeRow();
    toast(isPreprod?t.promote_done:t.demote_done);
  }catch(e){
    toast(e.message||"Erreur",true);
  }finally{btn.disabled=false;}
};

function toast(msg,err=false){
  const el=document.getElementById("toast");el.textContent=msg;
  el.className="toast"+(err?" err":"");el.classList.add("show");
  setTimeout(()=>el.classList.remove("show"),2200);}
const _saveStart={};
function showSaved(btnId){
  // Laisse la disquette tourner au moins 450 ms, même si la sauvegarde est instantanée
  const wait=Math.max(0,450-(Date.now()-(_saveStart[btnId]||0)));
  setTimeout(()=>{
    const btn=document.getElementById(btnId);
    const ic=btn.querySelector(".save-btn-icon");
    btn.classList.remove("saving");
    ic.textContent="done";
    btn.classList.add("saved");
    setTimeout(()=>{btn.classList.remove("saved");ic.textContent="save";},2400);
  },wait);}

function savingStart(btnId){
  _saveStart[btnId]=Date.now();
  document.getElementById(btnId).classList.add("saving");}

function savingError(btnId){
  const btn=document.getElementById(btnId);
  btn.classList.remove("saving");
  btn.querySelector(".save-btn-icon").textContent="save";}

let dragSrcIdx=null;
let PER_TRACK=false, TC_MAP={};

async function loadTrackCovers(){
  const r=await fetch(`/api/albums/${SLUG}/track-covers`);
  if(!r.ok)return;
  const d=await r.json();

function renderTracks(){
  const ul=document.getElementById("tracks-list");
  const t=TT[L()];
  ul.innerHTML=tracks.map((tr,i)=>{
    const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;");
    const tc=TC_MAP[tr.n];
    const slot=PER_TRACK?`<div class="tc-slot" tabindex="0" data-n="${tr.n}" title="${t.tc_upload}">
      ${tc?`<img src="${tc.cover_url}?t=${Date.now()}" alt="">`:`<span class="tc-slot-ph"><span class="material-symbols-outlined">image</span></span>`}
      <div class="tc-slot-hint"><span class="material-symbols-outlined">zoom_in</span></div>
    </div>`:""
    const gear=PER_TRACK?`<button class="track-gear" data-n="${tr.n}" data-i="${i}" title="Métadonnées"><span class="material-symbols-outlined">tune</span></button>`:"";
    return `<li data-i="${i}">${slot}
    <span class="drag-handle" draggable="true" data-i="${i}"><span class="material-symbols-outlined">drag_indicator</span><span class="n">${String(i+1).padStart(2,"0")}</span></span>
    <input type="text" value="${esc(tr.title)}" data-i="${i}">
    ${gear}
    <button class="del-btn" data-i="${i}" title="${t.del_t}"><span class="material-symbols-outlined">delete</span></button>
    </li>`;
  }).join("");
  ul.querySelectorAll("input[data-i]").forEach(inp=>{inp.oninput=()=>{tracks[+inp.dataset.i].title=inp.value;};});
  ul.querySelectorAll(".del-btn").forEach(btn=>{btn.onclick=()=>{tracks.splice(+btn.dataset.i,1);renderTracks();};});
  if(PER_TRACK){
    ul.querySelectorAll(".tc-slot").forEach(slot=>{
      slot.addEventListener("click",()=>openTcv(+slot.dataset.n));
      slot.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openTcv(+slot.dataset.n);}});
    });
    ul.querySelectorAll(".track-gear").forEach(btn=>{
      btn.addEventListener("click",()=>openTmModal(+btn.dataset.n,+btn.dataset.i));
    });
  }
  ul.querySelectorAll(".drag-handle").forEach(handle=>{
    const li=handle.closest("li");
    handle.addEventListener("dragstart",e=>{dragSrcIdx=+handle.dataset.i;e.dataTransfer.effectAllowed="move";li.style.opacity="0.4";});
    handle.addEventListener("dragend",()=>{li.style.opacity="";ul.querySelectorAll("li").forEach(l=>l.classList.remove("drag-over"));});
  });
  ul.querySelectorAll("li").forEach(li=>{
    li.addEventListener("dragover",e=>{e.preventDefault();e.dataTransfer.dropEffect="move";
      ul.querySelectorAll("li").forEach(l=>l.classList.remove("drag-over"));
      if(+li.dataset.i!==dragSrcIdx)li.classList.add("drag-over");});
    li.addEventListener("drop",e=>{e.stopPropagation();
      const dst=+li.dataset.i;
      if(dragSrcIdx===null||dragSrcIdx===dst)return;
      const moved=tracks.splice(dragSrcIdx,1)[0];
      tracks.splice(dst,0,moved);
      dragSrcIdx=null;
      renderTracks();});
  });
}

// Date : saisie manuelle libre, reformulée automatiquement vers un format ISO
// partiel (AAAA, AAAA-MM ou AAAA-MM-JJ). Le bouton calendrier ouvre un sélecteur
// personnalisé (aux couleurs du site). Une saisie non interprétable est refusée.
const _DATE_MONTHS={
  janvier:1,fevrier:2,mars:3,avril:4,mai:5,juin:6,juillet:7,aout:8,septembre:9,octobre:10,novembre:11,decembre:12,
  january:1,february:2,march:3,april:4,may:5,june:6,july:7,august:8,september:9,october:10,november:11,december:12,
  janv:1,fevr:2,avr:4,juil:7,sept:9,oct:10,nov:11,dec:12,jan:1,feb:2,mar:3,apr:4,jun:6,jul:7,aug:8};
// Reformule une date libre en ISO partiel. "" pour vide, null si illisible.
function normalizeDate(raw){
  const strip=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"");
  const pad=n=>String(n).padStart(2,"0");
  const iso=(y,m,d)=>{
    if(m!=null&&(m<1||m>12))return null;
    if(d!=null&&(d<1||d>31))return null;
    let s=String(y).padStart(4,"0");
    if(m!=null)s+="-"+pad(m);
    if(d!=null)s+="-"+pad(d);
    return s;
  };
  let v=strip((raw||"").trim().toLowerCase()).replace(/\s+/g," ");
  if(!v)return "";
  // 1) Mois en toutes lettres (fr/en) : "[jj] mois aaaa" / "mois [jj] aaaa".
  for(const mt of Object.keys(_DATE_MONTHS).sort((a,b)=>b.length-a.length)){
    if(new RegExp("(?:^|[^a-z])"+mt+"(?:[^a-z]|$)").test(v)){
      const year=(v.match(/\b(\d{4})\b/)||[])[1];
      if(!year)continue;
      const nums=(v.match(/\b\d{1,2}\b/g)||[]);
      return iso(parseInt(year,10),_DATE_MONTHS[mt],nums.length?parseInt(nums[0],10):null);
    }
  }
  // 2) Numérique, séparateurs - / . espace.
  const parts=v.split(/[-\/.\s]+/).filter(Boolean);
  if(parts.length&&parts.every(p=>/^\d+$/.test(p))){
    const P=parts.map(x=>parseInt(x,10));
    if(parts.length===1&&parts[0].length===4)return iso(P[0]);
    if(parts.length===2){
      if(parts[0].length===4)return iso(P[0],P[1]);
      if(parts[1].length===4)return iso(P[1],P[0]);
    }
    if(parts.length===3){
      if(parts[0].length===4)return iso(P[0],P[1],P[2]);
      if(parts[2].length===4)return iso(P[2],P[1],P[0]);   // jj/mm/aaaa (fr)
    }
  }
  return null;
}
// Reformule en place ; marque invalide seulement si vraiment illisible.
function validateDate(){
  const txt=document.getElementById("e-date"),hint=document.getElementById("date-hint");
  const norm=normalizeDate(txt.value);
  if(norm===null){
    txt.classList.add("date-invalid");hint.classList.add("show");return false;
  }
  if(norm!==txt.value.trim())txt.value=norm;   // reformulation visible
  txt.classList.remove("date-invalid");hint.classList.remove("show");return true;
}
(function initDatePicker(){
  const txt=document.getElementById("e-date");
  const btn=document.getElementById("date-cal-btn");
  const pop=document.getElementById("cal-pop");
  const yearEl=document.getElementById("cal-year");
  const monthEl=document.getElementById("cal-month");
  const wdEl=document.getElementById("cal-wd");
  const daysEl=document.getElementById("cal-days");
  const today=new Date();
  let view=new Date();   // mois affiché
  const pad=n=>String(n).padStart(2,"0");
  const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const lang=()=>localStorage.getItem("l2m-lang")||"fr";
  function parseSel(){ const m=txt.value.trim().match(/^(\d{4})-(\d{2})-(\d{2})$/); return m?new Date(+m[1],+m[2]-1,+m[3]):null; }
  function render(){
    const y=view.getFullYear(),mo=view.getMonth(),sel=parseSel();
    yearEl.textContent=y;
    monthEl.textContent=new Intl.DateTimeFormat(lang(),{month:"long"}).format(view);
    // En-tête jours (lundi en premier) via Intl — le 1er janv. 2024 est un lundi.
    wdEl.innerHTML=Array.from({length:7},(_,i)=>
      `<span>${new Intl.DateTimeFormat(lang(),{weekday:"short"}).format(new Date(2024,0,1+i))}</span>`).join("");
    const startDow=(new Date(y,mo,1).getDay()+6)%7;   // lundi=0
    const nDays=new Date(y,mo+1,0).getDate();
    let h="";
    for(let i=0;i<startDow;i++)h+=`<span class="cal-day empty"></span>`;
    for(let d=1;d<=nDays;d++){
      const isToday=today.getFullYear()===y&&today.getMonth()===mo&&today.getDate()===d;
      const isSel=sel&&sel.getFullYear()===y&&sel.getMonth()===mo&&sel.getDate()===d;
      h+=`<button type="button" class="cal-day${isSel?" sel":""}${isToday?" today":""}" data-d="${d}">${d}</button>`;
    }
    daysEl.innerHTML=h;
    daysEl.querySelectorAll(".cal-day[data-d]").forEach(b=>b.onclick=()=>{
      txt.value=ymd(new Date(y,mo,+b.dataset.d));validateDate();close();
    });
  }
  function open(){ const s=parseSel();view=s?new Date(s.getFullYear(),s.getMonth(),1):new Date(today.getFullYear(),today.getMonth(),1);render();pop.hidden=false;
    document.addEventListener("mousedown",onDoc,true);document.addEventListener("keydown",onKey); }
  function close(){ pop.hidden=true;document.removeEventListener("mousedown",onDoc,true);document.removeEventListener("keydown",onKey); }
  function onDoc(e){ if(!pop.contains(e.target)&&!btn.contains(e.target))close(); }
  function onKey(e){ if(e.key==="Escape")close(); }
  btn.onclick=e=>{ e.stopPropagation();pop.hidden?open():close(); };
  pop.querySelectorAll(".cal-nav").forEach(b=>b.onclick=()=>{
    if(b.dataset.y)view=new Date(view.getFullYear()+ +b.dataset.y,view.getMonth(),1);
    else view=new Date(view.getFullYear(),view.getMonth()+ +b.dataset.m,1);
    render();
  });
  document.getElementById("cal-today").onclick=()=>{ txt.value=ymd(today);validateDate();close(); };
  document.getElementById("cal-clear").onclick=()=>{ txt.value="";validateDate();close(); };
  txt.addEventListener("blur",validateDate);
  txt.addEventListener("input",()=>{ if(txt.classList.contains("date-invalid"))validateDate(); });
})();

// Save all
document.getElementById("save-all").onclick=async()=>{
  const aPick=artistAC?artistAC.get():{id:"",label:""};
  const cPick=cityAC?cityAC.get():{id:"",label:""};
  const fPick=festivalAC?festivalAC.get():{id:"",label:""};
  const p={artist:(aPick.label||"").trim(),artist_id:aPick.id||"",
    title:document.getElementById("e-title").value.trim(),
    date:document.getElementById("e-date").value.trim(),
    venue:document.getElementById("e-venue").value.trim(),
    city:(cPick.label||"").trim(),city_id:cPick.id||"",
    festival:(fPick.label||"").trim(),festival_id:fPick.id||"",
    guests:guests.map(g=>({id:String(g.id),name:g.name})),
    source_url:document.getElementById("e-src-url").value.trim(),
    source_label:document.getElementById("e-src-label").value.trim()};
  if(!p.artist||!p.title){toast("Artiste et titre requis",true);return;}
  if(!validateDate()){toast(TT[L()].date_invalid,true);document.getElementById("e-date").focus();return;}
  p.date=document.getElementById("e-date").value.trim();   // date reformulée par validateDate()
  savingStart("save-all");
  if(PENDING_COVER_DELETE){
    const rDel=await fetch(`/api/albums/${SLUG}/cover/auto`,{method:"DELETE"});
    if(rDel.ok){DATA.has_cover=false;PENDING_COVER_DELETE=false;}
    else{savingError("save-all");toast("Erreur suppression pochette ("+rDel.status+")",true);return;}
  }
  // Sérialisé (et non Promise.all) : les trois endpoints rechargent et
  // réécrivent le même manifest.yaml ; en parallèle, le dernier write écrase les
  // autres (perte de champs, ex. la date). On enchaîne donc les écritures.
  const rMeta=await fetch(`/api/albums/${SLUG}/meta`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(p)});
  const rTracks=await fetch(`/api/albums/${SLUG}/tracks`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({tracks:tracks.map(t=>({n:t.n,title:t.title,...(t.artist?{artist:t.artist}:{})}))})});
  const rLabels=await fetch(`/api/albums/${SLUG}/labels`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({labels})});
  if(rMeta.ok) document.title=`live2mp3 — ${p.title}`;
  if(rLabels.ok){const d=await rLabels.json();labels=d.labels;renderChips();}
  if(rMeta.ok&&rTracks.ok&&rLabels.ok){showSaved("save-all");}
  else{savingError("save-all");toast("Erreur lors de l'enregistrement",true);}
};

document.getElementById("ptc-chk").addEventListener("change",async e=>{

// ── Cover viewer modal ──────────────────────────────────────────────────────
let TCV_N=null;
function openTcv(n){
  TCV_N=n;
  const tc=TC_MAP[n];
  const med=document.getElementById("tcv-media");
  if(tc){med.innerHTML=`<img src="${tc.cover_url}?t=${Date.now()}" alt="">`;}
  else{med.innerHTML='<div class="tcv-ph"><span class="material-symbols-outlined">image</span></div>';}
  document.getElementById("tcv-overlay").classList.add("open");
}
function closeTcv(e){if(e&&e.target!==document.getElementById("tcv-overlay"))return;document.getElementById("tcv-overlay").classList.remove("open");TCV_N=null;}
function closeTcvModal(){document.getElementById("tcv-overlay").classList.remove("open");TCV_N=null;}

function _bindTcvEvents(){
  const tcvFile=document.getElementById("tcv-file");
  if(tcvFile)tcvFile.addEventListener("change",async e=>{
    const file=e.target.files[0];if(!file||TCV_N===null)return;
    const t=TT[L()];
    const fd=new FormData();fd.append("file",file);
    const r=await fetch(`/api/albums/${SLUG}/tracks/${TCV_N}/cover`,{method:"POST",body:fd});
    if(r.ok){
      const d=await r.json();
      for(const tc of d.track_covers)TC_MAP[tc.track_n]=tc;
      openTcv(TCV_N);
      renderTracks();
      toast(t.saved+" ✓");
    }else toast("Erreur upload ("+r.status+")",true);
    e.target.value="";
  });
  const tcvDel=document.getElementById("tcv-del");
  if(tcvDel)tcvDel.addEventListener("click",async()=>{
    if(TCV_N===null)return;
    const tc=TC_MAP[TCV_N];if(!tc)return;
    const r=await fetch(`/api/track-covers/${tc.id}`,{method:"DELETE"});
    if(r.ok){delete TC_MAP[TCV_N];closeTcvModal();renderTracks();}
    else toast("Erreur",true);
  });
}

async function load(){
  DATA=await(await fetch(`/api/albums/${SLUG}`)).json();
  refreshScopeRow();
  const a=DATA.album||{};
  document.title=`live2mp3 — ${a.title||SLUG}`;
  document.getElementById("e-title").value=a.title||"";
  document.getElementById("e-date").value=a.date||"";
  document.getElementById("e-venue").value=a.venue||"";
  const tt=TT[L()];
  // Artiste principal : autocomplete Deezer, texte libre autorisé (un artiste
  // absent de Deezer reste enregistrable, simplement non lié à une page).
  artistAC=L2M.autocomplete(document.getElementById("e-artist"),{
    endpoint:"/api/social/suggest/artists",icon:"music_note",allowFree:true,
    placeholder:tt.artist_ph,value:{id:a.artist_id||"",label:a.artist||""}});
  // Ville (optionnelle) : villes du monde via OSM, drapeau du pays en vignette.
  // Texte libre autorisé — une ville absente de la source reste enregistrable.
  cityAC=L2M.autocomplete(document.getElementById("e-city"),{
    endpoint:"/api/social/suggest/world-cities",icon:"location_on",allowFree:true,
    placeholder:tt.city_ph,value:{id:a.city_id||"",label:a.city||""}});
  // Festival : liste auto-construite + création en texte libre.
  festivalAC=L2M.autocomplete(document.getElementById("e-festival"),{
    endpoint:"/api/social/suggest/festivals",icon:"festival",allowFree:true,
    placeholder:tt.festival_ph,value:{id:a.festival_id||"",label:a.festival||""}});
  // Invités : canonique seulement (un id est requis pour lier la page artiste).
  guests=(a.guests||[]).map(g=>({id:String(g.id),name:g.name||g.label}));
  renderGuests();
  let guestAC;
  guestAC=L2M.autocomplete(document.getElementById("e-guest-add"),{
    endpoint:"/api/social/suggest/artists",icon:"person_add",placeholder:tt.guests_ph,
    onPick:(p)=>{if(p&&p.id){if(!guests.some(g=>g.id===p.id)){guests.push({id:p.id,name:p.label});renderGuests();}setTimeout(()=>guestAC.clear(),0);}}});
  document.getElementById("e-src-url").value=DATA.source_url||"";
  document.getElementById("e-src-label").value=DATA.source_label||"";
  labels=(DATA.labels||[]).slice();
  tracks=(DATA.tracks||[]).map(t=>({...t}));
  document.getElementById("suggest").innerHTML=(DATA.all_labels||[]).map(l=>`<option value="${l}">`).join("");
  albumPublished=DATA.published!==false;
  PER_TRACK=DATA.per_track_covers===true;
  document.getElementById("ptc-chk").checked=PER_TRACK;
  if(PER_TRACK)await loadTrackCovers();
  renderCover();renderTraycard();renderChips();renderTracks();renderDL();applyLang();
  _bindTcvEvents();
  refreshUrlBtn();
}

// ── Corriger l'URL (slug) ────────────────────────────────────────────────────
// N'apparaît que si l'URL actuelle peut être améliorée d'après les infos de
// l'album (ex. un slug « …-untitled » alors que la date est désormais connue).
async function refreshUrlBtn(){
  const btn=document.getElementById("fix-url");
  if(!btn)return;
  try{
    const p=await(await fetch(`/api/albums/${SLUG}/url-preview`)).json();
    if(p.changed&&p.target){
      btn.dataset.target=p.target;
      btn.title=TT[L()].fix_url_hint("/album/"+p.target);
      btn.classList.remove("hidden");
    }else{btn.classList.add("hidden");}
  }catch(e){btn.classList.add("hidden");}
}

// Petite modale de confirmation (pas de confirm() natif — cf. DA du projet).
function confirmBox(msg){
  return new Promise(res=>{
    const t=TT[L()];
    const back=document.createElement("div");
    back.className="cfm-back";
    back.innerHTML=`<div class="cfm-box" role="dialog" aria-modal="true">
      <p class="cfm-msg"></p>
      <div class="cfm-actions">
        <button class="icon-btn cfm-no"></button>
        <button class="icon-btn cfm-yes" style="background:var(--accent);color:#0d0f13;font-weight:600;border:none"></button>
      </div></div>`;
    back.querySelector(".cfm-msg").textContent=msg;
    back.querySelector(".cfm-no").textContent=t.fix_dlg_no;
    back.querySelector(".cfm-yes").textContent=t.fix_dlg_yes;
    const done=v=>{back.remove();res(v);};
    back.querySelector(".cfm-no").onclick=()=>done(false);
    back.querySelector(".cfm-yes").onclick=()=>done(true);
    back.addEventListener("click",e=>{if(e.target===back)done(false);});
    document.body.appendChild(back);
  });
}

document.getElementById("fix-url").onclick=async()=>{
  const btn=document.getElementById("fix-url");
  const target=btn.dataset.target;
  if(!target)return;
  const t=TT[L()];
  if(!await confirmBox(t.fix_url_confirm("/album/"+target)))return;
  btn.disabled=true;
  try{
    const r=await fetch(`/api/albums/${SLUG}/rename-url`,{method:"POST"});
    const d=await r.json().catch(()=>({}));
    if(!r.ok||!d.ok)throw new Error(d.detail||"error");
    if(d.changed){
      toast(t.fix_url_done);
      // Le slug de la page a changé → on recharge sur la nouvelle URL de gestion.
      setTimeout(()=>{location.href=`/app/album/${d.slug}`;},600);
    }else{
      btn.classList.add("hidden");btn.disabled=false;
    }
  }catch(e){toast("✗",true);btn.disabled=false;}
};
