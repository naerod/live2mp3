<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>live2mp3 — gestion d'album</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">
<link rel="stylesheet" href="/static/app.css">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<style>
  .layout{display:grid;grid-template-columns:280px 1fr;gap:20px;margin-top:16px}
  @media(max-width:760px){.layout{grid-template-columns:1fr}}
  .visual{display:flex;flex-direction:column;gap:12px}
    .cover-wrap{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--border);
    aspect-ratio:1;background:var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer}
  .cover-wrap img{width:100%;height:100%;object-fit:cover;display:block}
  .cover-ph{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--muted);font-size:13px}
  .cover-ph .material-symbols-outlined{font-size:48px}
  .upload-hint{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:6px;background:rgba(0,0,0,0);opacity:0;
    transition:opacity .2s,background .2s;border-radius:11px;z-index:3;pointer-events:none}
  .cover-wrap:hover .upload-hint,.tray-zone:hover .upload-hint{background:rgba(0,0,0,.55);opacity:1}
  .upload-hint .material-symbols-outlined{font-size:36px;color:#fff}
  .upload-hint .txt{color:#fff;font-size:12.5px;font-weight:500;text-align:center}
  .tray-zone{position:relative;cursor:pointer;border-radius:12px;overflow:hidden}
  .tray-zone iframe{width:100%;height:240px;background:#fff;display:block;
    border-radius:12px;border:1px solid var(--border);pointer-events:none}
  .tray-ph{padding:24px 16px;color:var(--muted);font-size:13px;text-align:center;
    border:1px dashed var(--border);border-radius:12px;display:flex;flex-direction:column;
    align-items:center;gap:8px;justify-content:center;min-height:100px;
    transition:border-color .2s,background .2s}
  .tray-zone.empty .tray-ph{width:100%;box-sizing:border-box}
  .tray-zone.empty:hover .tray-ph{border-color:var(--accent);background:rgba(99,102,241,.06);color:var(--accent)}
  .tray-zone.empty:hover .tray-ph .material-symbols-outlined{color:var(--accent)}
  .tray-ph .material-symbols-outlined{font-size:36px}
  h2{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
    color:var(--muted);margin:0 0 12px}
  .sec{background:var(--card);border:1px solid var(--border);border-radius:14px;
    padding:16px 18px;margin-bottom:14px}
  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  @media(max-width:540px){.field-grid{grid-template-columns:1fr}}
  .field-grid .full{grid-column:1/-1}
  .fg{display:flex;flex-direction:column;gap:4px}
  .fg label{font-size:11.5px;color:var(--muted);font-weight:500}
  .fg input,.fg select{margin:0;font-size:13px;padding:7px 10px}
  .tracks-list{list-style:none;padding:0;margin:0 0 10px}
  .tracks-list li{display:flex;align-items:center;gap:8px;padding:4px 0;
    border-bottom:1px solid var(--border)}
  .tracks-list li:last-child{border-bottom:none}
  .tracks-list .drag-handle{color:var(--muted);cursor:grab;display:flex;align-items:center;gap:4px;padding:0 4px;user-select:none;font-size:18px;flex-shrink:0}
  .tracks-list .drag-handle:active{cursor:grabbing}
  .tracks-list .drag-handle .n{color:var(--accent);font-size:12px;font-variant-numeric:tabular-nums;min-width:20px;font-weight:600}
  .tracks-list li.drag-over{border-top:2px solid var(--accent);padding-top:2px}
  .tracks-list input{flex:1;margin:0;padding:4px 8px;font-size:13px;height:30px}
  .del-btn{all:unset;cursor:pointer;color:var(--muted);display:flex;padding:3px;border-radius:5px}
  .del-btn:hover{color:#e57373;background:rgba(229,115,115,.12)}
  .del-btn .material-symbols-outlined{font-size:15px}
  .add-track-row{display:flex;gap:8px}
  .add-track-row input{flex:1;margin:0;padding:6px 10px;font-size:13px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
  .lchip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 6px 0 12px;
    border-radius:999px;border:1px solid var(--border);background:var(--card);
    font-size:12.5px;font-weight:500}
  .lchip button{all:unset;cursor:pointer;display:flex;color:var(--muted);border-radius:50%}
  .lchip button:hover{color:var(--fg)}
  .lchip .material-symbols-outlined{font-size:15px}
  .lchip.derived{color:var(--muted);opacity:.85}
  .addrow{display:flex;gap:8px}
  .addrow input{flex:1;margin:0}
  .dl{display:flex;flex-wrap:wrap;gap:8px}
  .dl a{margin:0;height:34px;font-size:12.5px}
  .save-row{display:flex;gap:8px;align-items:center;margin-top:12px}
  .publish-row{display:flex;gap:12px;align-items:center;margin-top:12px}
  .publish-status{font-size:12.5px;color:var(--muted);flex:1}
  .save-row button{margin:0}
  @keyframes disk-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  @keyframes check-pop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.25)}100%{transform:scale(1);opacity:1}}
  .save-btn-icon{display:inline-flex;transition:color .25s}
  .primary.saving .save-btn-icon{animation:disk-spin .55s linear infinite}
  .primary.saved .save-btn-icon{animation:check-pop .32s cubic-bezier(.34,1.56,.64,1);color:#4ade80}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--accent);color:#0d0f13;padding:10px 18px;border-radius:10px;
    font-size:13px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:99}
  .toast.show{opacity:1}
  .toast.err{background:#e57373;color:#fff}
  input[type="file"]{display:none}
</style>
</head>
<body>
<header>
  <a class="brand" href="/"><img class="brand-icon" src="/static/favicon.svg" alt="" width="24" height="24"> live2mp3</a>
  <div class="tools">
    <button id="lang" class="icon-btn"><span class="material-symbols-outlined">translate</span><span id="lang-label">FR</span></button>
    <button id="theme" class="icon-btn icon-only"><span class="material-symbols-outlined">dark_mode</span></button>
  </div>
</header>

<main>
  <div class="page-nav">
    <button class="icon-btn" onclick="history.back()"><span class="material-symbols-outlined">arrow_back</span><span id="t-back">Retour</span></button>
  </div>
  <div class="layout">
    <!-- Colonne gauche -->
    <div class="visual">
      <div>
        <div class="cover-wrap" id="cover-wrap">
          <div class="cover-ph" id="cover-ph">
            <span class="material-symbols-outlined">album</span>
            <span id="t-no-cover">Aucune pochette</span>
          </div>
          <div class="upload-hint">
            <span class="material-symbols-outlined">upload</span>
            <span class="txt" id="t-cover-hint">Importer une pochette</span>
          </div>
        </div>
        <input type="file" id="cover-file" accept="image/jpeg,image/png,image/webp">
        <input type="file" id="traycard-file" accept="application/pdf">
      </div>
      <div id="traycard-wrap"></div>
      <div class="dl" id="dl"></div>
    </div>

    <!-- Colonne droite -->
    <div>
      <!-- Infos album -->
      <div class="sec">
        <h2 id="t-meta">Informations</h2>
        <div class="field-grid">
          <div class="fg full"><label id="t-f-title">Titre</label><input id="e-title" type="text"></div>
          <div class="fg"><label id="t-f-artist">Artiste</label><input id="e-artist" type="text"></div>
          <div class="fg"><label id="t-f-date">Date</label><input id="e-date" type="text" placeholder="2026-03-04"></div>
          <div class="fg"><label id="t-f-venue">Lieu</label><input id="e-venue" type="text"></div>
          <div class="fg"><label id="t-f-festival">Festival</label><input id="e-festival" type="text"></div>
          <div class="fg full"><label id="t-f-src-label">Source (texte)</label><input id="e-src-label" type="text" placeholder="Diffusion TF1 du 05/06/2026…"></div>
          <div class="fg full"><label id="t-f-src-url">Source (URL)</label><input id="e-src-url" type="url" placeholder="https://…"></div>
        </div>
        <div class="save-row">
          <button class="primary" id="save-meta"><span class="material-symbols-outlined save-btn-icon">save</span><span id="t-save-meta">Enregistrer</span></button>
        </div>
      </div>

      <!-- Pistes -->
      <div class="sec">
        <h2 id="t-tracks-h">Pistes</h2>
        <ul class="tracks-list" id="tracks-list"></ul>
        <div class="add-track-row">
          <input id="new-track" type="text" placeholder="Nouveau titre…">
          <button class="icon-btn" id="add-track" style="margin:0;height:34px"><span class="material-symbols-outlined">add</span></button>
        </div>
        <div class="save-row">
          <button class="primary" id="save-tracks"><span class="material-symbols-outlined save-btn-icon">save</span><span id="t-save-tracks">Enregistrer les pistes</span></button>
        </div>
      </div>

      <!-- Labels -->
      <div class="sec">
        <h2 id="t-labels">Labels</h2>
        <div class="chips" id="chips"></div>
        <div class="addrow">
          <input id="newlabel" list="suggest" placeholder="Ajouter un label…">
          <datalist id="suggest"></datalist>
          <button class="primary" id="add-label" style="margin:0"><span class="material-symbols-outlined">add</span></button>
        </div>
        <div class="save-row">
          <button class="primary" id="save-labels"><span class="material-symbols-outlined save-btn-icon">save</span><span id="t-save-labels">Enregistrer</span></button>
        </div>
      </div>
      <!-- Publication -->
      <div class="sec">
        <h2 id="t-publish-h">Publication</h2>
        <div class="publish-row">
          <span class="publish-status" id="publish-status"></span>
          <button id="btn-publish"><span class="material-symbols-outlined">visibility</span><span id="t-btn-publish">Publier</span></button>
        </div>
      </div>
    </div>
  </div>
</main>
<div class="toast" id="toast"></div>

<script>
const themeBtn=document.getElementById("theme");
function setTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem("l2m-theme",t);
  themeBtn.querySelector(".material-symbols-outlined").textContent=t==="dark"?"dark_mode":"light_mode";}
setTheme(localStorage.getItem("l2m-theme")||"dark");
themeBtn.onclick=()=>setTheme(document.documentElement.dataset.theme==="dark"?"light":"dark");

const TT={
  fr:{back:"Retour",meta:"Informations",f_title:"Titre",f_artist:"Artiste",f_date:"Date",
      f_venue:"Lieu",f_festival:"Tournée/festival",f_src_label:"Source (texte)",f_src_url:"Source (URL)",
      save_meta:"Enregistrer",save_tracks:"Enregistrer les pistes",save_labels:"Enregistrer",
      saved:"Enregistré",tracks_h:"Pistes",labels:"Labels",cover:"Pochette",traycard:"Tray card",
      no_cover:"Aucune pochette",no_traycard:"Aucune tray card",
      import_traycard:"Importer une tray card (PDF)",replace_traycard:"Remplacer la tray card",
      cover_hint:"Importer une pochette",cover_replace:"Remplacer la pochette",
      new_track:"Nouveau titre…",add_label:"Ajouter un label…",
      del_t:"Supprimer",
      publish_h:"Publication",publish_btn:"Publier",unpublish_btn:"Dépublier",
      status_pub:"Visible dans la vitrine",status_draft:"Masqué au public"},
  en:{back:"Gallery",meta:"Album info",f_title:"Title",f_artist:"Artist",f_date:"Date",
      f_venue:"Venue",f_festival:"Tournée/festival",f_src_label:"Source (text)",f_src_url:"Source (URL)",
      save_meta:"Save",save_tracks:"Save tracks",save_labels:"Save",
      saved:"Saved",tracks_h:"Tracks",labels:"Labels",cover:"Cover",traycard:"Tray card",
      no_cover:"No cover",no_traycard:"No tray card",
      import_traycard:"Import tray card (PDF)",replace_traycard:"Replace tray card",
      cover_hint:"Import cover",cover_replace:"Replace cover",
      new_track:"New title…",add_label:"Add a label…",del_t:"Remove",
      publish_h:"Publication",publish_btn:"Publish",unpublish_btn:"Unpublish",
      status_pub:"Visible in the catalogue",status_draft:"Hidden from public"}
};
function L(){return localStorage.getItem("l2m-lang")||"fr";}
function applyLang(){
  const t=TT[L()];
  if(document.getElementById("t-publish-h")){document.getElementById("t-publish-h").textContent=t.publish_h;}
  refreshPublishBtn();
  document.getElementById("lang-label").textContent=L().toUpperCase();
  document.getElementById("t-back").textContent=t.back;
  document.getElementById("t-meta").textContent=t.meta;
  document.getElementById("t-f-title").textContent=t.f_title;
  document.getElementById("t-f-artist").textContent=t.f_artist;
  document.getElementById("t-f-date").textContent=t.f_date;
  document.getElementById("t-f-venue").textContent=t.f_venue;
  document.getElementById("t-f-festival").textContent=t.f_festival;
  document.getElementById("t-f-src-label").textContent=t.f_src_label;
  document.getElementById("t-f-src-url").textContent=t.f_src_url;
  document.getElementById("t-save-meta").textContent=t.save_meta;
  document.getElementById("t-tracks-h").textContent=t.tracks_h;
  document.getElementById("t-save-tracks").textContent=t.save_tracks;
  document.getElementById("t-save-labels").textContent=t.save_labels;
  document.getElementById("t-labels").textContent=t.labels;
  document.getElementById("t-no-cover").textContent=t.no_cover;
  const chint=document.getElementById("t-cover-hint");
  if(chint) chint.textContent=DATA&&DATA.has_cover?t.cover_replace:t.cover_hint;
  document.getElementById("new-track").placeholder=t.new_track;
  document.getElementById("newlabel").placeholder=t.add_label;
  if(DATA){renderDL();renderTraycard();}
}
document.getElementById("lang").onclick=()=>{
  localStorage.setItem("l2m-lang",L()==="fr"?"en":"fr");applyLang();};

const SLUG=decodeURIComponent(location.pathname.split("/app/album/")[1]||"");
let albumPublished=true;
function refreshPublishBtn(){
  const btn=document.getElementById("btn-publish");
  if(!btn)return;
  const t=TT[L()];
  const ic=btn.querySelector(".material-symbols-outlined");
  const lbl=document.getElementById("t-btn-publish");
  const status=document.getElementById("publish-status");
  if(albumPublished){
    ic.textContent="visibility_off"; lbl.textContent=t.unpublish_btn;
    btn.className=""; status.textContent=t.status_pub;
  } else {
    ic.textContent="visibility"; lbl.textContent=t.publish_btn;
    btn.className="primary"; status.textContent=t.status_draft;
  }
}
let DATA=null,labels=[],tracks=[];

function toast(msg,err=false){
  const el=document.getElementById("toast");el.textContent=msg;
  el.className="toast"+(err?" err":"");el.classList.add("show");
  setTimeout(()=>el.classList.remove("show"),2200);}
const _saveStart={};
function showSaved(btnId){
  // Laisse la disquette tourner au moins 450 ms, même si la sauvegarde est instantanée
  const wait=Math.max(0,450-(Date.now()-(_saveStart[btnId]||0)));
  setTimeout(()=>{
    const btn=document.getElementById(btnId);
    const ic=btn.querySelector(".save-btn-icon");
    btn.classList.remove("saving");
    ic.textContent="done";
    btn.classList.add("saved");
    setTimeout(()=>{btn.classList.remove("saved");ic.textContent="save";},2400);
  },wait);}

function savingStart(btnId){
  _saveStart[btnId]=Date.now();
  document.getElementById(btnId).classList.add("saving");}

function savingError(btnId){
  const btn=document.getElementById(btnId);
  btn.classList.remove("saving");
  btn.querySelector(".save-btn-icon").textContent="save";}

// Cover
document.getElementById("cover-wrap").onclick=()=>document.getElementById("cover-file").click();
function renderCover(){
  const wrap=document.getElementById("cover-wrap"),ph=document.getElementById("cover-ph");
  if(DATA.has_cover){
    ph.style.display="none";
    let img=wrap.querySelector("img");
    if(!img){img=document.createElement("img");img.alt="cover";wrap.insertBefore(img,wrap.querySelector("label"));}
    img.src=`/cover/${SLUG}?t=${Date.now()}`;
  }else{ph.style.display="";const img=wrap.querySelector("img");if(img)img.remove();}
}
document.getElementById("cover-file").addEventListener("change",async e=>{
  const file=e.target.files[0];if(!file) return;
  const fd=new FormData();fd.append("file",file);
  const r=await fetch(`/api/albums/${SLUG}/cover`,{method:"POST",body:fd});
  if(r.ok){DATA.has_cover=true;renderCover();renderDL();toast(TT[L()].cover+" ✓");}
  else toast("Erreur upload ("+r.status+")",true);
  e.target.value="";
});

// Tracks
let dragSrcIdx=null;
function renderTracks(){
  const ul=document.getElementById("tracks-list");
  ul.innerHTML=tracks.map((t,i)=>`<li data-i="${i}">
    <span class="drag-handle" draggable="true" data-i="${i}"><span class="material-symbols-outlined">drag_indicator</span><span class="n">${String(i+1).padStart(2,"0")}</span></span>
    <input type="text" value="${(t.title||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;")}" data-i="${i}">
    <button class="del-btn" data-i="${i}" title="${TT[L()].del_t}"><span class="material-symbols-outlined">delete</span></button>
  </li>`).join("");
  ul.querySelectorAll("input[data-i]").forEach(inp=>{inp.oninput=()=>{tracks[+inp.dataset.i].title=inp.value;};});
  ul.querySelectorAll(".del-btn").forEach(btn=>{btn.onclick=()=>{tracks.splice(+btn.dataset.i,1);renderTracks();};});
  ul.querySelectorAll(".drag-handle").forEach(handle=>{
    const li=handle.closest("li");
    handle.addEventListener("dragstart",e=>{dragSrcIdx=+handle.dataset.i;e.dataTransfer.effectAllowed="move";li.style.opacity="0.4";});
    handle.addEventListener("dragend",()=>{li.style.opacity="";ul.querySelectorAll("li").forEach(l=>l.classList.remove("drag-over"));});
  });
  ul.querySelectorAll("li").forEach(li=>{
    li.addEventListener("dragover",e=>{e.preventDefault();e.dataTransfer.dropEffect="move";
      ul.querySelectorAll("li").forEach(l=>l.classList.remove("drag-over"));
      if(+li.dataset.i!==dragSrcIdx) li.classList.add("drag-over");});
    li.addEventListener("drop",e=>{e.stopPropagation();
      const dst=+li.dataset.i;
      if(dragSrcIdx===null||dragSrcIdx===dst) return;
      const moved=tracks.splice(dragSrcIdx,1)[0];
      tracks.splice(dst,0,moved);
      dragSrcIdx=null;
      renderTracks();});
  });
}
document.getElementById("add-track").onclick=()=>{
  const inp=document.getElementById("new-track"),v=inp.value.trim();if(!v) return;
  const n=(tracks.length?Math.max(...tracks.map(t=>t.n)):0)+1;
  tracks.push({n,title:v,start:null,end:null,locked:false});inp.value="";renderTracks();};
document.getElementById("new-track").addEventListener("keydown",e=>{
  if(e.key==="Enter"){e.preventDefault();document.getElementById("add-track").click();}});
document.getElementById("save-tracks").onclick=async()=>{
  savingStart("save-tracks");
  const r=await fetch(`/api/albums/${SLUG}/tracks`,{method:"PUT",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({tracks:tracks.map(t=>({n:t.n,title:t.title}))})});
  if(r.ok){showSaved("save-tracks");}else{savingError("save-tracks");toast("Erreur ("+r.status+")",true);}};

// Labels
function renderChips(){
  const box=document.getElementById("chips");
  const derived=(DATA.derived_labels||[]).map(l=>
    `<span class="lchip derived" title="auto"><span class="material-symbols-outlined" style="font-size:14px">lock</span>${l}</span>`).join("");
  const edit=labels.map((l,i)=>
    `<span class="lchip">${l}<button data-i="${i}"><span class="material-symbols-outlined">close</span></button></span>`).join("");
  box.innerHTML=derived+edit;
  box.querySelectorAll("button[data-i]").forEach(b=>b.onclick=()=>{labels.splice(+b.dataset.i,1);renderChips();});
}
function addLabel(){
  const inp=document.getElementById("newlabel"),v=inp.value.trim();
  if(v&&!labels.map(x=>x.toLowerCase()).includes(v.toLowerCase())){labels.push(v);renderChips();}inp.value="";}
document.getElementById("add-label").onclick=addLabel;
document.getElementById("newlabel").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();addLabel();}});
document.getElementById("save-labels").onclick=async()=>{
  savingStart("save-labels");
  const r=await fetch(`/api/albums/${SLUG}/labels`,{method:"PUT",
    headers:{"Content-Type":"application/json"},body:JSON.stringify({labels})});
  if(r.ok){const d=await r.json();labels=d.labels;renderChips();showSaved("save-labels");}
  else{savingError("save-labels");toast("Erreur ("+r.status+")",true);}};

// Meta
document.getElementById("save-meta").onclick=async()=>{
  const p={artist:document.getElementById("e-artist").value.trim(),
    title:document.getElementById("e-title").value.trim(),
    date:document.getElementById("e-date").value.trim(),
    venue:document.getElementById("e-venue").value.trim(),
    festival:document.getElementById("e-festival").value.trim(),
    source_url:document.getElementById("e-src-url").value.trim(),
    source_label:document.getElementById("e-src-label").value.trim()};
  if(!p.artist||!p.title){toast("Artiste et titre requis",true);return;}
  savingStart("save-meta");
  const r=await fetch(`/api/albums/${SLUG}/meta`,{method:"PUT",
    headers:{"Content-Type":"application/json"},body:JSON.stringify(p)});
  if(r.ok){showSaved("save-meta");document.title=`live2mp3 — ${p.title}`;}
  else{savingError("save-meta");toast("Erreur ("+r.status+")",true);}};

// Downloads
function renderDL(){
  const t=TT[L()],dl=document.getElementById("dl");let h="";
  if(DATA.has_mp3)h+=`<a class="icon-btn" href="/download/${SLUG}/mp3"><span class="material-symbols-outlined">music_note</span> MP3</a>`;
  if(DATA.has_mp4)h+=`<a class="icon-btn" href="/download/${SLUG}/mp4"><span class="material-symbols-outlined">movie</span> MP4</a>`;
  if(DATA.has_cover)h+=`<a class="icon-btn" href="/download/${SLUG}/cover"><span class="material-symbols-outlined">image</span> ${t.cover}</a>`;
  if(DATA.has_traycard)h+=`<a class="icon-btn" href="/download/${SLUG}/traycard"><span class="material-symbols-outlined">description</span> ${t.traycard}</a>`;
  dl.innerHTML=h;}

// Tray card
function renderTraycard(){
  const wrap=document.getElementById("traycard-wrap"),t=TT[L()];
  if(DATA.has_traycard){
    wrap.innerHTML=`<div class="tray-zone" id="tray-zone">
      <iframe src="/app/traycard/${SLUG}#toolbar=0" title="tray card"></iframe>
      <div class="upload-hint">
        <span class="material-symbols-outlined">upload</span>
        <span class="txt">${t.replace_traycard}</span>
      </div>
    </div>`;
  }else{
    wrap.innerHTML=`<div class="tray-zone empty" id="tray-zone">
      <div class="tray-ph">
        <span class="material-symbols-outlined">article</span>
        <span>${t.no_traycard}</span>
        <span style="font-size:11px;opacity:.7">${t.import_traycard}</span>
      </div>
    </div>`;
  }
  document.getElementById("tray-zone").onclick=()=>document.getElementById("traycard-file").click();
}
document.getElementById("traycard-file").addEventListener("change",async e=>{
  const file=e.target.files[0];if(!file) return;
  const fd=new FormData();fd.append("file",file);
  const r=await fetch(`/api/albums/${SLUG}/traycard`,{method:"POST",body:fd});
  if(r.ok){DATA.has_traycard=true;renderTraycard();renderDL();toast(TT[L()].traycard+" ✓");}
  else toast("Erreur upload ("+r.status+")",true);
  e.target.value="";
});

document.addEventListener("DOMContentLoaded",()=>{
  document.getElementById("btn-publish").onclick=async()=>{
    const newVal=!albumPublished;
    const r=await fetch(`/api/albums/${SLUG}/published`,{
      method:"PATCH",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({published:newVal})
    });
    if(r.ok){albumPublished=newVal;refreshPublishBtn();}
  };
});

async function load(){
  DATA=await(await fetch(`/api/albums/${SLUG}`)).json();
  const a=DATA.album||{};
  document.title=`live2mp3 — ${a.title||SLUG}`;
  document.getElementById("e-title").value=a.title||"";
  document.getElementById("e-artist").value=a.artist||"";
  document.getElementById("e-date").value=a.date||"";
  document.getElementById("e-venue").value=a.venue||"";
  document.getElementById("e-festival").value=a.festival||"";
  document.getElementById("e-src-url").value=DATA.source_url||"";
  document.getElementById("e-src-label").value=DATA.source_label||"";
  labels=(DATA.labels||[]).slice();
  tracks=(DATA.tracks||[]).map(t=>({...t}));
  document.getElementById("suggest").innerHTML=(DATA.all_labels||[]).map(l=>`<option value="${l}">`).join("");
  albumPublished=DATA.published!==false;
  renderCover();renderTraycard();renderChips();renderTracks();renderDL();applyLang();
}
applyLang();load();
</script>
</body>
</html>
