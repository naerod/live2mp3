<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>document.documentElement.dataset.theme=localStorage.getItem("l2m-theme")||"dark";</script>
<title>live2mp3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">
<link rel="stylesheet" href="/static/app.css">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<style>
  .page-nav{display:flex;justify-content:space-between;align-items:center;margin:12px 0 4px}
  .al-layout{display:grid;grid-template-columns:280px 1fr;gap:24px;margin-top:16px;align-items:start}
  @media(max-width:700px){.al-layout{grid-template-columns:1fr}}
  .al-cover{aspect-ratio:1;border-radius:14px;overflow:hidden;background:#0a0a0a;
    border:1px solid var(--border);cursor:zoom-in;position:relative}
  .al-cover img{width:100%;height:100%;object-fit:cover;display:block;
    transition:transform .25s ease}
  .al-cover:hover img{transform:scale(1.03)}
  .al-cover .cover-generic{width:100%;height:100%}
  .al-info{display:flex;flex-direction:column;gap:4px}
  .al-artist{color:var(--accent);font-size:20px;font-weight:700;line-height:1.15}
  .al-title{font-size:24px;font-weight:700;line-height:1.2;color:var(--fg);margin:0 0 2px}
  .al-meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--fg);font-size:13px;margin-top:2px}
  .al-meta-item{display:inline-flex;align-items:center;gap:5px}
  .al-meta-item .material-symbols-outlined{font-size:16px;color:var(--muted)}
  .al-meta-item.muted-placeholder{opacity:.45;font-style:italic}
  .al-poster{margin-top:2px}
  .source-row{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;flex-wrap:wrap}
  .source-row .material-symbols-outlined{font-size:14px;flex-shrink:0}
  .source-link{color:var(--accent);text-decoration:none;word-break:break-all}
  .source-link:hover{text-decoration:underline}
  .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
  .tag{font-size:10.5px;font-weight:500;padding:2px 9px;border-radius:999px;
    background:var(--bg);border:1px solid var(--border);color:var(--muted)}
  /* ── Boutons sociaux style accueil ─────────────────────────────── */
  .al-social{display:flex;gap:6px;align-items:center;margin-top:10px}
  .soc-btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;
    height:32px;margin:0;padding:0 14px;border:1px solid;border-radius:999px;
    font-size:12.5px;font-weight:600;line-height:1;cursor:pointer;
    transition:color .15s,background .15s,border-color .15s}
  .soc-btn.is-like{color:var(--like);border-color:color-mix(in srgb,var(--like) 45%,transparent);
    background:color-mix(in srgb,var(--like) 10%,var(--card))}
  .soc-btn.is-like:hover{background:color-mix(in srgb,var(--like) 20%,var(--card));border-color:var(--like)}
  .soc-btn.is-like.liked{background:var(--like);border-color:var(--like);color:#fff}
  .soc-btn.is-like.liked .material-symbols-outlined{font-variation-settings:'FILL' 1}
  .soc-btn.is-comment{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent);
    background:color-mix(in srgb,var(--accent) 10%,var(--card))}
  .soc-btn.is-comment:hover{background:color-mix(in srgb,var(--accent) 20%,var(--card));border-color:var(--accent)}
  .soc-btn .material-symbols-outlined{font-size:15px;line-height:1}
  .soc-btn[disabled]{opacity:.55;cursor:not-allowed}
  /* ── Téléchargements inline ────────────────────────────────────── */
  .al-dl{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .al-dl-wrap{margin-top:12px}
  .al-dl-title{font-size:11px;text-transform:uppercase;letter-spacing:.05em;
    color:var(--muted);font-weight:700;margin-bottom:6px}
  .al-dl a,.al-dl button{margin:0;height:32px;font-size:12.5px;padding:0 12px}
  .al-dl .lock-inline{display:inline-flex;align-items:center;gap:5px;color:var(--muted);
    font-size:12.5px}
  .al-dl .lock-inline .material-symbols-outlined{font-size:15px}
  /* Dropdown format (PNG/PDF) */
  .dl-split{position:relative;display:inline-flex}
  .dl-split>.icon-btn{border-top-right-radius:0;border-bottom-right-radius:0;border-right:none}
  .dl-split>.dl-toggle{border-top-left-radius:0;border-bottom-left-radius:0;
    padding:0 6px;min-width:0;margin:0;height:32px;font-size:12.5px}
  .dl-split>.dl-toggle .material-symbols-outlined{font-size:14px}
  .dl-menu{position:absolute;top:100%;left:0;margin-top:4px;min-width:160px;z-index:20;
    background:var(--card);border:1px solid var(--border);border-radius:10px;
    box-shadow:0 8px 24px rgba(0,0,0,.3);padding:4px;display:none}
  .dl-menu.open{display:block}
  .dl-menu a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;
    font-size:12.5px;color:var(--fg);text-decoration:none;margin:0}
  .dl-menu a:hover{background:var(--bg)}
  .dl-menu a .material-symbols-outlined{font-size:16px;color:var(--muted)}
  /* ── Sections setlist / commentaires ────────────────────────────── */
  .sec{background:var(--card);border:1px solid var(--border);border-radius:14px;
    padding:16px 18px;margin-top:14px}
  .sec h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;
    color:var(--muted);margin:0 0 10px;font-weight:700}
  .setlist{list-style:none;padding:0;margin:0}
  .setlist li{display:flex;align-items:center;gap:10px;padding:6px 0;
    border-bottom:1px solid var(--border);font-size:13.5px}
  .setlist li:last-child{border-bottom:none}
  .setlist li .n{color:var(--accent);font-variant-numeric:tabular-nums;min-width:22px;font-weight:600}
  .setlist li .tt{flex:1}
  .setlist li a{color:var(--muted);display:flex}
  .setlist li a:hover{color:var(--accent)}
  .not-found{text-align:center;color:var(--muted);margin-top:60px}
  .not-found .material-symbols-outlined{font-size:56px;display:block;margin-bottom:12px}
  /* Compat modal — keep .soc-action for modal only */
  .social-actions{display:flex;gap:8px;align-items:center;margin-top:14px}
  .soc-action{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;
    border-radius:999px;border:1px solid var(--border);background:var(--card);
    font-size:13px;font-weight:600;cursor:pointer;color:var(--fg);
    transition:border-color .15s,background .15s}
  .soc-action:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--card))}
  .soc-action.liked{color:var(--like);border-color:var(--like)}
  .soc-action.liked .material-symbols-outlined{font-variation-settings:'FILL' 1}
  .soc-action[disabled]{opacity:.55;cursor:not-allowed}
  .soc-action .material-symbols-outlined{font-size:17px}
  /* ── Carrousel de pochettes ─────────────────────────────────────── */
  .cr{position:relative}
  .cr-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:2;
    width:32px;height:32px;padding:0;border-radius:50%;display:flex;align-items:center;
    justify-content:center;border:1px solid var(--border);background:var(--card);
    color:var(--fg);cursor:pointer;opacity:0;transition:opacity .15s,border-color .15s}
  .cr:hover .cr-arrow,.cr-arrow:focus-visible{opacity:.95}
  .cr-arrow:hover{border-color:var(--accent)}
  .cr-arrow.prev{left:-12px}
  .cr-arrow.next{right:-12px}
  .cr-arrow .material-symbols-outlined{font-size:18px}
  .cr-count{position:absolute;top:8px;right:8px;z-index:2;font-size:11px;font-weight:600;
    padding:2px 8px;border-radius:999px;background:rgba(6,7,10,.72);color:#fff;
    backdrop-filter:blur(4px);font-variant-numeric:tabular-nums}
  .cr-pin{position:absolute;top:8px;left:8px;z-index:2;display:flex;align-items:center;
    justify-content:center;width:24px;height:24px;border-radius:50%;
    background:rgba(6,7,10,.72);color:var(--accent);backdrop-filter:blur(4px)}
  .cr-pin .material-symbols-outlined{font-size:14px;font-variation-settings:'FILL' 1}
  .cr-dots{display:flex;justify-content:center;gap:5px;margin-top:8px}
  .cr-dot{width:6px;height:6px;border-radius:50%;padding:0;border:none;cursor:pointer;
    background:var(--border);transition:background .15s,transform .15s}
  .cr-dot.on{background:var(--accent);transform:scale(1.25)}
  .cr-dot.tray{background:none;border:1.5px solid var(--border)}
  .cr-dot.tray.on{border-color:var(--accent)}
  .cr-footer{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;font-size:12px}
  .cr-footer .soc-poster{font-size:12px}
  .cr-upload-overlay{position:absolute;bottom:0;left:0;right:0;z-index:3;
    display:flex;align-items:center;justify-content:center;gap:6px;
    padding:8px;background:linear-gradient(transparent,rgba(6,7,10,.75));
    opacity:0;transition:opacity .18s;cursor:pointer;border-radius:0 0 14px 14px}
  .cr:hover .cr-upload-overlay{opacity:1}
  .cr-upload-overlay .material-symbols-outlined{font-size:20px;color:#fff}
  .cr-upload-overlay span:last-child{font-size:12px;color:#fff;font-weight:600}
  .cr-tray-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;
    padding:2px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--border);
    color:var(--muted);cursor:pointer;font-family:inherit;
    transition:border-color .15s,color .15s}
  .cr-tray-badge:hover,.cr-tray-badge.on{border-color:var(--accent);color:var(--accent)}
  .cr-tray-badge .material-symbols-outlined{font-size:13px}
  .al-cover.is-tray{background:var(--bg)}
  .al-cover.is-tray img,.cr-fit{object-fit:contain!important}
  .al-cover.is-tray:hover img{transform:none}
  .cr-tray-embed{width:100%;height:100%;border:0;display:block;background:#fff}

  /* ── Modale pochette ────────────────────────────────────────────── */
  .cm{position:fixed;inset:0;z-index:60;background:rgba(6,7,10,.9);backdrop-filter:blur(6px);
    overflow-y:auto;padding:28px 16px;opacity:0;transition:opacity .18s}
  .cm.hidden{display:none}
  .cm.show{opacity:1}
  .cm-box{max-width:860px;margin:0 auto;background:var(--card);border:1px solid var(--border);
    border-radius:18px;padding:22px;position:relative}
  .cm-close{position:absolute;top:12px;right:12px;z-index:2}
  .cm-top{display:grid;grid-template-columns:260px 1fr;gap:22px;align-items:start}
  @media(max-width:640px){.cm-top{grid-template-columns:1fr}}
  .cm-art{display:flex;flex-direction:column;gap:10px}
  .cm-art img{width:100%;border-radius:12px;border:1px solid var(--border);display:block}
  .cm-art .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;
    color:var(--muted);font-weight:700}
  .cm-tray-embed{width:100%;height:200px;border-radius:12px;border:1px solid var(--border);
    background:var(--bg)}
  .cm-caption{color:var(--fg);font-size:14px;margin:10px 0 0;line-height:1.45}
  .cm-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  .cm-comments{margin-top:22px;border-top:1px solid var(--border);padding-top:6px}
  .cm-nav{display:flex;align-items:center;gap:8px;margin-top:14px}
  .cm-nav .spacer{flex:1}

  /* ── Formulaire d'import ────────────────────────────────────────── */
  .up{position:fixed;inset:0;z-index:70;background:rgba(6,7,10,.9);backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;padding:16px}
  .up.hidden{display:none}
  .up-box{background:var(--card);border:1px solid var(--border);border-radius:16px;
    padding:22px;width:min(440px,100%)}
  .up-box h3{margin:0 0 4px;font-size:17px}
  .up-hint{color:var(--muted);font-size:12.5px;margin:0 0 16px;line-height:1.45}
  .up-field{margin-bottom:14px}
  .up-field label{display:block;font-size:12px;font-weight:600;margin-bottom:5px;color:var(--fg)}
  .up-field input[type=file],.up-field input[type=text]{width:100%;font-size:13px;
    padding:8px 10px;border-radius:9px;border:1px solid var(--border);
    background:var(--bg);color:var(--fg)}
  .up-err{color:#e85d75;font-size:12.5px;margin-bottom:10px;display:none}
  .up-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
</style>
</head>
<body>
<header>
</header>

<main>
  <div class="page-nav">
    <button class="icon-btn" id="back-btn" onclick="goBack()"><span class="material-symbols-outlined">arrow_back</span><span id="t-back">Retour</span></button>
    <a id="gear-btn" class="icon-btn" style="display:none"><span class="material-symbols-outlined">settings</span><span id="t-manage">Gérer</span></a>
  </div>
  <div id="content"><div style="text-align:center;color:var(--muted);margin-top:60px"><span class="material-symbols-outlined" style="font-size:40px;display:block;margin-bottom:8px">sync</span></div></div>
</main>

<!-- Fiche d'une pochette : crédit, likes, tray card liée, fil de commentaires -->
<div id="cm" class="cm hidden">
  <div class="cm-box">
    <button class="icon-btn icon-only cm-close" id="cm-close"><span class="material-symbols-outlined">close</span></button>
    <div id="cm-body"></div>
    <div class="cm-comments" id="cm-comments"></div>
  </div>
</div>

<!-- Import d'une pochette (+ tray card optionnelle) -->
<div id="up" class="up hidden">
  <div class="up-box">
    <h3 id="up-title">Proposer une pochette</h3>
    <p class="up-hint" id="up-hint"></p>
    <div class="up-err" id="up-err"></div>
    <div class="up-field" id="up-cover-field">
      <label id="up-cover-lbl" for="up-cover"></label>
      <input type="file" id="up-cover" accept="image/jpeg,image/png,image/webp">
    </div>
    <div class="up-field" id="up-tray-field">
      <label id="up-tray-lbl" for="up-tray"></label>
      <input type="file" id="up-tray" accept="image/jpeg,image/png,image/webp">
    </div>
    <div class="up-field" id="up-caption-field">
      <label id="up-caption-lbl" for="up-caption"></label>
      <input type="text" id="up-caption" maxlength="300">
    </div>
    <div class="up-btns">
      <button class="icon-btn" id="up-cancel"></button>
      <button class="primary" id="up-send"></button>
    </div>
  </div>
</div>

<script src="/static/social.js"></script>
<script>
const slug=decodeURIComponent((location.pathname.split('/album/')[1]||'').replace(/\/$/,''));

function goBack(){
  try{
    if(history.length>1&&document.referrer&&new URL(document.referrer).hostname===location.hostname)
      {history.back();return;}
  }catch(e){}
  location.href='/';
}

// ── i18n ────────────────────────────────────────────────────────────────
const T={
  fr:{back:"Retour",manage:"Gérer",login:"Connexion",logout:"Déconnexion",
      downloads:"Téléchargements",setlist:"Setlist",comments:"Commentaires",
      full:"Album complet (MP3)",cover:"Pochette",traycard:"Tray card",
      dltrack:"Télécharger cette piste",lockdl:"Connectez-vous pour télécharger",
      not_found:"Album introuvable.",
      date_unknown:"Date inconnue",venue_unknown:"Lieu inconnu",
      festival:"Tournée/festival",
      like:"J'aime",liked:"Aimé",login_to_like:"Connectez-vous pour aimer",
      imported_by:(u,d)=>`Importé par ${u}${d?" le "+d:""}`,profile:"Mon profil",
      cv_by:"Pochette par",cv_prev:"Précédent",cv_next:"Suivant",
      cv_cover:"Pochette",cv_see_tray:"Voir la tray card",cv_see_cover:"Voir la pochette",
      cv_add:"Proposer une pochette",cv_none:"Aucune pochette pour cet album.",
      cv_comments:"Voir les commentaires",
      cv_pinned:"Pochette épinglée",cv_pin:"Épingler",cv_unpin:"Désépingler",
      cv_delete:"Supprimer",cv_del_confirm:"Supprimer cette pochette et sa tray card ?",
      cv_login:"Connectez-vous pour proposer une pochette",
      cv_dl_cover:"Télécharger la pochette",cv_dl_tray:"Télécharger la tray card",
      cv_add_tray:"Ajouter une tray card",cv_replace_tray:"Remplacer la tray card",
      cv_tray:"Tray card",cv_no_tray:"Pas de tray card",
      up_title:"Proposer une pochette",
      dl_png:"Image (PNG)",dl_pdf:"PDF imprimable",
      up_hint:"La tray card est optionnelle et reste liée à cette pochette. JPEG, PNG ou WebP.",
      up_cover:"Pochette (obligatoire)",up_tray:"Tray card (optionnelle)",
      up_caption:"Légende (optionnelle)",up_send:"Envoyer",up_cancel:"Annuler",
      up_need_cover:"Choisissez une image de pochette.",up_failed:"Échec de l'envoi.",
      tray_title:"Tray card",tray_send:"Envoyer la tray card"},
  en:{back:"Back",manage:"Manage",login:"Log in",logout:"Log out",
      downloads:"Downloads",setlist:"Setlist",comments:"Comments",
      full:"Full album (MP3)",cover:"Cover",traycard:"Tray card",
      dltrack:"Download this track",lockdl:"Log in to download",
      not_found:"Album not found.",
      date_unknown:"Unknown date",venue_unknown:"Unknown venue",
      festival:"Tour/festival",
      like:"Like",liked:"Liked",login_to_like:"Log in to like",
      imported_by:(u,d)=>`Imported by ${u}${d?" on "+d:""}`,profile:"My profile",
      cv_by:"Cover by",cv_prev:"Previous",cv_next:"Next",
      cv_cover:"Cover",cv_see_tray:"View tray card",cv_see_cover:"View cover",
      cv_add:"Submit a cover",cv_none:"No cover for this album yet.",
      cv_comments:"View comments",
      cv_pinned:"Pinned cover",cv_pin:"Pin",cv_unpin:"Unpin",
      cv_delete:"Delete",cv_del_confirm:"Delete this cover and its tray card?",
      cv_login:"Log in to submit a cover",
      cv_dl_cover:"Download cover",cv_dl_tray:"Download tray card",
      cv_add_tray:"Add a tray card",cv_replace_tray:"Replace tray card",
      cv_tray:"Tray card",cv_no_tray:"No tray card",
      up_title:"Submit a cover",
      dl_png:"Image (PNG)",dl_pdf:"Printable PDF",
      up_hint:"The tray card is optional and stays tied to this cover. JPEG, PNG or WebP.",
      up_cover:"Cover (required)",up_tray:"Tray card (optional)",
      up_caption:"Caption (optional)",up_send:"Send",up_cancel:"Cancel",
      up_need_cover:"Pick a cover image.",up_failed:"Upload failed.",
      tray_title:"Tray card",tray_send:"Send tray card"}
};
const L=()=>localStorage.getItem('l2m-lang')||'fr';
const t=k=>{const v=(T[L()]||T.fr)[k];return typeof v==='function'?v:v||k;};
function setLang(l){
  localStorage.setItem('l2m-lang',l);
  document.documentElement.lang=l;
  const _ll=document.getElementById('lang-label');if(_ll)_ll.textContent=l.toUpperCase();
  document.getElementById('t-back').textContent=t('back');
  const mg=document.getElementById('t-manage');if(mg)mg.textContent=t('manage');
  if(window.applyI18n)applyI18n(l);
}

// Thème appliqué dans le <head> ; toggles gérés par le header unifié (L2M.initHeader).

// ── Cover générique ──────────────────────────────────────────────────────
const GENERIC_COVER=`<div class="cover-generic">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <circle cx="50" cy="50" r="30" fill="none" stroke="currentColor" stroke-width="4" opacity=".3"/>
    <circle cx="50" cy="50" r="10" fill="currentColor" opacity=".25"/>
    <line x1="50" y1="20" x2="50" y2="80" stroke="currentColor" stroke-width="3" opacity=".15"/>
    <line x1="20" y1="50" x2="80" y2="50" stroke="currentColor" stroke-width="3" opacity=".15"/>
  </svg></div>`;

// ── Main ─────────────────────────────────────────────────────────────────
let ME={authenticated:false,is_gestionnaire:false};
let POSTERS={};

async function loadPage(){
  setLang(L());
  ME=await L2M.initHeader({onLangChange:l=>setLang(l)});

  if(ME.is_gestionnaire){
    const gb=document.getElementById('gear-btn');
    gb.href=`/app/album/${slug}`;
    gb.style.display='';
  }

  let d;
  try{const r=await fetch(`/api/catalogue/${slug}`);if(!r.ok)throw 0;d=await r.json();}
  catch(e){showNotFound();return;}
  if(!d||!d.album){showNotFound();return;}

  document.title=`live2mp3 — ${d.album.title||slug}`;

  // Résoudre le posteur
  if(d.imported_by){
    const ps=await fetch(`/api/social/profiles?u=${encodeURIComponent(d.imported_by)}`).then(r=>r.json()).catch(()=>({}));
    POSTERS=ps;
  }

  await loadCovers(d.has_cover);
  renderAlbum(d);

  if(location.hash==='#comments'){
    setTimeout(()=>document.getElementById('sec-comments')?.scrollIntoView({behavior:'smooth',block:'start'}),350);
  }
}

function posterFor(username){
  if(!username)return '';
  const p=POSTERS[username]||{};
  const prefixFn=T[L()].imported_by;
  const prefix=typeof prefixFn==='function'?prefixFn(p.display_name||username,null):'';
  return L2M.poster({username,display_name:p.display_name||username,avatar:!!p.avatar},prefix||undefined);
}

function dlSplit(icon,label,pngUrl,pdfUrl){
  return `<div class="dl-split">
    <a class="icon-btn" href="${pngUrl}"><span class="material-symbols-outlined">${icon}</span> ${label}</a>
    <button class="icon-btn dl-toggle" onclick="this.nextElementSibling.classList.toggle('open');event.stopPropagation()"><span class="material-symbols-outlined" style="font-size:16px">expand_more</span></button>
    <div class="dl-menu">
      <a href="${pngUrl}"><span class="material-symbols-outlined">image</span> ${t('dl_png')}</a>
      <a href="${pdfUrl}"><span class="material-symbols-outlined">picture_as_pdf</span> ${t('dl_pdf')}</a>
    </div>
  </div>`;
}

function renderAlbum(d){
  const a=d.album||{};
  const tags=(d.labels||[]).map(l=>`<span class="tag">${L2M.esc(l)}</span>`).join('');

  const set=(d.tracks||[]).map(tr=>{
    const dl=(ME.authenticated&&tr.dl)
      ?`<a href="/download/${slug}/track/${tr.n}" title="${t('dltrack')}"><span class="material-symbols-outlined">download</span></a>`:'';
    return `<li><span class="n">${String(tr.n).padStart(2,'0')}</span><span class="tt">${L2M.esc(tr.title)}</span>${dl}</li>`;
  }).join('');

  let dlHtml='';
  if(ME.authenticated){
    let links='';
    if(d.has_mp3)links+=`<a class="primary" href="/download/${slug}/mp3"><span class="material-symbols-outlined">library_music</span> ${t('full')}</a>`;
    if(d.has_mp4)links+=`<a class="icon-btn" href="/download/${slug}/mp4"><span class="material-symbols-outlined">movie</span> MP4</a>`;
    if(d.has_cover)links+=dlSplit('image',t('cover'),`/download/${slug}/cover`,`/download/${slug}/cover/pdf`);
    if(d.has_traycard)links+=dlSplit('description',t('traycard'),`/download/${slug}/traycard`,`/download/${slug}/traycard/pdf`);
    if(links)dlHtml=`<div class="al-dl-wrap"><div class="al-dl-title">${t('downloads')}</div><div class="al-dl">${links}</div></div>`;
  }else{
    dlHtml=`<div class="al-dl-wrap"><div class="al-dl-title">${t('downloads')}</div><div class="al-dl"><span class="lock-inline"><span class="material-symbols-outlined">lock</span>${t('lockdl')}</span><a class="icon-btn" href="/outpost.goauthentik.io/start?rd=/album/${slug}" style="margin:0;height:32px;font-size:12.5px;padding:0 12px"><span class="material-symbols-outlined">login</span> ${t('login')}</a></div></div>`;
  }

  const srcUrl=d.source_url||'';
  const srcLabel=d.source_label||'';
  let sourceHtml='';
  if(srcUrl||srcLabel){
    const srcContent=srcUrl
      ?`<a class="source-link" href="${srcUrl}" target="_blank" rel="noopener">${L2M.esc(srcLabel||srcUrl)}</a>`
      :`<span>${L2M.esc(srcLabel)}</span>`;
    sourceHtml=`<div class="source-row"><span class="material-symbols-outlined">link</span>${srcContent}</div>`;
  }

  const posterHtml=posterFor(d.imported_by);
  const dateStr=a.date||t('date_unknown');
  const venueStr=a.venue||t('venue_unknown');

  document.getElementById('content').innerHTML=`
    <div class="al-layout">
      <div class="al-cover-col" id="cover-col"></div>
      <div class="al-info">
        ${a.artist?`<div class="al-artist">${L2M.esc(a.artist)}</div>`:''}
        <h1 class="al-title">${L2M.esc(a.title||slug)}</h1>
        <div class="al-meta">
          <span class="al-meta-item${a.date?'':' muted-placeholder'}"><span class="material-symbols-outlined">calendar_month</span>${L2M.esc(dateStr)}</span>
          <span class="al-meta-item${a.venue?'':' muted-placeholder'}"><span class="material-symbols-outlined">location_on</span>${L2M.esc(venueStr)}</span>
          ${a.festival?`<span class="al-meta-item"><span class="material-symbols-outlined">festival</span>${L2M.esc(a.festival)}</span>`:''}
        </div>
        ${posterHtml?`<div class="al-poster">${posterHtml}</div>`:''}
        ${sourceHtml}
        ${tags?`<div class="tags">${tags}</div>`:''}
        <div class="al-social">
          <button id="like-btn" class="soc-btn is-like"><span class="material-symbols-outlined">favorite</span><span id="like-count">—</span></button>
          <button id="comment-btn" class="soc-btn is-comment" onclick="scrollToComments()"><span class="material-symbols-outlined">chat_bubble</span><span id="comment-count">—</span></button>
        </div>
        ${dlHtml}
      </div>
    </div>
    <div class="sec">
      <h3>${t('setlist')}</h3>
      <ul class="setlist">${set||'<li style="color:var(--muted)">—</li>'}</ul>
    </div>
    <div class="sec" id="sec-comments"></div>
  `;

  document.addEventListener('click',()=>document.querySelectorAll('.dl-menu.open').forEach(m=>m.classList.remove('open')));
  initSocialActions();
  renderCarousel();
  L2M.comments(document.getElementById('sec-comments'),slug);
}

function scrollToComments(){
  document.getElementById('sec-comments')?.scrollIntoView({behavior:'smooth',block:'start'});
}

async function initSocialActions(){
  const btnLike=document.getElementById('like-btn');
  const btnComment=document.getElementById('comment-btn');
  if(!btnLike||!btnComment)return;

  let s={likes:0,liked:false,comments:0};
  try{s=await fetch(`/api/social/albums/${slug}`).then(r=>r.json());}catch(e){}
  let {likes,liked,comments:commentCount}=s;

  function paintLike(){
    btnLike.className='soc-btn is-like'+(liked?' liked':'');
    btnLike.innerHTML=`<span class="material-symbols-outlined">favorite</span>${likes}`;
    btnLike.title=ME.authenticated?(liked?t('liked'):t('like')):t('login_to_like');
  }
  function paintComment(){
    document.getElementById('comment-count').textContent=commentCount;
  }

  paintLike();
  paintComment();

  btnLike.onclick=async()=>{
    if(!ME.authenticated){location.href=`/outpost.goauthentik.io/start?rd=/album/${encodeURIComponent(slug)}`;return;}
    btnLike.disabled=true;
    try{
      const r=await fetch(`/api/social/albums/${slug}/like`,{method:'POST'}).then(r=>r.json());
      liked=r.liked;likes=r.likes;paintLike();
    }catch(e){}finally{btnLike.disabled=false;}
  };
}

// ── Carrousel de pochettes ───────────────────────────────────────────────
// COVERS arrive déjà classé par le serveur (épinglée > plus likée) : l'index 0
// est la gagnante, donc l'affichage par défaut suit le classement sans calcul.
// Le carrousel ne défile pas COVERS mais SLIDES : chaque pochette y occupe une
// face, suivie de sa tray card quand elle en a une. La tray card reste ainsi
// une colonne de sa cover (jamais une entrée indépendante), et les flèches
// parcourent aussi bien les faces d'une pochette que les pochettes entre elles.
let COVERS=[], SLIDES=[], IDX=0;

function buildSlides(){
  SLIDES=[];
  for(const c of COVERS){
    SLIDES.push({id:c.id,kind:'cover'});
    if(c.has_traycard)SLIDES.push({id:c.id,kind:'traycard'});
  }
}

// Se recaler sur une face précise après un reclassement (like, épinglage) :
// l'index n'a plus de sens, la paire id+face si.
function focusSlide(id,kind){
  const i=SLIDES.findIndex(s=>s.id===id&&s.kind===kind);
  IDX=i<0?SLIDES.findIndex(s=>s.id===id):i;
  if(IDX<0)IDX=0;
}

async function loadCovers(hasCoverFallback){
  try{
    const d=await fetch(`/api/social/albums/${slug}/covers`).then(r=>r.json());
    COVERS=d.covers||[];
  }catch(e){COVERS=[];}
  if(COVERS.length===0&&hasCoverFallback){
    COVERS=[{id:0,cover_url:`/cover/${slug}`,has_traycard:false,
             username:null,display_name:null,avatar:null,pinned:false,liked:false,likes:0}];
  }
  buildSlides();
  if(IDX>=SLIDES.length)IDX=0;
}

const curSlide=()=>SLIDES[IDX]||null;
const coverById=id=>COVERS.find(c=>c.id===id)||null;
const curCover=()=>{const s=curSlide();return s?coverById(s.id):null;};

function footerHtml(c,kind){
  if(!c)return `<div class="cr-footer" style="color:var(--muted);font-size:12px">${t('cv_none')}</div>`;
  if(!c.id)return `<div class="cr-footer"></div>`;
  const poster=L2M.poster(
    {username:c.username,display_name:c.display_name,avatar:c.avatar}, t('cv_by'));
  return `<div class="cr-footer">${poster}</div>`;
}

// La face d'une tray card n'est pas carrée et peut être un PDF : on la loge en
// entier (contain) au lieu de la rogner comme une pochette.
function faceHtml(c,kind){
  if(!c)return GENERIC_COVER;
  if(kind!=='traycard')return `<img src="${c.cover_url}" alt="">`;
  return c.traycard_kind==='pdf'
    ? `<iframe class="cr-tray-embed" src="${c.traycard_url}" title="${t('cv_tray')}"></iframe>`
    : `<img class="cr-fit" src="${c.traycard_url}" alt="${t('cv_tray')}">`;
}

function renderCarousel(){
  const col=document.getElementById('cover-col');
  if(!col)return;
  const s=curSlide(), c=curCover(), multi=SLIDES.length>1;
  const kind=s?s.kind:'cover';

  const uploadOverlay=ME.authenticated
    ?`<div class="cr-upload-overlay" id="cr-add" title="${t('cv_add')}"><span class="material-symbols-outlined">add_photo_alternate</span><span>${t('cv_add')}</span></div>`
    :'';

  col.innerHTML=`
    <div class="cr">
      <div class="al-cover${kind==='traycard'?' is-tray':''}" id="cr-art">${faceHtml(c,kind)}</div>
      ${c&&c.pinned&&kind==='cover'?`<span class="cr-pin" title="${t('cv_pinned')}"><span class="material-symbols-outlined">push_pin</span></span>`:''}
      ${multi?`<span class="cr-count">${IDX+1}/${SLIDES.length}</span>
        <button class="cr-arrow prev" id="cr-prev" title="${t('cv_prev')}"><span class="material-symbols-outlined">chevron_left</span></button>
        <button class="cr-arrow next" id="cr-next" title="${t('cv_next')}"><span class="material-symbols-outlined">chevron_right</span></button>`:''}
      ${uploadOverlay}
    </div>
    ${multi?`<div class="cr-dots">${SLIDES.map((sl,i)=>
      `<button class="cr-dot${sl.kind==='traycard'?' tray':''}${i===IDX?' on':''}" data-i="${i}"
        title="${sl.kind==='traycard'?t('cv_tray'):t('cv_cover')}"></button>`).join('')}</div>`:''}
    ${footerHtml(c,kind)}
  `;

  if(c&&c.id&&!(kind==='traycard'&&c.traycard_kind==='pdf'))
    document.getElementById('cr-art').onclick=()=>openCoverModal(c.id);
  const prev=document.getElementById('cr-prev'), next=document.getElementById('cr-next');
  if(prev)prev.onclick=()=>go(-1);
  if(next)next.onclick=()=>go(1);
  col.querySelectorAll('.cr-dot').forEach(d=>d.onclick=()=>{IDX=+d.dataset.i;renderCarousel();});
  const add=document.getElementById('cr-add');
  if(add&&ME.authenticated)add.onclick=e=>{e.stopPropagation();openUpload();};
}

function go(step){
  if(!SLIDES.length)return;
  IDX=(IDX+step+SLIDES.length)%SLIDES.length;   // circulaire
  renderCarousel();
}

async function toggleCoverLike(id){
  if(!ME.authenticated){location.href=L2M.loginUrl();return;}
  // Un like peut faire changer la gagnante : le serveur renvoie la liste
  // reclassée, on se recale donc sur la face regardée, pas sur l'index.
  const kind=curSlide()?.kind||'cover';
  try{
    const d=await fetch(`/api/social/covers/${id}/like`,{method:'POST'}).then(r=>r.json());
    COVERS=d.covers||[];
    buildSlides();
    focusSlide(id,kind);
    renderCarousel();
    if(!document.getElementById('cm').classList.contains('hidden'))paintModal(id);
  }catch(e){}
}

// ── Modale d'une pochette ────────────────────────────────────────────────
const cm=document.getElementById('cm');
document.getElementById('cm-close').onclick=closeModal;
cm.onclick=e=>{if(e.target===cm)closeModal();};

function closeModal(){
  cm.classList.remove('show');
  setTimeout(()=>cm.classList.add('hidden'),180);
}

function openCoverModal(id){
  paintModal(id);
  cm.classList.remove('hidden');
  requestAnimationFrame(()=>cm.classList.add('show'));
  L2M.comments(document.getElementById('cm-comments'),slug,{coverId:id});
}

function paintModal(id){
  const c=COVERS.find(x=>x.id===id);
  if(!c)return;
  const mine=ME.authenticated&&(c.username===ME.username||ME.is_gestionnaire);
  const tray=c.has_traycard
    ?`<div class="lbl">${t('cv_tray')}</div>${
        c.traycard_kind==='pdf'
          ?`<iframe class="cm-tray-embed" src="${c.traycard_url}" title="${t('cv_tray')}"></iframe>`
          :`<img src="${c.traycard_url}" alt="${t('cv_tray')}">`}`
    :`<div class="lbl" style="opacity:.5">${t('cv_no_tray')}</div>`;

  document.getElementById('cm-body').innerHTML=`
    <div class="cm-top">
      <div class="cm-art">
        <img src="${c.cover_url}" alt="">
        ${tray}
      </div>
      <div>
        <div class="cr-credit" style="margin-top:0">${L2M.poster(
          {username:c.username,display_name:c.display_name,avatar:c.avatar},t('cv_by'))}
          ${c.pinned?`<span class="cr-tray-badge"><span class="material-symbols-outlined">push_pin</span>${t('cv_pinned')}</span>`:''}
        </div>
        ${c.caption?`<p class="cm-caption">${L2M.esc(c.caption)}</p>`:''}
        <div class="social-actions" style="margin-top:12px">
          <button class="soc-action${c.liked?' liked':''}" id="cm-like"
            title="${ME.authenticated?t('like'):t('login_to_like')}">
            <span class="material-symbols-outlined">favorite</span>${c.likes}</button>
          <button class="soc-action" id="cm-comment" title="${t('cv_comments')}">
            <span class="material-symbols-outlined">comment</span>${c.comments}</button>
        </div>
        <div class="cm-actions">
          ${ME.authenticated?dlSplit('image',t('cv_dl_cover'),`/download/cover/${c.id}`,`/download/cover/${c.id}/pdf`):''}
          ${ME.authenticated&&c.has_traycard?dlSplit('description',t('cv_dl_tray'),`/download/traycard/${c.id}`,`/download/traycard/${c.id}/pdf`):''}
          ${mine?`<button class="icon-btn" id="cm-tray">
            <span class="material-symbols-outlined">note_add</span>
            ${c.has_traycard?t('cv_replace_tray'):t('cv_add_tray')}</button>`:''}
          ${ME.is_gestionnaire?`<button class="icon-btn" id="cm-pin">
            <span class="material-symbols-outlined">push_pin</span>
            ${c.pinned?t('cv_unpin'):t('cv_pin')}</button>`:''}
          ${mine?`<button class="icon-btn" id="cm-del">
            <span class="material-symbols-outlined">delete</span> ${t('cv_delete')}</button>`:''}
        </div>
      </div>
    </div>`;

  document.getElementById('cm-like').onclick=()=>toggleCoverLike(c.id);
  // Dans la modale les commentaires sont déjà rendus plus bas : on y amène.
  document.getElementById('cm-comment').onclick=()=>
    document.getElementById('cm-comments')?.scrollIntoView({behavior:'smooth',block:'start'});
  const pin=document.getElementById('cm-pin');
  if(pin)pin.onclick=async()=>{
    const kind=curSlide()?.kind||'cover';
    const d=await fetch(`/api/social/covers/${c.id}/pin`,{method:'POST'}).then(r=>r.json());
    COVERS=d.covers||[];
    buildSlides();
    focusSlide(c.id,kind);
    renderCarousel();paintModal(c.id);
  };
  const del=document.getElementById('cm-del');
  if(del)del.onclick=async()=>{
    if(!confirm(t('cv_del_confirm')))return;
    const d=await fetch(`/api/social/covers/${c.id}`,{method:'DELETE'}).then(r=>r.json());
    // La cover et sa tray card disparaissent ensemble : aucune face à retrouver.
    COVERS=d.covers||[];buildSlides();IDX=0;
    closeModal();renderCarousel();
  };
  const trayBtn=document.getElementById('cm-tray');
  if(trayBtn)trayBtn.onclick=()=>openUpload(c.id);
}

// ── Import d'une pochette / d'une tray card ──────────────────────────────
const up=document.getElementById('up');
let UP_TARGET=null;   // null = nouvelle pochette ; id = tray card d'une pochette

function openUpload(coverId){
  UP_TARGET=coverId||null;
  const tray=UP_TARGET!==null;
  document.getElementById('up-title').textContent=tray?t('tray_title'):t('up_title');
  document.getElementById('up-hint').textContent=tray?'':t('up_hint');
  document.getElementById('up-cover-lbl').textContent=t('up_cover');
  document.getElementById('up-tray-lbl').textContent=t('up_tray');
  document.getElementById('up-caption-lbl').textContent=t('up_caption');
  document.getElementById('up-send').textContent=tray?t('tray_send'):t('up_send');
  document.getElementById('up-cancel').textContent=t('up_cancel');
  // En mode tray card seule, la pochette est déjà choisie : on ne redemande
  // ni image ni légende, seulement le fichier à rattacher.
  document.getElementById('up-cover-field').style.display=tray?'none':'';
  document.getElementById('up-caption-field').style.display=tray?'none':'';
  document.getElementById('up-tray-lbl').textContent=tray?t('cv_tray'):t('up_tray');
  document.getElementById('up-err').style.display='none';
  document.getElementById('up-cover').value='';
  document.getElementById('up-tray').value='';
  document.getElementById('up-caption').value='';
  up.classList.remove('hidden');
}
function closeUpload(){up.classList.add('hidden');}
document.getElementById('up-cancel').onclick=closeUpload;
up.onclick=e=>{if(e.target===up)closeUpload();};

document.getElementById('up-send').onclick=async()=>{
  const err=document.getElementById('up-err');
  const btn=document.getElementById('up-send');
  const coverF=document.getElementById('up-cover').files[0];
  const trayF=document.getElementById('up-tray').files[0];
  err.style.display='none';

  if(UP_TARGET===null&&!coverF){
    err.textContent=t('up_need_cover');err.style.display='';return;
  }
  if(UP_TARGET!==null&&!trayF){
    err.textContent=t('up_need_cover');err.style.display='';return;
  }
  btn.disabled=true;
  try{
    const fd=new FormData();
    let r;
    if(UP_TARGET!==null){
      fd.append('traycard',trayF);
      r=await fetch(`/api/social/covers/${UP_TARGET}/traycard`,{method:'PUT',body:fd});
    }else{
      fd.append('cover',coverF);
      if(trayF)fd.append('traycard',trayF);
      fd.append('caption',document.getElementById('up-caption').value||'');
      r=await fetch(`/api/social/albums/${slug}/covers`,{method:'POST',body:fd});
    }
    if(!r.ok){
      const d=await r.json().catch(()=>({}));
      err.textContent=d.detail||t('up_failed');err.style.display='';return;
    }
    const d=await r.json();
    COVERS=d.covers||[];
    buildSlides();
    // UP_TARGET renseigné = on vient d'ajouter/remplacer une tray card : on
    // montre la face qu'on vient de produire, pas la pochette qui la porte.
    const focus=UP_TARGET!==null?UP_TARGET:d.cover_id;
    focusSlide(focus,UP_TARGET!==null?'traycard':'cover');
    closeUpload();
    renderCarousel();
    if(!cm.classList.contains('hidden'))paintModal(focus);
  }catch(e){
    err.textContent=t('up_failed');err.style.display='';
  }finally{btn.disabled=false;}
};

// Flèches clavier : navigation dans le carrousel, hors saisie de texte.
document.addEventListener('keydown',e=>{
  if(!cm.classList.contains('hidden')||!up.classList.contains('hidden'))return;
  if(/^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName||''))return;
  if(e.key==='ArrowLeft')go(-1);
  if(e.key==='ArrowRight')go(1);
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if(!up.classList.contains('hidden')){closeUpload();return;}
  if(!cm.classList.contains('hidden'))closeModal();
});

function showNotFound(){
  document.getElementById('content').innerHTML=
    `<div class="not-found"><span class="material-symbols-outlined">album</span>${t('not_found')}</div>`;
}

loadPage();
</script>
