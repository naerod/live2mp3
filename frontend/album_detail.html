<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>document.documentElement.dataset.theme=localStorage.getItem("l2m-theme")||"dark";</script>
<title>live2mp3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">
<link rel="stylesheet" href="/static/shared/naerod-social.css">
<link rel="stylesheet" href="/static/app.css">
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<style>
  .page-nav{display:flex;justify-content:space-between;align-items:center;margin:12px 0 4px}
  @keyframes l2m-fadein{from{opacity:0}to{opacity:1}}
  main{animation:l2m-fadein .25s ease}
  .al-layout{display:grid;grid-template-columns:280px 1fr;gap:24px;margin-top:16px;align-items:start}
  @media(max-width:700px){.al-layout{grid-template-columns:1fr}}
  .al-cover{aspect-ratio:1;border-radius:14px;overflow:hidden;background:#0a0a0a;
    border:1px solid var(--border);cursor:zoom-in;position:relative}
  .al-cover img{width:100%;height:100%;object-fit:cover;display:block;
    transition:transform .25s ease}
  .al-cover:hover img{transform:scale(1.03)}
  .al-cover .cover-generic{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#0a0a0a}
  .al-cover .cover-generic svg{width:65%;height:65%;opacity:.6}
  .al-info{display:flex;flex-direction:column;gap:4px}
  .al-artist{color:var(--accent);font-size:20px;font-weight:700;line-height:1.15}
  .al-title{font-size:24px;font-weight:700;line-height:1.2;color:var(--fg);margin:0 0 2px}
  .unpub-chip{display:inline-flex;align-items:center;gap:4px;vertical-align:3px;
    font-size:12px;font-weight:600;color:#e0736f;border:1.5px dashed #e0736f;
    border-radius:999px;padding:2px 10px;margin-left:8px}
  .unpub-chip .material-symbols-outlined{font-size:14px}
  /* Badge de statut unique et prioritaire (gestionnaire) — pastille pleine,
     couleur = sévérité décroissante, cohérent avec la liste. */
  .status-chip{display:inline-flex;align-items:center;gap:4px;vertical-align:3px;
    font-size:11.5px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;
    color:#fff;border-radius:999px;padding:3px 11px;margin-left:8px}
  .status-chip .material-symbols-outlined{font-size:14px}
  .status-chip.st-draft{background:#c93c3c}
  .status-chip.st-unpublished{background:#c78a1e}
  .status-chip.st-published_audio{background:#2f8a5f}
  .status-chip.st-published_av{background:#2e8496}
  .al-meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--fg);font-size:13px;margin-top:2px}
  .al-meta-item{display:inline-flex;align-items:center;gap:5px}
  .al-meta-item .material-symbols-outlined{font-size:16px;color:var(--muted)}
  .al-meta-item.muted-placeholder{opacity:.45;font-style:italic}
  .al-poster{margin-top:2px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .al-import-manner{color:var(--muted);font-size:12px}
  /* Crédit « Pochette automatique » — même emplacement/allure que « Pochette par X ». */
  .cr-auto{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
  .cr-auto .material-symbols-outlined{font-size:18px;color:var(--accent)}
  .source-row{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;flex-wrap:wrap}
  .source-row .material-symbols-outlined{font-size:14px;flex-shrink:0}
  .source-link{color:var(--accent);text-decoration:none;word-break:break-all}
  .source-link:hover{text-decoration:underline}
  .tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
  .tag{font-size:10.5px;font-weight:500;padding:2px 9px;border-radius:999px;
    background:var(--bg);border:1px solid var(--border);color:var(--muted)}
  /* ── Boutons sociaux style accueil ─────────────────────────────── */
  .al-social{display:flex;gap:6px;align-items:center;margin-top:10px}
  .soc-btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;
    height:32px;margin:0;padding:0 14px;border:1px solid;border-radius:999px;
    font-size:12.5px;font-weight:600;line-height:1;cursor:pointer;
    transition:color .15s,background .15s,border-color .15s}
  .soc-btn.is-like{color:var(--like);border-color:color-mix(in srgb,var(--like) 45%,transparent);
    background:color-mix(in srgb,var(--like) 10%,var(--card))}
  .soc-btn.is-like:hover{background:color-mix(in srgb,var(--like) 20%,var(--card));border-color:var(--like)}
  .soc-btn.is-like.liked{background:var(--like);border-color:var(--like);color:#fff}
  .soc-btn.is-like.liked .material-symbols-outlined{font-variation-settings:'FILL' 1}
  .soc-btn.is-comment{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent);
    background:color-mix(in srgb,var(--accent) 10%,var(--card))}
  .soc-btn.is-comment:hover{background:color-mix(in srgb,var(--accent) 20%,var(--card));border-color:var(--accent)}
  .soc-btn .material-symbols-outlined{font-size:15px;line-height:1}
  .soc-btn[disabled]{opacity:.55;cursor:not-allowed}
  /* ── Téléchargements inline ────────────────────────────────────── */
  .al-dl{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .al-dl-wrap{margin-top:12px}
  .al-dl-title{font-size:11px;text-transform:uppercase;letter-spacing:.05em;
    color:var(--muted);font-weight:700;margin-bottom:6px}
  .al-dl a,.al-dl button{margin:0;height:32px;font-size:12.5px;padding:0 12px}
  .al-dl .lock-inline{display:inline-flex;align-items:center;gap:5px;color:var(--muted);
    font-size:12.5px}
  .al-dl .lock-inline .material-symbols-outlined{font-size:15px}
  /* Dropdown format (PNG/PDF) */
  .dl-split{position:relative;display:inline-flex}
  .dl-split>.icon-btn{border-top-right-radius:0;border-bottom-right-radius:0;border-right:none}
  .dl-split>.dl-toggle{border-top-left-radius:0;border-bottom-left-radius:0;border-top-right-radius:10px;border-bottom-right-radius:10px;
    padding:0 6px;min-width:0;margin:0;height:32px;font-size:12.5px}
  .dl-split>.dl-toggle .material-symbols-outlined{font-size:14px}
  .dl-menu{position:absolute;top:100%;left:0;margin-top:4px;min-width:160px;z-index:20;
    background:var(--card);border:1px solid var(--border);border-radius:10px;
    box-shadow:0 8px 24px rgba(0,0,0,.3);padding:4px;display:none}
  .dl-menu.open{display:block}
  .dl-menu a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:7px;
    font-size:12.5px;color:var(--fg);text-decoration:none;margin:0}
  .dl-menu a:hover{background:var(--bg)}
  .dl-menu a .material-symbols-outlined{font-size:16px;color:var(--muted)}
  /* ── Sections setlist / commentaires ────────────────────────────── */
  .sec{background:var(--card);border:1px solid var(--border);border-radius:14px;
    padding:16px 18px;margin-top:14px}
  .sec h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;
    color:var(--muted);margin:0 0 10px;font-weight:700}
  .setlist{list-style:none;padding:0;margin:0}
  .setlist li{display:flex;align-items:center;gap:10px;padding:6px 0;
    border-bottom:1px solid var(--border);font-size:13.5px}
  .setlist li:last-child{border-bottom:none}
  .setlist li .n{color:var(--accent);font-variant-numeric:tabular-nums;min-width:22px;font-weight:600}
  .setlist li .tt{flex:1}
  .setlist li a{color:var(--muted);display:flex}
  .setlist li a:hover{color:var(--accent)}
  .not-found{text-align:center;color:var(--muted);margin-top:60px}
  .not-found .material-symbols-outlined{font-size:56px;display:block;margin-bottom:12px}
  /* Compat modal — keep .soc-action for modal only */
  .social-actions{display:flex;gap:8px;align-items:center;margin-top:14px}
  .soc-action{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;
    border-radius:999px;border:1px solid var(--border);background:var(--card);
    font-size:13px;font-weight:600;cursor:pointer;color:var(--fg);
    transition:border-color .15s,background .15s}
  .soc-action:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--card))}
  .soc-action.liked{color:var(--like);border-color:var(--like)}
  .soc-action.liked .material-symbols-outlined{font-variation-settings:'FILL' 1}
  .soc-action[disabled]{opacity:.55;cursor:not-allowed}
  .soc-action .material-symbols-outlined{font-size:17px}
  /* ── Carrousel de pochettes ─────────────────────────────────────── */
  .cr{position:relative}
  .cr-arrow{position:absolute;top:50%;transform:translateY(-50%);z-index:2;
    width:32px;height:32px;padding:0;border-radius:50%;display:flex;align-items:center;
    justify-content:center;border:1px solid var(--border);background:var(--card);
    color:var(--fg);cursor:pointer;opacity:0;transition:opacity .15s,border-color .15s}
  .cr:hover .cr-arrow,.cr-arrow:focus-visible{opacity:.95}
  .cr-arrow:hover{border-color:var(--accent)}
  .cr-arrow.prev{left:-12px}
  .cr-arrow.next{right:-12px}
  .cr-arrow .material-symbols-outlined{font-size:18px}
  .cr-count{position:absolute;top:8px;right:8px;z-index:2;font-size:11px;font-weight:600;
    padding:2px 8px;border-radius:999px;background:rgba(6,7,10,.72);color:#fff;
    backdrop-filter:blur(4px);font-variant-numeric:tabular-nums}
  .cr-pin{position:absolute;top:8px;left:8px;z-index:2;display:flex;align-items:center;
    justify-content:center;width:24px;height:24px;border-radius:50%;
    background:rgba(6,7,10,.72);color:var(--accent);backdrop-filter:blur(4px)}
  .cr-pin .material-symbols-outlined{font-size:14px;font-variation-settings:'FILL' 1}
  .cr-dots{display:flex;justify-content:center;gap:5px;margin-top:8px}
  .cr-dot{width:6px;height:6px;border-radius:50%;padding:0;border:none;cursor:pointer;
    background:var(--border);transition:background .15s,transform .15s}
  .cr-dot.on{background:var(--accent);transform:scale(1.25)}
  .cr-dot.tray{background:none;border:1.5px solid var(--border)}
  .cr-dot.tray.on{border-color:var(--accent)}
  .cr-footer{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap;font-size:12px}
  .cr-footer .soc-poster{font-size:12px}
  .cr-footer .soc-poster-pre{margin-right:0}
  .cr-upload-overlay{position:absolute;bottom:0;left:0;right:0;z-index:3;
    display:flex;align-items:center;justify-content:center;gap:6px;
    padding:8px;background:linear-gradient(transparent,rgba(6,7,10,.75));
    opacity:0;transition:opacity .18s;cursor:pointer;border-radius:0 0 14px 14px}
  .cr:hover .cr-upload-overlay{opacity:1}
  .cr-upload-overlay .material-symbols-outlined{font-size:20px;color:#fff}
  .cr-upload-overlay span:last-child{font-size:12px;color:#fff;font-weight:600}
  /* ── Vidéo du concert + pop-up visuels Jellyfin ── */
  .sec-video h3{display:flex;align-items:center;gap:6px}
  .vid-thumb{aspect-ratio:16/9;border-radius:12px;background:#000 center/cover no-repeat;
    position:relative;cursor:pointer;overflow:hidden;border:1px solid var(--border);max-width:640px}
  .vid-thumb .vid-play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,.25);transition:background .15s}
  .vid-thumb:hover .vid-play{background:rgba(0,0,0,.45)}
  .vid-thumb .vid-play .material-symbols-outlined{font-size:64px;color:#fff;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
  .vid-sub{color:var(--muted);font-size:12.5px;margin:8px 0 0}
  .cm-box.vm-box{max-width:980px;width:96%;--vm-band:150px}
  .vm-title{display:flex;align-items:center;gap:8px;margin:0 0 16px;padding-right:40px}
  /* Lecteur : gros mais borné, jamais plein écran. */
  .vm-player{max-width:720px;margin:0 auto;border-radius:12px;overflow:hidden;
    background:#000;border:1px solid var(--border)}
  .vm-player video{display:block;width:100%;aspect-ratio:16/9;background:#000}
  .vm-player-err{display:flex;text-decoration:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;
    aspect-ratio:16/9;color:var(--muted);font-size:13px;text-align:center;padding:16px}
  .vm-dl-row{display:flex;justify-content:flex-end;margin:14px auto 22px;max-width:720px}
  .vm-dl-mp4{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:10px;
    background:var(--accent);color:#fff;font-weight:600;text-decoration:none}
  .vm-sec-h{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;
    margin:0 0 4px;padding-top:16px;border-top:1px solid var(--border)}
  /* Action secondaire de la section, alignée à droite du titre (l'espace y
     était vide). Reset margin/padding : app.css touche tous les `button`. */
  .vm-dl-all{margin:0 0 0 auto;padding:8px 14px;border-radius:10px;font:inherit;font-size:13px;
    font-weight:600;display:inline-flex;align-items:center;gap:6px;text-decoration:none;
    border:1px solid var(--border);background:var(--bg);color:var(--fg)}
  .vm-dl-all:hover{border-color:var(--accent);color:var(--accent)}
  .vm-dl-all .material-symbols-outlined{font-size:18px}
  .vm-sec-h .material-symbols-outlined{font-size:18px}
  .vm-sec-sub{color:var(--muted);font-size:12px;margin:0 0 14px;max-width:70ch}
  .vm-slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
  /* Carte en colonne : la barre d'actions est poussée en bas (margin-top:auto),
     donc toutes les cartes ont leurs boutons sur la même ligne quelle que soit
     la forme du visuel. */
  /* La carte n'est plus qu'un aperçu cliquable : toutes les actions (télécharger,
     importer, épingler, supprimer) sont dans la fiche du visuel. `button` pour
     avoir le clavier et le focus sans les réimplémenter — d'où le reset
     margin/padding/font (app.css style tous les `button`). */
  .vm-slot{display:flex;flex-direction:column;width:100%;margin:0;padding:12px;
    font:inherit;text-align:left;cursor:pointer;
    border:1px solid var(--border);border-radius:12px;background:var(--card);
    transition:border-color .15s,background .15s}
  .vm-slot:hover{border-color:var(--accent)}
  .vm-slot-head{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-size:13px;min-height:22px}
  .vm-ratio{font-family:"Google Sans Code",monospace;font-size:11px;color:var(--muted)}
  .vm-auto{display:inline-flex;align-items:center;gap:3px;color:var(--muted);font-size:11px}
  .vm-auto .material-symbols-outlined{font-size:13px}
  .vm-count{margin-left:auto;color:var(--muted);font-size:11px}
  /* Bande de hauteur FIXE (cartes de hauteur égale) dans laquelle la scène
     prend EXACTEMENT le ratio du visuel : pas de bandes noires autour d'une
     pochette 1:1 ou d'une miniature 16:9, et la bannière reste une bannière. */
  .vm-stage-wrap{height:var(--vm-band);display:flex;align-items:center;justify-content:center}
  /* La largeur est bornée par `min(100%, bande × ratio)` (posée en ligne) :
     `aspect-ratio` seul ne sait pas se contraindre sur les DEUX axes — avec
     `width:100%` il débordait en hauteur, avec `height:100%` en largeur. */
  .vm-stage{position:relative;
    border-radius:8px;overflow:hidden;background:var(--bg);border:1px dashed var(--border);
    display:flex;align-items:center;justify-content:center}
  .vm-stage.filled{border-style:solid;border-color:var(--border)}
  .vm-stage img{width:100%;height:100%;object-fit:cover;display:block}
  .vm-slot-ph{position:absolute;inset:0;margin:0;padding:0 8px;border:0;background:transparent;
    color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;
    font:inherit;font-size:11px;text-align:center}
  .vm-slot:hover .vm-slot-ph{color:var(--accent)}
  .vm-slot-ph .material-symbols-outlined{font-size:24px}
  /* Fiche d'un visuel : aperçu en grand + toutes ses actions. */
  .vs{z-index:70}
  .cm-box.vs-box{max-width:620px;width:94%}
  .vs-frame{position:relative;margin:0 auto;border-radius:12px;overflow:hidden;
    border:1px solid var(--border);background:var(--bg);
    display:flex;align-items:center;justify-content:center}
  .vs-frame.empty{border-style:dashed}
  .vs-frame img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
  .vs-actions{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:18px}
  /* L'action destructive n'est jamais collée à l'action principale (règle DA). */
  .vs-right{margin-left:auto;display:flex;align-items:center;gap:8px}
  .vs-note{color:var(--muted);font-size:12px;margin:12px 0 0;max-width:70ch}
  /* app.css donne margin-top:16px et padding:11px 16px à `button` : sans ce
     reset, les <button> de la barre se posaient 8 px plus bas que le <a>. */
  /* app.css donne margin-top:16px à tout `button` : reset systématique. */
  .vm-act{display:inline-flex;align-items:center;justify-content:center;gap:6px;
    height:38px;margin:0;padding:0 14px;box-sizing:border-box;border-radius:10px;
    border:1px solid var(--border);background:var(--bg);color:var(--fg);
    font:inherit;font-size:13px;cursor:pointer;text-decoration:none}
  .vm-act:hover{border-color:var(--accent);color:var(--accent)}
  .vm-act.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .vm-act.danger:hover{border-color:var(--like);color:var(--like)}
  .vm-act .material-symbols-outlined{font-size:18px}
  .vm-act.danger{color:var(--like)}
  .vm-hint{margin-left:auto;color:var(--muted);font-size:11px}
  @media(max-width:640px){
    .vm-slots{grid-template-columns:1fr}
    .vm-dl-row{justify-content:stretch}
    .vm-dl-mp4{flex:1;justify-content:center}
  }
  .cr-tray-badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;
    padding:2px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--border);
    color:var(--muted);cursor:pointer;font-family:inherit;
    transition:border-color .15s,color .15s}
  .cr-tray-badge:hover,.cr-tray-badge.on{border-color:var(--accent);color:var(--accent)}
  .cr-tray-badge .material-symbols-outlined{font-size:13px}
  .al-cover.is-tray{background:var(--bg)}
  .setlist li.has-tc{display:flex;align-items:center;gap:10px;padding:6px 0}
  .setlist li.has-tc .n{margin-left:6px}
  .tc-slot-wrap{position:relative;width:44px;height:44px;border-radius:6px;flex-shrink:0}
  /* Track cover viewer modal */
  /* Navigation prev/next album */
  .album-nav-btn{position:fixed;top:50%;transform:translateY(-50%);z-index:900;
    width:48px;height:48px;border-radius:50%;background:var(--card);border:1px solid var(--border);
    display:none;align-items:center;justify-content:center;cursor:pointer;
    transition:background .15s,opacity .15s;box-shadow:0 4px 16px rgba(0,0,0,.3)}
  .album-nav-btn.visible{display:flex}
  .album-nav-btn.disabled{opacity:.3;cursor:default;pointer-events:none}
  .album-nav-btn:hover:not(.disabled){background:var(--border)}
  .album-nav-btn.prev{left:14px}
  .album-nav-btn.next{right:14px}
  .album-nav-btn .material-symbols-outlined{font-size:28px}
  @media(max-width:860px){.album-nav-btn{display:none!important}}
  .tcv2-overlay{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:1000;display:none;align-items:center;justify-content:center}
  .tcv2-overlay.open{display:flex}
  /* Footer version */
  .site-foot{margin:40px 0 18px;text-align:center;color:var(--muted);font-size:12px}
  .site-foot .badge{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;
    border:1px solid var(--border);border-radius:999px;background:var(--card)}
  .site-foot .env-preprod{color:var(--run,#f59e0b);border-color:var(--run,#f59e0b)}
  .tcv2-box{background:var(--card);border-radius:16px;padding:20px;max-width:520px;width:90%;display:flex;flex-direction:column;gap:14px;position:relative}
  .tcv2-close{position:absolute;top:12px;right:12px;all:unset;cursor:pointer;padding:4px;border-radius:50%;background:var(--border);display:flex}
  .tcv2-close .material-symbols-outlined{font-size:20px}
  .tc-slot-wrap.can-view{cursor:pointer}
  .tc-thumb,.tc-thumb-ph{width:44px;height:44px;border-radius:6px;flex-shrink:0}
  .tc-thumb{object-fit:cover;display:block}
  .tc-thumb-ph{background:var(--border);display:flex;align-items:center;justify-content:center}
  .tc-thumb-ph .material-symbols-outlined{font-size:18px;color:var(--muted)}

  .tc-slot-wrap.can-view:hover .tc-view-hint{opacity:1}

  .al-cover.is-tray:hover img{transform:none}
  .cr-tray-embed{width:100%;height:100%;border:0;display:block;background:#fff}

  /* ── Modale pochette ────────────────────────────────────────────── */
  .cm{position:fixed;inset:0;z-index:60;background:rgba(6,7,10,.9);backdrop-filter:blur(6px);
    overflow-y:auto;padding:28px 16px;opacity:0;transition:opacity .18s}
  .cm.hidden{display:none}
  .cm.show{opacity:1}
  .cm-box{max-width:860px;margin:0 auto;background:var(--card);border:1px solid var(--border);
    border-radius:18px;padding:22px;position:relative}
  .cm-close{position:absolute;top:12px;right:12px;z-index:2}
  .cm-top{display:grid;grid-template-columns:260px 1fr;gap:22px;align-items:start}
  @media(max-width:640px){.cm-top{grid-template-columns:1fr}}
  .cm-art{display:flex;flex-direction:column;gap:16px}
  .cm-slot{display:flex;flex-direction:column;gap:6px}
  .cm-frame{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--border)}
  .cm-frame img{width:100%;display:block;cursor:zoom-in}
  /* Emplacement tray card vide : toujours présent, au format d'un inlay de
     boîtier CD (150×118 mm), et actionnable — c'est lui qui porte l'ajout,
     il n'y a donc plus de bouton « Ajouter une tray card » dans la barre. */
  .cm-frame.empty{border-style:dashed;aspect-ratio:150/118;background:var(--bg);
    display:flex;align-items:center;justify-content:center}
  /* app.css donne margin-top:16px et padding:11px à `button` : sans reset,
     un bouton qui remplit un cadre en sort. */
  .cm-empty,.cm-frame-act{margin:0;padding:0;border:0;font:inherit;background:transparent;
    display:flex;align-items:center;justify-content:center;gap:8px}
  .cm-empty{position:absolute;inset:0;flex-direction:column;color:var(--muted);

  .cm-empty .material-symbols-outlined{font-size:28px}
  .cm-ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center;gap:6px;color:var(--muted);font-size:12px;text-align:center}
  .cm-ph .material-symbols-outlined{font-size:28px}
  /* Remplacer une tray card existante : overlay au survol du cadre. */
  .cm-frame-act{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:8px 0;
    background:linear-gradient(transparent,rgba(6,7,10,.85));color:#fff;font-size:12px;
    font-weight:600;cursor:pointer;opacity:0;transition:opacity .15s}
  .cm-frame:hover .cm-frame-act,.cm-frame-act:focus-visible{opacity:1}

  /* Lightbox pour agrandir cover/traycard dans la modale */

    color:var(--muted);font-weight:700}
  .cm-tray-embed{width:100%;height:200px;border:0;display:block;background:var(--bg)}

  .cm-comments{margin-top:22px;border-top:1px solid var(--border);padding-top:6px}
  .cm-nav{display:flex;align-items:center;gap:8px;margin-top:14px}
  .cm-nav .spacer{flex:1}

  /* ── Formulaire d'import ────────────────────────────────────────── */
  .up{position:fixed;inset:0;z-index:70;background:rgba(6,7,10,.9);backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;padding:16px}

  .up-err{color:#e85d75;font-size:12.5px;margin-bottom:10px;display:none;line-height:1.45}

const L=()=>localStorage.getItem('l2m-lang')||'fr';
const t=k=>{const v=(T[L()]||T.fr)[k];return typeof v==='function'?v:v||k;};
function setLang(l){
  localStorage.setItem('l2m-lang',l);
  document.documentElement.lang=l;
  const _ll=document.getElementById('lang-label');if(_ll)_ll.textContent=l.toUpperCase();
  document.getElementById('t-back').textContent=t('back');
  const mg=document.getElementById('t-manage');if(mg)mg.textContent=t('manage');
  document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));
  if(window.applyI18n)applyI18n(l);
}

// Thème appliqué dans le <head> ; toggles gérés par le header unifié (L2M.initHeader).

// ── Cover générique ──────────────────────────────────────────────────────
const GENERIC_COVER=`<div class="cover-generic">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <circle cx="50" cy="50" r="44" fill="#2a2d38"/>
    <circle cx="50" cy="50" r="43" fill="none" stroke="#4a4d5a" stroke-width="1.5" opacity=".5"/>
    <circle cx="50" cy="50" r="38" fill="none" stroke="#4a4d5a" stroke-width="0.8" opacity=".4"/>
    <circle cx="50" cy="50" r="33" fill="none" stroke="#4a4d5a" stroke-width="0.8" opacity=".3"/>
    <circle cx="50" cy="50" r="26" fill="none" stroke="#4a4d5a" stroke-width="0.8" opacity=".25"/>
    <circle cx="50" cy="50" r="20" fill="#1a1c22"/>
    <circle cx="50" cy="50" r="19" fill="none" stroke="#4a4d5a" stroke-width="1" opacity=".4"/>
    <circle cx="50" cy="50" r="5" fill="#0a0a0a"/>
  </svg>
</div>`;

// ── Main ─────────────────────────────────────────────────────────────────
let ME={authenticated:false,is_gestionnaire:false};
let POSTERS={};

async function loadContent(){
  const gb=document.getElementById('gear-btn');
  if(ME.is_gestionnaire){gb.href=`/app/album/${slug}`;gb.style.display='';}
  else{gb.style.display='none';}

  let d;
  try{const r=await fetch(`/api/catalogue/${slug}`);if(!r.ok)throw 0;d=await r.json();}
  catch(e){showNotFound();return;}
  if(!d||!d.album){showNotFound();return;}
  COVER_AUTO=!!d.cover_auto;   // pochette = miniature d'import auto (crédit dédié)

  document.title=`live2mp3 — ${d.album.title||slug}`;

  if(d.imported_by){
    const ps=await fetch(`/api/social/profiles?u=${encodeURIComponent(d.imported_by)}`).then(r=>r.json()).catch(()=>({}));
    POSTERS=ps;
  }

  await loadCovers(d.has_cover, d.cover_v||0);
  renderAlbum(d);

  if(location.hash==='#comments'){
    setTimeout(()=>document.getElementById('sec-comments')?.scrollIntoView({behavior:'smooth',block:'start'}),350);
  }
}

async function loadPage(){
  setLang(L());
  document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));
  ME=await L2M.initHeader({onLangChange:l=>setLang(l)});
  await loadContent();
}

function posterFor(username){
  if(!username)return '';
  const p=POSTERS[username]||{};
  const prefixFn=T[L()].imported_by;
  const prefix=typeof prefixFn==='function'?prefixFn('',null).trim():'';
  return L2M.poster({username,display_name:p.display_name||username,avatar:!!p.avatar},prefix||undefined);
}

function dlSplit(icon,label,pngUrl,pdfUrl){
  return `<div class="dl-split">
    <a class="icon-btn" href="${pngUrl}"><span class="material-symbols-outlined">${icon}</span> ${label}</a>
    <button class="icon-btn dl-toggle" onclick="this.nextElementSibling.classList.toggle('open');event.stopPropagation()"><span class="material-symbols-outlined" style="font-size:16px">expand_more</span></button>
    <div class="dl-menu">
      <a href="${pngUrl}"><span class="material-symbols-outlined">image</span> ${t('dl_png')}</a>
      <a href="${pdfUrl}"><span class="material-symbols-outlined">picture_as_pdf</span> ${t('dl_pdf')}</a>
    </div>
  </div>`;
}

function renderAlbum(d){
  const a=d.album||{};
  const tags=(d.labels||[]).map(l=>`<span class="tag">${L2M.esc(l)}</span>`).join('');

  const tcMap={};
  for(const tc of(d.track_covers||[]))tcMap[tc.track_n]=tc;
  const set=(d.tracks||[]).map(tr=>{
    const dl=(ME.authenticated&&tr.dl)
      ?`<a href="/download/${slug}/track/${tr.n}" title="${t('dltrack')}"><span class="material-symbols-outlined">download</span></a>`:'';
    if(d.per_track_covers){
      const tc=tcMap[tr.n];
      const canView=!!tc;
      const inner=tc
        ?`<img class="tc-thumb" src="${tc.cover_thumb||tc.cover_url}" alt="${L2M.esc(tr.title)}" loading="lazy">`
        :`<span class="tc-thumb-ph"><span class="material-symbols-outlined">image</span></span>`;
      const hint=canView?`<div class="tc-view-hint"><span class="material-symbols-outlined">zoom_in</span></div>`:'';
      return `<li class="has-tc"><div class="tc-slot-wrap${canView?' can-view':''}" data-n="${tr.n}">${inner}${hint}</div><span class="n">${String(tr.n).padStart(2,'0')}</span><span class="tt">${L2M.esc(tr.title)}</span>${dl}</li>`;
    }
    return `<li><span class="n">${String(tr.n).padStart(2,'0')}</span><span class="tt">${L2M.esc(tr.title)}</span>${dl}</li>`;
  }).join('');

  let dlHtml='';
  if(ME.authenticated){
    let links='';
    if(d.has_mp3)links+=`<a class="primary" href="/download/${slug}/mp3"><span class="material-symbols-outlined">library_music</span> ${t('full')}</a>`;
    if(d.has_mp4)links+=`<a class="icon-btn" href="/download/${slug}/mp4"><span class="material-symbols-outlined">movie</span> MP4</a>`;
    if(d.has_cover)links+=dlSplit('image',t('cover'),`/download/${slug}/cover`,`/download/${slug}/cover/pdf`);
    if(d.has_traycard)links+=dlSplit('description',t('traycard'),`/download/${slug}/traycard`,`/download/${slug}/traycard/pdf`);
    if(links)dlHtml=`<div class="al-dl">${links}</div>`;
  }else{
    dlHtml=`<div class="al-dl"><span class="lock-inline"><span class="material-symbols-outlined">lock</span>${t('lockdl')}</span><a class="icon-btn" href="/outpost.goauthentik.io/start?rd=/album/${slug}" style="margin:0;height:32px;font-size:12.5px;padding:0 12px"><span class="material-symbols-outlined">login</span> ${t('login')}</a></div>`;
  }

  const srcUrl=d.source_url||'';
  const srcLabel=d.source_label||'';
  let sourceHtml='';
  if(srcUrl||srcLabel){
    const srcContent=srcUrl

async function initSocialActions(){

// ── Carrousel de pochettes ───────────────────────────────────────────────
// COVERS arrive déjà classé par le serveur (épinglée > plus likée) : l'index 0
// est la gagnante, donc l'affichage par défaut suit le classement sans calcul.
// Le carrousel ne défile pas COVERS mais SLIDES : chaque pochette y occupe une
// face, suivie de sa tray card quand elle en a une. La tray card reste ainsi
// une colonne de sa cover (jamais une entrée indépendante), et les flèches
// parcourent aussi bien les faces d'une pochette que les pochettes entre elles.
let COVERS=[], SLIDES=[], IDX=0, COVER_AUTO=false;

function buildSlides(){
  SLIDES=[];
  for(const c of COVERS){
    SLIDES.push({id:c.id,kind:'cover'});
    if(c.has_traycard)SLIDES.push({id:c.id,kind:'traycard'});
  }
}

// Se recaler sur une face précise après un reclassement (like, épinglage) :
// l'index n'a plus de sens, la paire id+face si.
function focusSlide(id,kind){
  const i=SLIDES.findIndex(s=>s.id===id&&s.kind===kind);
  IDX=i<0?SLIDES.findIndex(s=>s.id===id):i;
  if(IDX<0)IDX=0;
}

async function loadCovers(hasCoverFallback,coverV){
  try{
    const d=await fetch(`/api/social/albums/${slug}/covers`).then(r=>r.json());
    COVERS=d.covers||[];
  }catch(e){COVERS=[];}
  if(COVERS.length===0&&hasCoverFallback){
    // v=cover_v : refetch immédiat après remplacement de la pochette par un
    // gestionnaire (sinon on garde l'ancienne image en cache disque navigateur).
    const v=coverV||0;
    COVERS=[{id:0,cover_url:`/cover/${slug}?v=${v}`,
             cover_thumb:`/cover/${slug}?v=${v}&w=320`,
             cover_medium:`/cover/${slug}?v=${v}&w=640`,has_traycard:false,
             username:null,display_name:null,avatar:null,pinned:false,liked:false,likes:0}];
  }
  buildSlides();
  if(IDX>=SLIDES.length)IDX=0;
}

const curSlide=()=>SLIDES[IDX]||null;
const coverById=id=>COVERS.find(c=>c.id===id)||null;
const curCover=()=>{const s=curSlide();return s?coverById(s.id):null;};

function footerHtml(c,kind){
  if(!c)return `<div class="cr-footer" style="color:var(--muted);font-size:12px">${t('cv_none')}</div>`;
  // Pochette auto (miniature d'import) : créditée « Pochette automatique », au
  // même emplacement que « Pochette par X ». Vaut pour la pseudo-cover manifest
  // (id:0, COVER_AUTO) comme pour une vraie ligne marquée `auto`.
  if(kind==='cover'&&((!c.id&&COVER_AUTO)||c.auto))
    return `<div class="cr-footer"><span class="cr-auto"><span class="material-symbols-outlined">auto_awesome</span>${t('cover_auto_badge')}</span></div>`;
  if(!c.id)return `<div class="cr-footer"></div>`;
  const poster=L2M.poster(
    {username:c.username,display_name:c.display_name,avatar:c.avatar}, t('cv_by'));
  return `<div class="cr-footer">${poster}</div>`;
}

// La face d'une tray card n'est pas carrée et peut être un PDF : on la loge en
// entier (contain) au lieu de la rogner comme une pochette.
function faceHtml(c,kind){
  if(!c)return GENERIC_COVER;
  if(kind!=='traycard')return `<img src="${c.cover_medium||c.cover_url}" alt="">`;
  return c.traycard_kind==='pdf'
    ? `<iframe class="cr-tray-embed" src="${c.traycard_url}" title="${t('cv_tray')}"></iframe>`
    : `<img class="cr-fit" src="${c.traycard_url}" alt="${t('cv_tray')}">`;
}

function renderCarousel(){
  const col=document.getElementById('cover-col');
  if(!col)return;
  const s=curSlide(), c=curCover(), multi=SLIDES.length>1;
  const kind=s?s.kind:'cover';

  const uploadOverlay=ME.authenticated
    ?`<div class="cr-upload-overlay" id="cr-add" title="${t('cv_add')}"><span class="material-symbols-outlined">add_photo_alternate</span><span>${t('cv_add')}</span></div>`
    :'';

  col.innerHTML=`
    <div class="cr">
      <div class="al-cover${kind==='traycard'?' is-tray':''}" id="cr-art">${faceHtml(c,kind)}</div>
      ${c&&c.pinned&&kind==='cover'?`<span class="cr-pin" title="${t('cv_pinned')}"><span class="material-symbols-outlined">push_pin</span></span>`:''}
      ${multi?`<span class="cr-count">${IDX+1}/${SLIDES.length}</span>
        <button class="cr-arrow prev" id="cr-prev" title="${t('cv_prev')}"><span class="material-symbols-outlined">chevron_left</span></button>
        <button class="cr-arrow next" id="cr-next" title="${t('cv_next')}"><span class="material-symbols-outlined">chevron_right</span></button>`:''}
      ${uploadOverlay}
    </div>
    ${multi?`<div class="cr-dots">${SLIDES.map((sl,i)=>
      `<button class="cr-dot${sl.kind==='traycard'?' tray':''}${i===IDX?' on':''}" data-i="${i}"
        title="${sl.kind==='traycard'?t('cv_tray'):t('cv_cover')}"></button>`).join('')}</div>`:''}
    ${footerHtml(c,kind)}
  `;

  // Clic sur la pochette : vraie ligne sociale → fiche pochette (agrandir,
  // épingler, commenter) ; pseudo-cover manifest (id:0, fréquente quand la base
  // sociale de l'environnement n'a pas la ligne) → au moins l'agrandissement.
  const art=document.getElementById('cr-art');
  if(art&&c&&!(kind==='traycard'&&c.traycard_kind==='pdf')){
    if(c.id)art.onclick=()=>openCoverModal(c.id);
    else if(c.cover_url)art.onclick=()=>openLbx('image',c.cover_url);
  }
  const prev=document.getElementById('cr-prev'), next=document.getElementById('cr-next');
  if(prev)prev.onclick=()=>go(-1);
  if(next)next.onclick=()=>go(1);
  col.querySelectorAll('.cr-dot').forEach(d=>d.onclick=()=>{IDX=+d.dataset.i;renderCarousel();});
  const add=document.getElementById('cr-add');
  if(add&&ME.authenticated)add.onclick=e=>{e.stopPropagation();openUpload();};
}

function go(step){
  if(!SLIDES.length)return;
  IDX=(IDX+step+SLIDES.length)%SLIDES.length;   // circulaire
  renderCarousel();
}

async function toggleCoverLike(id){
  if(!ME.authenticated){location.href=L2M.loginUrl();return;}
  // Un like peut faire changer la gagnante : le serveur renvoie la liste
  // reclassée, on se recale donc sur la face regardée, pas sur l'index.
  const kind=curSlide()?.kind||'cover';
  try{
    const d=await fetch(`/api/social/covers/${id}/like`,{method:'POST'}).then(r=>r.json());
    COVERS=d.covers||[];
    buildSlides();
    focusSlide(id,kind);
    renderCarousel();
    if(!document.getElementById('cm').classList.contains('hidden'))paintModal(id);
  }catch(e){}
}

function VT(k){const l=(L2M.getLang?L2M.getLang():'fr');const d=VLANG[l]||VLANG.fr;return d[k]!==undefined?d[k]:VLANG.fr[k];}
// `cover` (1:1) est en lecture seule ici : elle vit dans le carrousel de la fiche.
// Les 3 autres sont les visuels Jellyfin gérés par /images/{kind}.
const VM_KINDS=['cover','thumbnail','banner','poster'];
const VM_IMG_KINDS=['thumbnail','banner','poster'];
const VM_RATIO={cover:'1:1',thumbnail:'16:9',banner:'1000×185',poster:'2:3'};
// Ratio numérique de la scène : elle prend la forme exacte du visuel attendu.
// Au-delà de 3 (bannière), la scène est trop basse pour un libellé → icône seule.
const VM_AR={cover:1,thumbnail:16/9,banner:1000/185,poster:2/3};
let VM_DATA={},VM_UP_KIND=null;

async function initVideo(d){
  const th=document.getElementById('vid-thumb');
  if(!th)return;
  th.onclick=()=>openVideoModal({play:true});
  th.setAttribute('role','button');th.setAttribute('tabindex','0');
  th.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openVideoModal({play:true});}};
  try{const r=await fetch(`/api/social/albums/${slug}/images/thumbnail`).then(r=>r.json());
    const w=(r.covers||[])[0];if(w)th.style.backgroundImage=`url(${w.cover_thumb||w.cover_url})`;}catch(e){}
}
const vm=document.getElementById('vm');
document.getElementById('vm-close').onclick=()=>closeVm();
vm.onclick=e=>{if(e.target===vm)closeVm();};
function closeVm(){
  // Couper le flux : sans ça le MP4 continue de se télécharger en fond.
  const v=document.getElementById('vm-video');
  if(v){v.pause();v.removeAttribute('src');v.load();}
  vm.classList.remove('show');setTimeout(()=>vm.classList.add('hidden'),180);
}
async function openVideoModal(opt){
  await loadVmImages();paintVm(opt&&opt.play);
  vm.classList.remove('hidden');requestAnimationFrame(()=>vm.classList.add('show'));
}
async function loadVmImages(){await Promise.all(VM_IMG_KINDS.map(async k=>{
  try{VM_DATA[k]=(await fetch(`/api/social/albums/${slug}/images/${k}`).then(r=>r.json())).covers||[];}catch(e){VM_DATA[k]=[];}}));}

// Emplacement « pochette » : réutilise la gagnante du carrousel (COVERS[0]),
// en lecture seule — un seul endroit gère les pochettes.
function vmCoverWinner(){
  const c=(COVERS||[])[0];
  if(!c)return null;
  return {id:c.id,cover_url:c.cover_url,cover_medium:c.cover_medium||c.cover_url,
          dl:c.id?`/download/cover/${c.id}`:`/download/${slug}/cover`};
}

function vmSlotHtml(kind){
  const ro=(kind==='cover');
  const list=ro?[]:(VM_DATA[kind]||[]);
  const win=ro?vmCoverWinner():(list[0]||null);

  const flat=VM_AR[kind]>3;  // bannière : pas la place d'un libellé
  const stage=win
    ?`<img src="${win.cover_medium||win.cover_url}" alt="${VT('k_'+kind)}" loading="lazy" decoding="async">`
    :`<span class="vm-slot-ph">
        <span class="material-symbols-outlined" aria-hidden="true">${(!ro&&ME.authenticated)?'add_photo_alternate':'image'}</span>${
        flat?'':`<span>${(!ro&&ME.authenticated)?VT('imp'):VT('empty_ro')}</span>`}</span>`;

  const note=ro?`<span class="vm-hint" title="${VT('cover_note')}">${VT('cover_hint')}</span>`:'';
  const badge=(win&&win.auto)?`<span class="vm-auto"><span class="material-symbols-outlined" aria-hidden="true">auto_awesome</span>${VT('auto')}</span>`:'';
  const cnt=list.length>1?`<span class="vm-count">${VT('count')(list.length)}</span>`:'';

  return `<button class="vm-slot" data-slot="${kind}" title="${VT('open_slot')(VT('k_'+kind))}">
    <div class="vm-slot-head"><b>${VT('k_'+kind)}</b><span class="vm-ratio">${VM_RATIO[kind]}</span>${badge}${note}${cnt}</div>
    <div class="vm-stage-wrap"><div class="vm-stage${win?' filled':''}"
      style="aspect-ratio:${VM_AR[kind]};width:min(100%,calc(var(--vm-band) * ${VM_AR[kind]}))">${stage}</div></div>
  </button>`;
}

// « Tout télécharger » n'apparaît que s'il y a au moins un visuel à mettre dans
// le ZIP : un bouton qui renverrait un 404 n'a rien à faire là.
function vmSecHeadHtml(){
  const anyArt=!!vmCoverWinner()||VM_IMG_KINDS.some(k=>(VM_DATA[k]||[]).length);
  const dlAll=(ME.authenticated&&anyArt)
    ?`<a class="vm-dl-all" href="/download/${slug}/artwork" title="${VT('dl_all_t')}">

    ?`<div class="vm-player"><video id="vm-video" controls preload="metadata" playsinline

    ?`<a class="vm-dl-mp4" href="/download/${slug}/video"><span class="material-symbols-outlined" aria-hidden="true">download</span> ${VT('dl_mp4')}</a>`

    <p class="vm-sec-sub">${VT('art_sub')}</p>
    <div class="vm-slots">${VM_KINDS.map(vmSlotHtml).join('')}</div>`;
  vmBindSlots();
  if(autoplay){const v=document.getElementById('vm-video');if(v)v.play().catch(()=>{});}
}
function vmBindSlots(){
  document.querySelectorAll('#vm-body [data-slot]').forEach(b=>b.onclick=()=>openVsSheet(b.dataset.slot));
}
// ── Fiche d'un visuel (par-dessus la fenêtre vidéo) ───────────────────────
const vs=document.getElementById('vs');
let VS_KIND=null;
document.getElementById('vs-close').onclick=()=>closeVs();
vs.onclick=e=>{if(e.target===vs)closeVs();};
function closeVs(){VS_KIND=null;vs.classList.remove('show');setTimeout(()=>vs.classList.add('hidden'),180);}
function openVsSheet(kind){
  VS_KIND=kind;paintVs();
  vs.classList.remove('hidden');requestAnimationFrame(()=>vs.classList.add('show'));
}
function paintVs(){
  const kind=VS_KIND;if(!kind)return;
  const ro=(kind==='cover');
  const list=ro?[]:(VM_DATA[kind]||[]);
  const win=ro?vmCoverWinner():(list[0]||null);
  const g=ME.is_gestionnaire&&!ro;
  const ar=VM_AR[kind];
  // Cadre au ratio du visuel, borné pour ne pas sortir de la fiche.
  const frame=`width:min(100%,calc(46vh * ${ar}));aspect-ratio:${ar}`;
  const inner=win
    ?`<img id="vs-img" src="${win.cover_medium||win.cover_url}" alt="${VT('k_'+kind)}">`
    :`<span class="vm-slot-ph" style="position:absolute;inset:0">
        <span class="material-symbols-outlined" aria-hidden="true">image</span>
        <span>${(!ro&&ME.authenticated)?VT('empty'):VT('empty_ro')}</span></span>`;

  const dl=(win&&ME.authenticated)
    ?`<a class="vm-act" href="${ro?win.dl:`/download/cover/${win.id}`}">
        <span class="material-symbols-outlined" aria-hidden="true">download</span>${VT('dl')}</a>`:'';
  const imp=(!ro&&ME.authenticated)
    ?`<button class="vm-act" id="vs-imp">
        <span class="material-symbols-outlined" aria-hidden="true">add_photo_alternate</span>${win?VT('repl'):VT('impn')}</button>`:'';
  const pin=(win&&g)?`<button class="vm-act${win.pinned?' on':''}" id="vs-pin">
        <span class="material-symbols-outlined" aria-hidden="true">push_pin</span>${win.pinned?VT('unpin'):VT('pin')}</button>`:'';
  const del=(win&&g)?`<button class="vm-act danger" id="vs-del">
        <span class="material-symbols-outlined" aria-hidden="true">delete</span>${VT('del')}</button>`:'';
  const badge=(win&&win.auto)?`<span class="vm-auto"><span class="material-symbols-outlined" aria-hidden="true">auto_awesome</span>${VT('auto')}</span>`:'';

  document.getElementById('vs-body').innerHTML=`
    <h3 class="vm-title"><span class="material-symbols-outlined" aria-hidden="true">image</span>
      ${VT('k_'+kind)}<span class="vm-ratio">${VM_RATIO[kind]}</span>${badge}</h3>
    <div class="vs-frame${win?'':' empty'}" style="${frame}">${inner}</div>
    <div class="vs-actions">${dl}${imp}<span class="vs-right">${pin}${del}</span></div>
    ${ro?`<p class="vs-note">${VT('cover_note')}</p>`:''}`;

  const img=document.getElementById('vs-img');
  if(img)img.onclick=()=>openLbx('image',win.cover_url||win.cover_medium);
  const bi=document.getElementById('vs-imp');
  if(bi)bi.onclick=()=>{VM_UP_KIND=kind;document.getElementById('vm-file').click();};
  const bp=document.getElementById('vs-pin');
  if(bp)bp.onclick=()=>vmPin(win.id);
  const bd=document.getElementById('vs-del');
  if(bd)bd.onclick=()=>vmDel(win.id);
}

document.getElementById('vm-file').onchange=async e=>{
  const f=e.target.files[0];e.target.value='';if(!f||!VM_UP_KIND)return;
  const fd=new FormData();fd.append('cover',f);
  try{const r=await fetch(`/api/social/albums/${slug}/images/${VM_UP_KIND}`,{method:'POST',body:fd});
    if(r.ok){VM_DATA[VM_UP_KIND]=(await r.json()).covers||[];vmRepaintKeepPlayback();vmSyncThumb();}
    else alert('Erreur ('+r.status+')');}catch(e){alert('Erreur réseau');}
};
async function vmPin(id){try{await fetch(`/api/social/covers/${id}/pin`,{method:'POST'});await loadVmImages();vmRepaintKeepPlayback();vmSyncThumb();}catch(e){}}
async function vmDel(id){if(!confirm(VT('confirm_del')))return;try{await fetch(`/api/social/covers/${id}`,{method:'DELETE'});await loadVmImages();vmRepaintKeepPlayback();vmSyncThumb();}catch(e){}}
// Gérer un visuel ne doit pas interrompre la lecture : on ne redessine que la
// grille de visuels, jamais le <video> (le recréer relancerait le buffering).
function vmRepaintKeepPlayback(){
  if(VS_KIND)paintVs();
  const grid=document.querySelector('#vm-body .vm-slots');
  if(!grid){paintVm(false);return;}
  grid.innerHTML=VM_KINDS.map(vmSlotHtml).join('');
  // Le premier visuel importé fait apparaître « Tout télécharger ».
  const head=document.getElementById('vm-sec-h');
  if(head)head.innerHTML=vmSecHeadHtml();
  vmBindSlots();
}
function vmSyncThumb(){const th=document.getElementById('vid-thumb');if(!th)return;const w=(VM_DATA.thumbnail||[])[0];th.style.backgroundImage=w?`url(${w.cover_thumb||w.cover_url})`:'';}

// ── Modale d'une pochette ────────────────────────────────────────────────
const cm=document.getElementById('cm');
document.getElementById('cm-close').onclick=closeModal;
cm.onclick=e=>{if(e.target===cm)closeModal();};

function closeModal(){
  cm.classList.remove('show');
  setTimeout(()=>cm.classList.add('hidden'),180);
}

function openCoverModal(id){
  paintModal(id);
  cm.classList.remove('hidden');
  requestAnimationFrame(()=>cm.classList.add('show'));
  L2M.comments(document.getElementById('cm-comments'),slug,{coverId:id});
}

function paintModal(id){
  const c=COVERS.find(x=>x.id===id);
  if(!c)return;
  // Une pochette « auto » (reprise du manifest) n'a pas d'auteur : elle est
  // créditée comme telle, et n'est pas supprimable — elle serait recréée à la
  // lecture suivante. Pour s'en débarrasser on en propose une vraie, qui passe
  // devant (auto=0 gagne toujours).
  const mine=ME.authenticated&&!c.auto&&(c.username===ME.username||ME.is_gestionnaire);
  // La tray card a TOUJOURS son emplacement, même vide : c'est lui qui porte
  // l'ajout (plus de bouton « Ajouter une tray card » dans la barre d'actions).
  const trayInner=c.has_traycard
    ?(c.traycard_kind==='pdf'
        ?`<iframe class="cm-tray-embed" src="${c.traycard_url}" title="${t('cv_tray')}"></iframe>`
        :`<img id="cm-tray-img" src="${c.traycard_url}" alt="${t('cv_tray')}">`)
      +(mine?`<button class="cm-frame-act" id="cm-tray-rep">
          <span class="material-symbols-outlined" aria-hidden="true">note_add</span>${t('cv_replace_tray')}</button>`:'')
    :(mine
        ?`<button class="cm-empty" id="cm-tray-add">
            <span class="material-symbols-outlined" aria-hidden="true">note_add</span>
            <span>${t('cv_add_tray')}</span></button>`
        :`<span class="cm-ph"><span class="material-symbols-outlined" aria-hidden="true">description</span>
            <span>${t('cv_no_tray')}</span></span>`);
  const tray=`<div class="cm-slot">
      <div class="lbl">${t('cv_tray')}</div>
      <div class="cm-frame${c.has_traycard?'':' empty'}" id="cm-tray-frame">${trayInner}</div>
    </div>`;

  document.getElementById('cm-body').innerHTML=`
    <div class="cm-top">
      <div class="cm-art">
        <div class="cm-slot">
          <div class="lbl">${t('cv_cover')}</div>
          <div class="cm-frame"><img id="cm-cover-img" src="${c.cover_thumb||c.cover_url}"
            alt="${t('cv_cover')}" loading="lazy" decoding="async"></div>
        </div>
        ${tray}
      </div>
      <div>
        <div class="cr-credit" style="margin-top:0">${c.auto
          ?`<span class="cr-auto"><span class="material-symbols-outlined" aria-hidden="true">auto_awesome</span>${t('cover_auto_badge')}</span>`
          :L2M.poster({username:c.username,display_name:c.display_name,avatar:c.avatar},t('cv_by'))}
          ${c.pinned?`<span class="cr-tray-badge"><span class="material-symbols-outlined">push_pin</span>${t('cv_pinned')}</span>`:''}
        </div>
        ${c.caption?`<p class="cm-caption">${L2M.esc(c.caption)}</p>`:''}
        <div class="social-actions" style="margin-top:12px">
          <button class="soc-action${c.liked?' liked':''}" id="cm-like"
            title="${ME.authenticated?t('like'):t('login_to_like')}">
            <span class="material-symbols-outlined">favorite</span>${c.likes}</button>
          <button class="soc-action" id="cm-comment" title="${t('cv_comments')}">
            <span class="material-symbols-outlined">comment</span>${c.comments}</button>
        </div>
        <div class="cm-actions">
          ${ME.authenticated?dlSplit('image',t('cv_dl_cover'),`/download/cover/${c.id}`,`/download/cover/${c.id}/pdf`):''}
          ${ME.authenticated&&c.has_traycard?dlSplit('description',t('cv_dl_tray'),`/download/traycard/${c.id}`,`/download/traycard/${c.id}/pdf`):''}
          ${ME.is_gestionnaire?`<button class="icon-btn" id="cm-pin">
            <span class="material-symbols-outlined">push_pin</span>
            ${c.pinned?t('cv_unpin'):t('cv_pin')}</button>`:''}
          ${mine?`<button class="icon-btn" id="cm-del">
            <span class="material-symbols-outlined">delete</span> ${t('cv_delete')}</button>`:''}
        </div>
      </div>
    </div>`;

  // Agrandir la pochette
  const cmCoverImg=document.getElementById('cm-cover-img');
  if(cmCoverImg)cmCoverImg.onclick=e=>{e.stopPropagation();openLbx('image',c.cover_url);};
  // Agrandir la tray card (image, ou PDF : l'iframe ne reçoit pas le clic,
  // c'est le cadre qui l'ouvre).
  const cmTrayImg=document.getElementById('cm-tray-img');
  if(cmTrayImg)cmTrayImg.onclick=e=>{e.stopPropagation();openLbx('img',c.traycard_url);};
  const cmTrayFrame=document.querySelector('#cm-body .cm-tray-embed');
  if(cmTrayFrame){
    cmTrayFrame.style.pointerEvents='none';
    const box=document.getElementById('cm-tray-frame');
    box.style.cursor='zoom-in';
    box.onclick=e=>{e.stopPropagation();openLbx('pdf',c.traycard_url);};
  }
  document.getElementById('cm-like').onclick=()=>toggleCoverLike(c.id);
  // Dans la modale les commentaires sont déjà rendus plus bas : on y amène.
  document.getElementById('cm-comment').onclick=()=>
    document.getElementById('cm-comments')?.scrollIntoView({behavior:'smooth',block:'start'});
  const pin=document.getElementById('cm-pin');
  if(pin)pin.onclick=async()=>{
    const kind=curSlide()?.kind||'cover';
    const d=await fetch(`/api/social/covers/${c.id}/pin`,{method:'POST'}).then(r=>r.json());
    COVERS=d.covers||[];
    buildSlides();
    focusSlide(c.id,kind);
    renderCarousel();paintModal(c.id);
  };
  const del=document.getElementById('cm-del');
  if(del)del.onclick=async()=>{
    if(!confirm(t('cv_del_confirm')))return;
    const d=await fetch(`/api/social/covers/${c.id}`,{method:'DELETE'}).then(r=>r.json());
    // La cover et sa tray card disparaissent ensemble : aucune face à retrouver.
    COVERS=d.covers||[];buildSlides();IDX=0;
    closeModal();renderCarousel();
  };
  // Ajout / remplacement de la tray card : porté par l'emplacement lui-même.
  ['cm-tray-add','cm-tray-rep'].forEach(bid=>{
    const b=document.getElementById(bid);
    if(b)b.onclick=e=>{e.stopPropagation();openUpload(c.id);};
  });
}

// ── Import d'une pochette / d'une tray card ──────────────────────────────
const up=document.getElementById('up');
let UP_TARGET=null;   // null = nouvelle pochette ; id = tray card d'une pochette

function openUpload(coverId){
  UP_TARGET=coverId||null;
  const tray=UP_TARGET!==null;
  document.getElementById('up-title').textContent=tray?t('tray_title'):t('up_title');
  document.getElementById('up-hint').textContent=tray?'':t('up_hint');
  document.getElementById('up-cover-lbl').textContent=t('up_cover');
  document.getElementById('up-tray-lbl').textContent=t('up_tray');
  document.getElementById('up-caption-lbl').textContent=t('up_caption');
  document.getElementById('up-send').textContent=tray?t('tray_send'):t('up_send');
  document.getElementById('up-cancel').textContent=t('up_cancel');
  // En mode tray card seule, la pochette est déjà choisie : on ne redemande
  // ni image ni légende, seulement le fichier à rattacher.
  document.getElementById('up-cover-field').style.display=tray?'none':'';
  document.getElementById('up-caption-field').style.display=tray?'none':'';
  document.getElementById('up-tray-lbl').textContent=tray?t('cv_tray'):t('up_tray');
  document.getElementById('up-err').classList.remove('show');
  document.getElementById('up-cover').value='';
  document.getElementById('up-tray').value='';
  document.getElementById('up-caption').value='';
  up.classList.remove('hidden');
}
function closeUpload(){up.classList.add('hidden');}
document.getElementById('up-cancel').onclick=closeUpload;
up.onclick=e=>{if(e.target===up)closeUpload();};

document.getElementById('up-send').onclick=async()=>{
  const err=document.getElementById('up-err');
  const btn=document.getElementById('up-send');
  const coverF=document.getElementById('up-cover').files[0];
  const trayF=document.getElementById('up-tray').files[0];
  // .up-err est masqué en CSS : il faut une classe pour l'afficher
  // (style.display='' retombait sur display:none => erreurs invisibles).
  const showErr=msg=>{err.textContent=msg;err.classList.add('show');};
  err.classList.remove('show');

  if(UP_TARGET===null&&!coverF){showErr(t('up_need_cover'));return;}
  if(UP_TARGET!==null&&!trayF){showErr(t('up_need_tray'));return;}
  btn.disabled=true;
  try{
    const fd=new FormData();
    let r;
    if(UP_TARGET!==null){
      fd.append('traycard',trayF);
      r=await fetch(`/api/social/covers/${UP_TARGET}/traycard`,{method:'PUT',body:fd});
    }else{
      fd.append('cover',coverF);
      if(trayF)fd.append('traycard',trayF);
      fd.append('caption',document.getElementById('up-caption').value||'');
      r=await fetch(`/api/social/albums/${slug}/covers`,{method:'POST',body:fd});
    }
    if(r.status===401){
      // Jeton SSO expiré alors que la page était ouverte : nginx retombe en
      // anonyme. Le SSO Authentik étant encore valide, le lien reconnecte
      // aussitôt et ramène sur cette fiche.
      showErr(t('up_expired')+' ');
      const a=document.createElement('a');
      a.href=L2M.loginUrl();a.textContent=t('up_relogin');
      err.appendChild(a);return;
    }
    if(r.status===403){showErr(t('up_forbidden'));return;}
    if(!r.ok){
      const d=await r.json().catch(()=>({}));
      showErr(typeof d.detail==='string'?d.detail:t('up_failed'));return;
    }
    const d=await r.json();
    COVERS=d.covers||[];
    buildSlides();
    // UP_TARGET renseigné = on vient d'ajouter/remplacer une tray card : on
    // montre la face qu'on vient de produire, pas la pochette qui la porte.
    const focus=UP_TARGET!==null?UP_TARGET:d.cover_id;
    focusSlide(focus,UP_TARGET!==null?'traycard':'cover');
    closeUpload();
    renderCarousel();
    if(!cm.classList.contains('hidden'))paintModal(focus);
  }catch(e){
    showErr(t('up_failed'));
  }finally{btn.disabled=false;}
};

// Flèches clavier : navigation dans le carrousel, hors saisie de texte.
document.addEventListener('keydown',e=>{
  if(!cm.classList.contains('hidden')||!up.classList.contains('hidden'))return;
  if(/^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName||''))return;
  if(e.key==='ArrowLeft')go(-1);
  if(e.key==='ArrowRight')go(1);
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  const lbx=document.getElementById('lbx-overlay');
  if(lbx&&lbx.classList.contains('open')){closeLbx();return;}
  if(!up.classList.contains('hidden')){closeUpload();return;}
  if(!cm.classList.contains('hidden'))closeModal();
});

function showNotFound(){
  document.getElementById('content').innerHTML=
    `<div class="not-found"><span class="material-symbols-outlined">album</span>${t('not_found')}</div>`;
}

// ── Lightbox (agrandir image dans la modale pochette) ────────────────────────
function openLbx(type,url){
  const inner=document.getElementById('lbx-inner');
  if(!inner)return;
  if(type==='image'){
    inner.innerHTML=`<img src="${url}" alt="">`;
  }else if(type==='pdf'){
    inner.innerHTML=`<iframe src="${url}" title="Tray card"></iframe>`;
  }else if(type==='img'){
    inner.innerHTML=`<img src="${url}" alt="">`;
  }
  document.getElementById('lbx-overlay').classList.add('open');
}
function closeLbx(e){
  if(e&&e.target!==document.getElementById('lbx-overlay'))return;
  document.getElementById('lbx-overlay').classList.remove('open');
  document.getElementById('lbx-inner').innerHTML='';
}

// ── Navigation prev/next album ────────────────────────────────────────────
let _navData={prev:null,next:null};

async function initAlbumNav(){
  const prev=document.getElementById('nav-prev');
  const next=document.getElementById('nav-next');
  if(!prev||!next)return;
  try{
    _navData=await fetch(`/api/catalogue/${slug}/nav`).then(r=>r.json());
  }catch(e){return;}
  prev.classList.add('visible');
  next.classList.add('visible');
  if(!_navData.prev)prev.classList.add('disabled');
  if(!_navData.next)next.classList.add('disabled');
}

async function navAlbum(dir){
  const target=dir===-1?_navData.prev:_navData.next;
  if(!target)return;
  const _m=document.querySelector('main');
  _m.style.transition='opacity .2s ease';
  _m.style.opacity='0';
  await new Promise(r=>setTimeout(r,200));
  history.pushState(null,'','/album/'+target);
  slug=target;
  window.scrollTo(0,0);
  _m.style.transition='none';
  _m.style.opacity='0';
  await loadContent();
  await initAlbumNav();
  _m.style.transition='opacity .25s ease';
  _m.style.opacity='1';
}

async function loadVersion(){
  try{
    const v=await(await fetch("/api/version")).json();
    const cls=v.env==="prod"?"":"env-preprod";
    const commit=v.commit?` · ${v.commit}`:"";
    const el=document.getElementById("site-foot");
    if(el)el.innerHTML=`<a href="/changelog" class="badge ${cls}">v${v.version} · ${v.env}${commit}</a>`;
  }catch(e){}
}
loadPage();
loadVersion();
setTimeout(initAlbumNav, 0);
window.addEventListener('popstate',async()=>{
  slug=decodeURIComponent((location.pathname.split('/album/')[1]||'').replace(/\/$/,''));
  const _m=document.querySelector('main');
  _m.style.transition='none';_m.style.opacity='0';
  await loadContent();
  await initAlbumNav();
  _m.style.transition='opacity .25s ease';_m.style.opacity='1';
});
