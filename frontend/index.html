<!doctype html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>live2mp3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">
<link rel="stylesheet" href="/static/app.css">
<script src="https://unpkg.com/peaks.js/dist/peaks.min.js"></script>
</head>
<body>
<header>
  <div class="brand"><span class="material-symbols-outlined">album</span> live2mp3</div>
  <div class="tools">
    <button id="lang" class="icon-btn" title="Langue"><span class="material-symbols-outlined">translate</span><span id="lang-label">FR</span></button>
    <button id="theme" class="icon-btn" title="Thème"><span class="material-symbols-outlined">dark_mode</span></button>
  </div>
</header>

<main>
  <!-- Étape 1 : formulaire -->
  <section id="step-form" class="card">
    <h1 data-i18n="form_title">Nouveau concert</h1>
    <div class="grid">
      <label data-i18n="artist">Artiste<input id="f-artist" placeholder="Twenty One Pilots"></label>
      <label data-i18n="album">Album<input id="f-title" placeholder="The Clancy Tour — Live"></label>
      <label data-i18n="date">Date<input id="f-date" type="date"></label>
      <label data-i18n="venue">Lieu<input id="f-venue" placeholder="Indianapolis, IN"></label>
      <label data-i18n="festival">Festival<input id="f-festival"></label>
      <label data-i18n="target">Type de disque
        <select id="f-target">
          <option value="data_disc" data-i18n="data_disc">Disque de données (ISO)</option>
          <option value="audio_cd" data-i18n="audio_cd">CD audio (CUE+WAV)</option>
        </select>
      </label>
      <label class="full" data-i18n="source">Lien source<input id="f-url" placeholder="https://..."></label>
      <label class="full" data-i18n="setlist">Setlist (un titre par ligne)
        <textarea id="f-setlist" rows="8" placeholder="Overcompensate&#10;Shy Away / Heathens / Next Semester"></textarea>
      </label>
    </div>
    <p class="note" data-i18n="dvd_note"><span class="material-symbols-outlined">info</span> DVD-Video est hors périmètre V1.</p>
    <button id="btn-create" class="primary"><span class="material-symbols-outlined">rocket_launch</span> <span data-i18n="create">Créer le projet</span></button>
  </section>

  <!-- Étape 2 : progression -->
  <section id="step-progress" class="card hidden">
    <h1 data-i18n="progress_title">Traitement</h1>
    <ul id="stages" class="stages"></ul>
  </section>

  <!-- Étape 3 : éditeur waveform -->
  <section id="step-editor" class="card hidden">
    <h1 data-i18n="editor_title">Ajustement des coupes</h1>
    <div id="peaks-container">
      <div id="overview"></div>
      <div id="zoom"></div>
    </div>
    <div class="actions">
      <button id="btn-express" class="primary"><span class="material-symbols-outlined">bolt</span> <span data-i18n="express">Valider et rendre</span></button>
      <button id="btn-precision"><span class="material-symbols-outlined">tune</span> <span data-i18n="precision">Mode précision</span></button>
    </div>
  </section>

  <!-- Étape 4 : récap -->
  <section id="step-done" class="card hidden">
    <h1 data-i18n="done_title">Terminé</h1>
    <div id="summary"></div>
    <a id="btn-download" class="primary" href="#"><span class="material-symbols-outlined">download</span> <span data-i18n="download">Télécharger le bundle</span></a>
  </section>
</main>

<script src="/static/i18n.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
